      <!-- 근무형태 — 여러 개를 함께 고를 수 있습니다.
           「정규직이든 계약직이든 상관없다」 는 경우가 많아 체크 상자로 둡니다. -->

        <div id="rcEmp" class="rc-checks"></div>
      </div>
      <!-- 지역 — 1차·2차를 <b>폼과 똑같은 칸</b>에 하나씩 놓습니다.
           따로 감싸서 나누면 여백 셈이 달라져 풀다운 폭이 어긋납니다.
           2차 쪽 라벨은 자리만 차지하게 두어 위아래가 가지런합니다. -->
      <div class="rc-fld">
        <label for="rcR1">지역</label>
        <select id="rcR1" aria-label="1차지역"></select>
      </div>
      <div class="rc-fld">
        <label class="rc-lbl-ghost" aria-hidden="true">지역</label>
        <select id="rcR2" aria-label="2차지역"></select>
      </div>
      <!-- 기간·급여는 고르는 글자가 짧아 한 줄에 둘씩 놓습니다.
           근무형태와 키워드는 오른쪽 도구줄로 옮겼습니다 (중복을 없애려고) -->

        <label for="rcDays">기간</label>
        <select id="rcDays" aria-label="근무요일"></select>
      </div>
      <div class="rc-fld">
        <label for="rcPay">급여</label>
        <select id="rcPay" aria-label="급여"></select>
      </div>
    </div>
    <div class="rc-actions">
      <button type="button" id="rcGo" class="rc-btn rc-btn--go">
        선택조건으로 검색

      </button>
      <button type="button" id="rcReset" class="rc-btn">초기화</button>

  </div><!-- /rc-finder -->
  </aside>

  <!-- ── 오른쪽 · 목록 ───────────────────────────────────── -->

  <!-- ── 붙어 따라오는 덩어리 — 도구줄과 건수줄 ──────────

  <!-- ── 도구줄 — 다른 게시판(인물DB 등)과 같은 짜임 ────── -->
  <div class="pdb-toolbar rc-toolbar">
    <div class="pdb-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="rcKw" placeholder="단체명 · 채용제목 · 직무로 검색">
      <button class="pdb-searchbtn" type="button" id="rcSearchBtn">검색</button>
    </div>
    <div class="pdb-selects">
      <!-- 직종별 — 대분류를 한 번에 고르는 빠른 길입니다.

<script src="/assets/recruit-list.js"></script>
<script>
  /* 채용정보 목록 — 엔진은 인재정보와 함께 씁니다(assets/recruit-list.js) */
  document.addEventListener('DOMContentLoaded', function () {
    OCRecruitList.init({
      kind: 'job',
      table: 'recruit_jobs',
      viewPage: '/recruit/job-view.html',
      writePage: '/recruit/job-write.html',
      pageSize: 15,
    });

    /* 「채용정보등록」 단추는 <b>승인된</b> 음악관계자·단체·기업·음악학교
       회원에게만 보입니다. 서버에서도 막고 있지만(oc_is_hiring), 할 수 없는
       단추를 보여 주는 것은 누른 뒤에 거절당하는 것보다 불친절합니다.

       ★ 이 자리에 있던 세 가지를 고쳤습니다 —
         ⑴ 접속 객체를 따로 만들고 있었습니다. 여러 개가 같은 저장 열쇠를
            다투면 세션 토큰이 질의에 안 실립니다 → window.__ocSb 하나만 씁니다
         ⑵ select('member_type,is_admin') 로 칸을 지정했습니다. 없는 칸을
            적으면 질의 전체가 죽어 「자격 없음」 으로 오독됩니다 → select('*')
         ⑶ <b>org(단체·기업)가 빠져 있었습니다.</b> 채용의 주체인 단체·기업
            회원에게 이 단추가 아예 보이지 않았습니다
            → 회원 종류 목록은 recruit.js 의 roleOf() 한 곳에만 둡니다 */
    (function () {
      var btn = document.getElementById('rcWrite');
      if (!btn) return;
      var R = window.OCRecruit;
      if (!R) return;
      var c = R.client();
      if (!c) return;
      c.auth.getSession().then(function (r) {
        var u = r.data && r.data.session && r.data.session.user;
        if (!u) return;
        c.from('members').select('*').eq('id', u.id).maybeSingle()
         .then(function (mr) {
           if (R.roleOf(mr.data || {}).hiring) btn.removeAttribute('hidden');
         });
      });
    })();
  });
</script>

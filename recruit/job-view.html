<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('oc-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채용정보 · 리쿠르트 · OPUSCLAM.COM</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#0a0d24">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPUSCLAM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/board.css">
<link rel="stylesheet" href="/assets/recruit.css">
</head>
<body data-header="overlay">
<div id="oc-header"></div>
<script src="/assets/include.js"></script>
<script src="/assets/header.js"></script>
<script src="/assets/hero-scene.js" defer></script>

<section class="pdb pdb-board">
  <div class="pdb-bg" aria-hidden="true">
    <div class="wave"></div>
    <div class="scene scene-hire on">
      <svg viewBox="0 0 1280 460" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7FD6"/><stop offset="1" stop-color="#C9A94E"/></linearGradient></defs>
        <g fill="url(#dg)"></g>
      </svg>
    </div>
  </div>
  <div class="pdb-inner">

    <nav class="pdb-crumb" aria-label="위치">
      <a href="/home.html">홈</a><span>/</span><a href="/recruit/job.html">리쿠르트</a><span>/</span><a href="/recruit/job.html">채용정보</a><span>/</span><span class="on">상세</span>
    </nav>

    <!-- 리쿠르트 하위 메뉴 — partials/subnav-recruit.html 한 곳에서 관리합니다 -->
    <div id="oc-subnav" data-src="/partials/subnav-recruit.html"></div>

    <header class="pdb-head">
      <div class="pdb-titlebar">
        <div>
          <div class="pdb-eyebrow">OPUSCLAM RECRUIT SERVICE</div>
          <h1 class="pdb-title">채용정보</h1>
        </div>
      </div>
      <p class="pdb-lead">순수음악 분야의 연주자·행정직·강사 채용 정보를 모았습니다.</p>
    </header>
  </div>
</section>

<main class="board rc-wrap">
 <div class="rv-layout">

  <!-- ── 왼쪽 · 채용 상세 ─────────────────────────────────────
       안쪽은 assets/recruit-view.js 가 그립니다.
       비어 있는 칸은 줄째로 빼므로, 등록하지 않은 항목이
       빈칸으로 남아 헷갈리는 일이 없습니다. -->
  <div class="rv-main">
    <article class="rv-doc" id="rvDoc">
      <div class="rv-loading">불러오는 중…</div>
    </article>
  </div>

  <!-- ── 오른쪽 · 다른 채용정보 ───────────────────────────────
       목록 엔진(assets/recruit-list.js)을 그대로 씁니다.
       mini 로 부르면 두 칸(제목·마감)만 그립니다 —
       460px 자리에는 다섯 칸이 들어가지 않습니다.

       제목을 누르면 화면을 새로 불러오지 않고 <b>왼쪽만</b> 바뀝니다.
       보고 있던 목록의 자리가 그대로 남아야 다음 공고로 이어 볼 수 있습니다. -->
  <aside class="rv-aside">
   <div class="rv-aside-box">
    <h2 class="rv-aside-h">다른 채용정보</h2>

    <!-- 직종구분 — 이 화면에는 왼쪽 찾는 칸이 없으므로
         갈래를 바꾸는 길이 이 풀다운 하나입니다.
         엔진(assets/recruit-list.js)이 #rcCat 을 보고 채웁니다 —
         목록 화면과 같은 코드라 따로 만들 것이 없습니다. -->
    <div class="rv-aside-tool">
      <select id="rcCat" aria-label="직종구분"></select>
    </div>

    <div class="pdb-tablewrap">
      <table class="pdb-table rc-table rc-table--mini">
        <thead>
          <tr>
            <th class="c-no">No</th>
            <th class="c-title">채용제목</th>
            <th class="c-when">마감</th>
          </tr>
        </thead>
        <tbody id="rcList"></tbody>
      </table>
    </div>

    <div class="rc-foot">
      <div id="rcPager" class="rc-pager"></div>
    </div>
   </div>
  </aside>

 </div><!-- /rv-layout -->
</main>

<!-- 광고 배너와 푸터는 assets/app.js 가 여기에 넣습니다 -->
<div id="oc-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>

<script src="/assets/recruit.js"></script>
<script src="/assets/recruit-view.js"></script>
<script src="/assets/recruit-list.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {

    /* 왼쪽 상세 — 조회수는 이미 있는 함수(recruit_job_hit)를 부릅니다 */
    OCRecruitView.init({
      kind: 'job',
      table: 'recruit_jobs',
      hitFn: 'recruit_job_hit',
      listPage: '/recruit/job.html',
    });

    /* 오른쪽 목록 — 같은 엔진, 간추린 꼴(mini)
       ★ 이 화면에는 찾는 칸도 도구줄도 없습니다.
         엔진은 그 칸들이 없으면 그냥 넘어가도록 되어 있어
         따로 설정할 것이 없습니다. */
    OCRecruitList.init({
      kind: 'job',
      table: 'recruit_jobs',
      viewPage: '/recruit/job-view.html',
      writePage: '/recruit/job-write.html',
      pageSize: 12,
      mini: true,
    });
  });
</script>
<script src="/assets/app.js" defer></script>
</body>
</html>

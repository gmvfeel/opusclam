<style>
  /* ★★ 2026-08-12 · 내 등록 관리 (파트너 지적) ★★
     ─────────────────────────────────────────────────────────────
     ★ 무엇이 없었나
       채용정보를 <b>한 번 올리면 수정도 삭제도 못 했습니다.</b>
         recruit/job.html        목록
         recruit/job-write.html  올리기
         recruit/job-view.html   상세 — 수정·삭제 단추 <b>없음</b>
       마이페이지의 「내 공고 보기」는 <b>목록 전체로</b> 갔습니다.
       마감된 공고를 내릴 수도, 바뀐 조건을 고칠 수도 없었습니다.

     ★ 권한은 <b>이미 있었습니다</b> (2026-08-12 확인)
       recruit_jobs 에 rj_read · rj_insert · rj_update · rj_delete 네 규칙이,
       recruit_talents 에도 같은 넷이 있습니다.
       ▶ 규칙을 새로 만들 필요가 없고 <b>화면만</b> 만들면 됩니다.

     ★ 채용정보와 인재정보를 <b>한 화면에 탭</b>으로 둡니다
       둘이 같은 문제이고 하는 일도 같습니다. 화면 둘을 따로 만들면
       코드가 두 벌이 되어, 한쪽만 고쳐지는 일이 생깁니다. */
  .mj-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
  .mj-tabs button{appearance:none;border:1px solid var(--line-2);background:var(--paper);
    color:var(--text-2);border-radius:20px;padding:9px 18px;font-size:13.5px;font-weight:600;
    font-family:inherit;cursor:pointer;transition:.18s}
  .mj-tabs button:hover{border-color:var(--violet-2);color:var(--violet-2)}
  .mj-tabs button.on{background:var(--violet-2);border-color:var(--violet-2);color:#fff}
  .mj-tabs button b{margin-left:6px;font-size:12px;opacity:.85}

  .mj-note{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;font-size:12.5px;line-height:1.75;color:var(--text-2);margin-bottom:18px}
  .mj-note b{color:var(--text)}

  .mj-list{border-top:2px solid var(--text);margin-top:4px}
  .mj-row{display:flex;gap:16px;align-items:flex-start;padding:18px 4px;
    border-bottom:1px solid var(--line)}
  .mj-main{flex:1 1 auto;min-width:0}
  .mj-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px;
    font-size:12px;color:var(--text-3)}
  .mj-badge{flex:0 0 auto;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:700}
  .b-open{background:#e6f4ea;color:#0f7a3d}
  .b-hide{background:#f2f2f7;color:#6b6d80}
  .b-past{background:#fdeaea;color:#a01c1c}
  .b-always{background:#eeecf7;color:#5b4a92}
  .mj-title{display:block;font-size:15.5px;font-weight:700;color:var(--link-idle);
    text-decoration:none;line-height:1.4;margin-bottom:5px;overflow-wrap:anywhere}
  .mj-title:hover{color:var(--link-hover)}
  .mj-sub{font-size:12.5px;color:var(--text-3);line-height:1.6}
  .mj-apps{flex:0 0 auto;text-align:center;min-width:88px}
  .mj-apps .n{display:block;font-size:22px;font-weight:800;color:var(--violet-2);
    font-variant-numeric:tabular-nums;line-height:1.2}
  .mj-apps .lb{font-size:11px;color:var(--text-3)}
  .mj-apps a{text-decoration:none}
  .mj-acts{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;min-width:104px}
  .mj-acts button,.mj-acts a{appearance:none;border:1px solid var(--line-2);
    background:var(--paper);color:var(--text-2);border-radius:7px;padding:7px 12px;
    font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;text-align:center;
    text-decoration:none;transition:.16s}
  .mj-acts button:hover,.mj-acts a:hover{border-color:var(--violet-2);color:var(--violet-2)}
  .mj-acts .danger{color:#a01c1c;border-color:#e3b7b7}
  .mj-acts .danger:hover{background:#a01c1c;border-color:#a01c1c;color:#fff}
  .mj-msg{margin-top:8px;font-size:12px;color:var(--text-3)}
  .mj-msg.bad{color:#a01c1c}
  .mj-msg.good{color:#0f7a3d}
  .mj-empty{padding:52px 20px;text-align:center;color:var(--text-3);font-size:13.5px;line-height:1.9}
  .mj-empty a{color:var(--violet-2);font-weight:600}
  @media(max-width:700px){
    .mj-row{flex-wrap:wrap}
    .mj-apps{min-width:0;text-align:left}
    .mj-acts{flex-direction:row;flex-wrap:wrap;width:100%}
  }
</style>
</head>

<main class="board rc-wrap">

  <div class="mj-note">
    <b>지우기 전에 마감을 먼저 생각해 주십시오.</b><br>
    · <b>마감</b>은 목록에서 감추는 것입니다. 자료는 그대로 남아 다시 열 수 있습니다.<br>
    · <b>삭제</b>는 되돌릴 수 없습니다. 받은 지원 기록도 함께 사라질 수 있습니다.<br>
    · 접수 기간이 지난 공고는 <b>마감일 지남</b>으로 표시됩니다 — 감추지 않아도 지원자에게는 기간이 보입니다.

<script>
/* ════════════════════════════════════════════════════════════════
   내 등록 관리 · 2026-08-12
   ────────────────────────────────────────────────────────────────
   ★ 칸 이름은 <b>표에서 직접 확인</b>했습니다 (짐작하지 않았습니다)
     recruit_jobs      member_id · title · org_name · apply_from · apply_to
                       apply_always · apply_until_hired · hidden · view_count
                       created_at · is_sample
     recruit_talents   member_id · title · is_open · hidden · view_count
     recruit_applications  job_id · talent_id · status · created_at

     ★ 「마감」은 status 가 아니라 <b>hidden</b> 으로 다룹니다.
       recruit_jobs 의 status 라는 칸은 아예 없고, 코드에서 본 status 는
       <b>회원 승인 상태</b>(members)였습니다.

   ★ 지원 수는 job_id 로 셉니다 — 공고마다 따로 물으면 46번이 되므로
     <b>한 번에 받아</b> 화면에서 나눕니다.

   ★ 지우기 전에 <b>지원 수를 알려 줍니다.</b>
     「지원 3건이 있습니다. 지우면 함께 사라질 수 있습니다」
     되돌릴 수 없는 일이라 그냥 물어보고 지우는 것은 위험합니다.
   ════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var KIND = 'job';
  var ME = null;
  var CACHE = { job: null, talent: null };

  var CFG = {
    job: {
      table: 'recruit_jobs',
      view:  '/recruit/job-view.html',
      write: '/recruit/job-write.html',
      cols:  'id,title,org_name,apply_from,apply_to,apply_always,apply_until_hired,' +
             'hidden,view_count,created_at,is_sample,job_cat1,job_cat2,region1,region2',
      label: '채용정보',
      empty: '올린 채용정보가 없습니다.',
      newTo: '/recruit/job-write.html'
    },
    talent: {
      table: 'recruit_talents',
      view:  '/recruit/talent-view.html',
      write: '/recruit/talent-write.html',
      cols:  'id,title,is_open,hidden,view_count,created_at,is_sample,' +
             'job_cat1,job_cat2,region1,region2,now_status',
      label: '인재정보',
      empty: '올린 인재정보가 없습니다.',
      newTo: '/recruit/talent-write.html'
    }
  };

  function C() { return window.OCRecruit ? window.OCRecruit.client() : null; }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function ymd(v) {
    if (!v) return '';
    var s = String(v).slice(0, 10).split('-');
    return s.length === 3 ? (s[0] + '.' + s[1] + '.' + s[2]) : String(v);
  }
  function todayYmd() {
    var n = new Date();
    var k = new Date(n.getTime() + 9 * 3600 * 1000);   /* 한국 시간 기준 */
    return k.toISOString().slice(0, 10);
  }

  /* ── 접수 상태 ────────────────────────────────────────────
     ★ 「마감일 지남」은 <b>감춘 것과 다릅니다.</b> 기간이 지났을 뿐
       목록에는 그대로 있습니다. 둘을 갈라 보여 줘야 파트너가
       무엇을 감출지 판단할 수 있습니다. */
  function stateOf(o) {
    if (o.hidden) return { cls: 'b-hide', txt: '감춤 (마감)' };
    if (KIND === 'talent') {
      return o.is_open === false ? { cls: 'b-hide', txt: '비공개' }
                                : { cls: 'b-open', txt: '공개 중' };
    }
    if (o.apply_always)      return { cls: 'b-always', txt: '상시모집' };
    if (o.apply_until_hired) return { cls: 'b-always', txt: '채용시 마감' };
    if (o.apply_to && String(o.apply_to).slice(0, 10) < todayYmd())
      return { cls: 'b-past', txt: '마감일 지남' };
    return { cls: 'b-open', txt: '접수 중' };
  }

  function periodOf(o) {
    if (KIND === 'talent') return o.now_status ? String(o.now_status) : '';
    if (o.apply_always) return '상시모집';
    if (o.apply_until_hired) return '채용시까지';
    if (o.apply_from || o.apply_to)
      return ymd(o.apply_from) + ' ~ ' + ymd(o.apply_to);
    return '';
  }

  /* ── 불러오기 ─────────────────────────────────────────────
     ★ 지원 수는 <b>한 번에</b> 받습니다. 공고마다 따로 물으면
       공고 수만큼 조회가 나갑니다. */
  async function load() {
    var c = C();
    var box = document.getElementById('mjList');
    if (!c) { box.innerHTML = '<div class="mj-empty">잠시 후 다시 시도해 주세요.</div>'; return; }
    box.innerHTML = '<div class="mj-empty">불러오는 중…</div>';

    var s = await c.auth.getSession();
    var u = s.data && s.data.session && s.data.session.user;
    if (!u) {
      box.innerHTML = '<div class="mj-empty">로그인이 필요합니다.<br>'
        + '<a href="/account/login.html">로그인하기 &rarr;</a></div>';
      return;
    }
    ME = u.id;

    var cfg = CFG[KIND];
    var r = await c.from(cfg.table).select(cfg.cols)
      .eq('member_id', ME)
      .order('created_at', { ascending: false })
      .limit(200);

    if (r.error) {
      box.innerHTML = '<div class="mj-empty">불러오지 못했습니다.<br>'
        + esc(r.error.message) + '</div>';
      return;
    }
    var rows = r.data || [];
    CACHE[KIND] = rows;
    countTab(KIND, rows.length);

    /* 지원 수 — 채용정보에만 있습니다 */
    var apps = {};
    if (KIND === 'job' && rows.length) {
      var ids = rows.map(function (x) { return x.id; });
      var ar = await c.from('recruit_applications').select('job_id').in('job_id', ids);
      (ar.data || []).forEach(function (a) {
        apps[a.job_id] = (apps[a.job_id] || 0) + 1;
      });
    }
    draw(rows, apps);
  }

  async function countTab(kind, n) {
    var el = document.getElementById(kind === 'job' ? 'nJob' : 'nTal');
    if (el) el.textContent = n;
    /* 다른 탭 수도 미리 세어 둡니다 — 눌러 보기 전에 몇 개인지 알 수 있게 */
    var other = kind === 'job' ? 'talent' : 'job';
    if (CACHE[other] !== null) return;
    var c = C(); if (!c || !ME) return;
    var rr = await c.from(CFG[other].table).select('id', { count: 'exact', head: true })
      .eq('member_id', ME);
    var oel = document.getElementById(other === 'job' ? 'nJob' : 'nTal');
    if (oel && rr && typeof rr.count === 'number') oel.textContent = rr.count;
  }

  function draw(rows, apps) {
    var cfg = CFG[KIND];
    var box = document.getElementById('mjList');
    if (!rows.length) {
      box.innerHTML = '<div class="mj-empty">' + esc(cfg.empty) + '<br>'
        + '<a href="' + cfg.newTo + '">지금 등록하기 &rarr;</a></div>';
      return;
    }
    box.innerHTML = rows.map(function (o) {
      var st = stateOf(o);
      var per = periodOf(o);
      var cat = [o.job_cat1, o.job_cat2].filter(Boolean).join(' › ');
      var reg = [o.region1, o.region2].filter(Boolean).join(' › ');
      var n = apps[o.id] || 0;

      return '<div class="mj-row" data-row="' + o.id + '">'
        + '<div class="mj-main">'
        +   '<div class="mj-head">'
        +     '<span class="mj-badge ' + st.cls + '">' + esc(st.txt) + '</span>'
        +     (o.is_sample ? '<span class="mj-badge b-hide">견본</span>' : '')
        +     '<span>' + esc(ymd(o.created_at)) + ' 등록</span>'
        +     (o.view_count ? '<span>· 조회 ' + esc(o.view_count) + '</span>' : '')
        +   '</div>'
        +   '<a class="mj-title" href="' + cfg.view + '?id=' + encodeURIComponent(o.id) + '">'
        +     esc(o.title || '(제목 없음)') + '</a>'
        +   '<div class="mj-sub">'
        +     (o.org_name ? esc(o.org_name) + (cat || reg || per ? ' · ' : '') : '')
        +     [cat, reg, per].filter(Boolean).map(esc).join(' · ')
        +   '</div>'
        +   '<div class="mj-msg" data-msg="' + o.id + '"></div>'
        + '</div>'
        + (KIND === 'job'
          ? '<div class="mj-apps">'
            /* ★ 「받은 지원」은 따로 화면이 없고 <b>마이페이지 안</b>에 있습니다
                 (id=raRecv · assets/recruit-apps.js 가 그립니다).
                 account/recruit-apps.html 로 보내려 했는데 그 화면이 없어
                 404 가 됩니다 — 실제 주소를 확인해 마이페이지로 보냅니다. */
            + (n ? '<a href="/account/mypage.html#raRecv"><span class="n">' + n + '</span>'
                   + '<span class="lb">받은 지원</span></a>'
                 : '<span class="n">0</span><span class="lb">받은 지원</span>')
            + '</div>'
          : '<div class="mj-apps"><span class="n">' + (o.view_count || 0) + '</span>'
            + '<span class="lb">조회</span></div>')
        + '<div class="mj-acts">'
        +   '<a href="' + cfg.write + '?id=' + encodeURIComponent(o.id) + '">수정</a>'
        +   (o.hidden
              ? '<button data-do="show" data-id="' + o.id + '">다시 열기</button>'
              : '<button data-do="hide" data-id="' + o.id + '">마감</button>')
        +   '<button class="danger" data-do="del" data-id="' + o.id + '"'
        +     ' data-n="' + n + '">삭제</button>'
        + '</div>'
        + '</div>';
    }).join('');

    box.querySelectorAll('button[data-do]').forEach(function (b) {
      b.addEventListener('click', function () { act(b); });
    });
  }

  /* ── 처리 ─────────────────────────────────────────────────
     ★ 삭제는 되돌릴 수 없습니다. 지원 수를 알려 주고 한 번 더 묻습니다. */
  async function act(btn) {
    var id = btn.getAttribute('data-id');
    var doWhat = btn.getAttribute('data-do');
    var n = Number(btn.getAttribute('data-n') || 0);
    var msg = document.querySelector('[data-msg="' + id + '"]');
    function say(t, cls) { if (msg) { msg.textContent = t; msg.className = 'mj-msg ' + (cls || ''); } }

    var c = C(); if (!c) return;
    var cfg = CFG[KIND];

    if (doWhat === 'del') {
      var warn = '이 ' + cfg.label + '를 지우면 되돌릴 수 없습니다.';
      if (n > 0) warn += '\n\n★ 받은 지원이 ' + n + '건 있습니다. 그 기록도 함께 사라질 수 있습니다.'
                       + '\n마감(감추기)으로 두면 자료가 남습니다.';
      warn += '\n\n그래도 지우시겠습니까?';
      if (!window.confirm(warn)) return;
      say('지우는 중…');
      var d = await c.from(cfg.table).delete().eq('id', id).eq('member_id', ME).select('id');
      if (d.error) { say('지우지 못했습니다 — ' + d.error.message, 'bad'); return; }
      if (!d.data || !d.data.length) {
        say('지우지 못했습니다. 내가 올린 것만 지울 수 있습니다.', 'bad'); return;
      }
      say('지웠습니다.', 'good');
      setTimeout(load, 600);
      return;
    }

    var hide = (doWhat === 'hide');
    say(hide ? '마감하는 중…' : '다시 여는 중…');
    var up = await c.from(cfg.table).update({ hidden: hide })
      .eq('id', id).eq('member_id', ME).select('id,hidden');
    if (up.error) { say('바꾸지 못했습니다 — ' + up.error.message, 'bad'); return; }
    if (!up.data || !up.data.length) {
      say('바꾸지 못했습니다. 내가 올린 것만 고칠 수 있습니다.', 'bad'); return;
    }
    say(hide ? '마감했습니다. 목록에서 감춰집니다.' : '다시 열었습니다.', 'good');
    setTimeout(load, 600);
  }

  /* ── 시작 ─────────────────────────────────────────────────
     ★ supabase-js 는 CDN 에서 옵니다. 아직 안 왔을 수 있어 기다립니다.
       (recruit/job.html 과 같은 결로 맞췄습니다) */

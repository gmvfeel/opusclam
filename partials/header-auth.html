<!-- ══ 회원 화면 헤더에 붙는 것들 ══════════════════════════════════
     ★ 2026-08-06 — <b>드롭다운과 전체메뉴가 없었습니다</b> (파트너 지적)
       마이페이지에서 위 메뉴에 마우스를 올려도 하위 메뉴가 나오지 않고,
       ≡ 를 눌러도 아무 일이 없었습니다. 다른 화면과 <b>결이 달랐습니다.</b>

     ★ 메뉴 목록을 <b>여기에 옮겨 적지 않았습니다.</b>
       assets/include.js 가 partials/header.html 을 한 번 더 읽어
       그 안의 드롭다운과 전체메뉴를 <b>가져와 붙입니다</b>.
       그래서 메뉴가 늘거나 이름이 바뀔 때 <b>header.html 한 곳만</b>
       고치면 두 헤더가 함께 바뀝니다. 목록을 두 벌로 두면 반드시
       한쪽을 빠뜨립니다(전에 여러 번 겪었습니다).

     ★ 짜임은 여기 둡니다 — 회원 화면은 style.css 를 <b>싣지 않습니다</b>
       (auth.css 하나만 씁니다). 그래서 본 헤더의 드롭다운·전체메뉴
       짜임이 아예 없습니다. 색은 auth.css 의 변수로 바꿔 적었습니다.
     ══════════════════════════════════════════════════════════════ -->
<style>
  /* ── 위 메뉴 hover 드롭다운 ───────────────────────────────────
     ★ 기준 자리 — .gnb 가 이미 sticky(자리를 가진 요소)라 top:100% 가
       <b>헤더 바로 아래</b>를 가리킵니다. .mast 에 따로 position 을 주지
       않아도 맞습니다.
     ★ .nav a 의 padding(27px 0)은 그대로 살아 있습니다 — 감싸는 상자를
       하나 두었을 뿐이라 후손 선택자가 계속 걸립니다. */
  .ga-item{ position:static; display:flex; align-items:center; }

  .ga-item .dropdown{
    position:absolute; top:100%; left:0; right:0; width:100%;
    background:var(--bg, #fff);
    border-top:1px solid var(--line, #e8e6ec);
    border-bottom:1px solid var(--line2, #dedbe4);
    box-shadow:0 16px 32px -18px rgba(30,20,60,.28);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .22s ease, visibility .22s ease;
    z-index:65;
  }
  .ga-item:hover .dropdown{ opacity:1; visibility:visible; pointer-events:auto; }
  .ga-item .dropdown-inner{
    max-width:1320px; margin:0 auto; padding:12px 20px;
    display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
  }
  .ga-item .dropdown a{
    position:relative; font-size:13px; color:var(--tx3, #8f90a6);
    padding:5px 18px; white-space:nowrap; letter-spacing:-.01em;
    text-decoration:none; transition:color .15s;
  }
  .ga-item .dropdown a:not(:last-child)::after{
    content:""; position:absolute; right:0; top:50%; transform:translateY(-50%);
    width:1px; height:11px; background:var(--line2, #dedbe4);
  }
  .ga-item .dropdown a:hover{ color:var(--tx, #20223a); }
  .ga-item .dropdown a.active{ color:var(--accent, #EC7A1C); font-weight:700; }

  /* ── 전체메뉴 (본 헤더와 같은 모양) ───────────────────────────
     ★ 이 패널은 <b>두 모드 모두 어둡습니다</b> — 본 헤더도 그렇습니다.
       화면을 덮는 큰 판은 어두운 편이 눈이 편하고, 밝은 모드에서
       흰 판이 펼쳐지면 눈이 부십니다. */
  .fullmenu{
    position:fixed; inset:0; z-index:120;
    visibility:hidden; opacity:0;
    transition:opacity .35s ease, visibility .35s ease;
  }
  .fullmenu.open{ visibility:visible; opacity:1; }
  .fullmenu-panel{
    position:absolute; inset:0; overflow:hidden;
    background:linear-gradient(120deg,#070812 0%,#120c22 44%,#221534 72%,#2e1d3e 100%);
    transform:scale(1.03); transition:transform .42s cubic-bezier(.22,1,.36,1);
    display:flex; flex-direction:column;
  }
  .fullmenu.open .fullmenu-panel{ transform:none; }
  .fullmenu-panel::before{
    content:""; position:absolute; top:-18%; right:-8%; width:620px; height:620px;
    background:radial-gradient(circle,rgba(156,127,214,.28),transparent 70%);
    pointer-events:none; z-index:0;
  }
  .fullmenu-panel::after{
    content:""; position:absolute; bottom:-20%; left:-6%; width:520px; height:520px;
    background:radial-gradient(circle,rgba(201,169,78,.14),transparent 70%);
    pointer-events:none; z-index:0;
  }
  .fullmenu .wrap{ max-width:1560px; padding:0 48px; margin:0 auto; }
  .fullmenu-head{
    position:relative; z-index:1; width:100%; display:flex;
    align-items:center; justify-content:space-between; height:90px;
    border-bottom:1px solid rgba(255,255,255,.13); flex:0 0 auto;
  }
  .fullmenu-head .fm-logo{ height:32px; width:auto; display:block; filter:brightness(0) invert(1); }
  .fullmenu-head .fm-logolink{ display:inline-flex; align-items:center; }
  .fullmenu-close{
    width:46px; height:46px; border-radius:12px;
    border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.06);
    display:grid; place-items:center; cursor:pointer; color:#fff;
    transition:background .2s, border-color .2s, transform .3s;
  }
  .fullmenu-close:hover{ background:var(--accent, #EC7A1C); border-color:var(--accent, #EC7A1C); transform:rotate(90deg); }
  .fullmenu-body{
    position:relative; z-index:1; flex:1 1 auto; display:flex; align-items:center;
    padding:44px 0 64px; overflow-y:auto; min-height:0;
  }
  .fullmenu-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:44px; width:100%; }
  .fm-col .fm-num{
    font-size:13px; font-weight:700; letter-spacing:.14em;
    color:var(--accent, #EC7A1C); margin-bottom:12px;
  }
  .fm-col h4{
    font-weight:800; font-size:20px; letter-spacing:-.01em; color:#fff;
    padding-bottom:18px; margin:0 0 18px; border-bottom:1px solid rgba(255,255,255,.2);
  }
  .fm-col a{
    display:block; font-size:15px; color:rgba(255,255,255,.6); padding:10px 0;
    text-decoration:none; position:relative;
    border-bottom:1px solid rgba(255,255,255,.07);
    transition:color .18s ease, transform .18s ease;
  }
  .fm-col a:last-child{ border-bottom:0; }
  .fm-col a:hover{ color:#fff; transform:translateX(8px); }
  .fm-col a.active{ color:var(--accent, #EC7A1C); font-weight:700; }
  @media(max-width:980px){
    .fullmenu-grid{ grid-template-columns:repeat(3,1fr); row-gap:42px; }
    .fullmenu-body{ align-items:flex-start; }
    .fullmenu .wrap{ padding:0 24px; }
  }
  @media(max-width:600px){
    .fullmenu-grid{ grid-template-columns:repeat(2,1fr); gap:22px; }
    .fullmenu-head .fm-logo{ height:26px; }
  }

  /* 좁은 화면에서 위 큰 메뉴가 숨어도 ≡ 로 <b>전체메뉴</b>를 열 수 있으니
     길이 막히지 않습니다(예전에는 눌러도 아무 일이 없었습니다). */
</style>

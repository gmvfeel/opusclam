<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" href="/icon-192.png">

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/assets/base.css">
<style>
  /* ── 통합검색 전용 · 다른 페이지에 영향 없음 ── */

  /* 히어로 안 검색창
     ★ 2026-08-21 · 「빈약해 보인다」는 파트너 지적으로 손봤습니다.
       새 색을 들이지 않고, 이미 쓰던 보라→금 그러데이션을 <b>테두리로</b>
       끌어와 이 칸을 화면의 주인공으로 만듭니다. */
  .osr-searchbar{max-width:760px;margin:26px auto 0;position:relative}

  /* 그러데이션 테두리 — 안쪽 흰 칸을 2px 감쌉니다 */
  .osr-ring{padding:2px;border-radius:18px;
    background:linear-gradient(120deg,#7C63B0,#9C7FD6 52%,#C9A94E);
    box-shadow:0 14px 34px rgba(24,24,50,.10);
    transition:box-shadow .18s}
  .osr-ring:focus-within{box-shadow:0 18px 44px rgba(124,99,176,.26)}

  .osr-form{display:flex;align-items:center;gap:0;
    background:var(--paper,#fff);border:0;border-radius:16px;
    padding:7px 7px 7px 19px}
  .osr-form .ic{flex:0 0 auto;width:21px;height:21px;color:#9C7FD6;margin-right:12px}
  .osr-form input{flex:1;min-width:0;height:56px;border:0;background:transparent;outline:none;
    font-size:17.5px;font-weight:500;color:var(--text-1,#1b1c2b);letter-spacing:-.01em;
    padding-right:10px}
  .osr-form input::placeholder{color:var(--text-3,#a8aabb);font-weight:400;opacity:.85}
  .osr-form button{flex:0 0 auto;height:48px;padding:0 26px;border:0;border-radius:12px;cursor:pointer;
    font-size:15px;font-weight:800;letter-spacing:-.01em;color:#fff;
    background:linear-gradient(120deg,#7C63B0,#9C7FD6 55%,#C9A94E);
    box-shadow:0 5px 14px rgba(124,99,176,.30)}
  .osr-form button:hover{filter:brightness(1.06)}
  .osr-hint{margin:14px 0 0;text-align:center;font-size:12.5px;
    color:var(--text-3,#8a8c9e);letter-spacing:-.01em;word-break:keep-all}
  .osr-hint b{color:var(--text-2,#5c5e70);font-weight:600}

  /* 이렇게 찾아보세요 — 눌러 보면 낱말 여럿도 된다는 것이 바로 보입니다 */
  .osr-eg{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:13px 0 0}
  .osr-eg button{height:31px;padding:0 13px;border-radius:99px;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:-.01em;
    border:1px solid var(--line,#e4e4ec);background:var(--paper,#fff);
    color:var(--text-2,#5c5e70);transition:border-color .15s,color .15s}
  .osr-eg button:hover{border-color:#c9bbe6;color:#7C63B0}

  /* 결과 영역 */
  .osr-results{max-width:1000px;margin:0 auto;padding:34px 20px 90px}
  .osr-summary{font-size:13.5px;color:var(--text-3,#8a8c9e);letter-spacing:-.01em}
  .osr-summary b{color:var(--text-1,#1b1c2b);font-weight:700}
  .osr-summary strong{color:#7C63B0;font-weight:800}

  /* 영역 탭 */
  .osr-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 4px}
  .osr-tab{display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 14px;
    border:1px solid var(--line,#e4e4ec);border-radius:99px;background:var(--paper,#fff);
    font-size:12.5px;font-weight:600;color:var(--text-2,#5c5e70);cursor:pointer;
    transition:border-color .15s,color .15s,background .15s}
  .osr-tab b{font-size:11.5px;font-weight:700;color:var(--text-3,#8a8c9e)}
  .osr-tab:hover{border-color:#c9bbe6;color:#7C63B0}
  .osr-tab.on{background:#1b1c2b;border-color:#1b1c2b;color:#fff}
  .osr-tab.on b{color:rgba(255,255,255,.7)}

  /* 그룹 */
  .osr-group{margin-top:30px}
  .osr-h{display:flex;align-items:center;gap:9px;margin:0 0 4px;padding:0 0 11px;
    border-bottom:1.5px solid var(--line,#e4e4ec)}
  .osr-label{position:relative;padding-left:11px;font-size:16px;font-weight:800;
    letter-spacing:-.02em;color:var(--text-1,#1b1c2b)}
  .osr-label::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;
    background:linear-gradient(180deg,#9C7FD6,#C9A94E)}
  .osr-h b{font-size:12px;font-weight:800;color:#7C63B0;background:rgba(156,127,214,.13);
    border-radius:99px;padding:2px 9px;letter-spacing:0}
  .osr-more{margin-left:auto;display:inline-flex;align-items:center;gap:4px;
    font-size:12.5px;font-weight:600;color:var(--text-3,#8a8c9e);text-decoration:none}
  .osr-more span{font-size:15px;line-height:1}
  .osr-more:hover{color:#7C63B0}

  /* 항목 */
  .osr-items{display:flex;flex-direction:column}
  .osr-item{display:flex;gap:14px;align-items:center;padding:13px 10px 13px 6px;
    border-bottom:1px solid var(--line-2,#f1f1f5);text-decoration:none;color:inherit;
    border-radius:10px;transition:background .13s}
  .osr-item:hover{background:var(--paper-2,#f7f7fb)}
  .osr-item:hover .osr-go{opacity:1;transform:none}
  .osr-thumb{flex:0 0 auto;width:50px;height:50px;border-radius:10px;overflow:hidden;
    background:var(--paper-2,#f2f2f7);display:block}
  .osr-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .osr-thumb-ph{display:grid;place-items:center;font-size:19px;font-weight:800;
    color:#b6b8c9;background:var(--paper-2,#f2f2f7)}
  .osr-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .osr-t{font-size:14.8px;font-weight:700;letter-spacing:-.01em;color:var(--text-1,#1b1c2b);line-height:1.42}
  .osr-t em{font-style:normal;font-weight:500;font-size:12.5px;color:var(--text-3,#8a8c9e);margin-left:5px}
  .osr-s{font-size:12.5px;color:var(--text-3,#8a8c9e)}
  .osr-d{font-size:12.8px;color:var(--text-2,#5c5e70);line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .osr-go{flex:0 0 auto;font-size:15px;color:#c9bbe6;opacity:0;transform:translateX(-4px);
    transition:opacity .15s, transform .15s}
  .osr-item mark{background:rgba(201,169,78,.26);color:inherit;border-radius:3px;padding:0 1px;font-weight:800}

  /* ── 「오퍼스클램에 담긴 것」 (2026-08-21) ─────────────────────
     검색어를 넣기 전 화면이 텅 비어 있었습니다. 이 사이트에 무엇이
     얼마나 있는지 한 마디도 하지 않았습니다.
     ★ 검색어가 들어오면 <b>사라집니다</b> — 결과가 주인공입니다.
       (search.js 가 html 에 osr-q 를 붙였다 뗍니다) */
  .osr-home{margin:-6px 0 60px}
  html.osr-q .osr-home{display:none}
  .osr-home-h{display:flex;align-items:center;gap:9px;margin:0 0 16px;
    font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--text-2,#5c5e70)}
  .osr-home-h::after{content:'';flex:1;height:1px;background:var(--line,#e4e4ec)}

  /* ★ 8개가 <b>4 + 4</b> 로 떨어지게 열 수를 못박습니다.
       auto-fit 으로 두었더니 넓은 화면에서 6 + 2 로 갈려 어색했습니다. */
  .osr-cards{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
  @media (max-width:860px){ .osr-cards{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:560px){ .osr-cards{grid-template-columns:repeat(2,1fr);gap:8px} }
  .osr-card{position:relative;overflow:hidden;display:block;padding:15px 16px 14px;
    border:1px solid var(--line,#e4e4ec);border-radius:13px;background:var(--paper,#fff);
    text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
  .osr-card::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,#9C7FD6,#C9A94E);
    transform:scaleX(0);transform-origin:left;transition:transform .22s ease}
  .osr-card:hover{border-color:#c9bbe6;transform:translateY(-2px)}
  .osr-card:hover::before{transform:scaleX(1)}
  .osr-card .k{display:block;font-size:12.5px;font-weight:600;
    color:var(--text-3,#8a8c9e);letter-spacing:-.01em}
  .osr-card .n{display:block;margin-top:5px;font-size:23px;font-weight:800;
    letter-spacing:-.03em;color:var(--text-1,#1b1c2b);
    font-variant-numeric:tabular-nums;line-height:1.15}
  .osr-card .n.wait{color:var(--line,#e4e4ec)}
  .osr-home-note{margin:15px 0 0;font-size:12.5px;line-height:1.75;
    color:var(--text-3,#8a8c9e);letter-spacing:-.01em;word-break:keep-all}

  /* 빈 결과 · 안내 */
  /* ★ 「검색어를 입력해 주세요」를 <b>위로</b> 올립니다 (2026-08-05 · 파트너 지시)
       56px → 14px → <b>-12px</b> (지금)

     ★ 왜 <b>음수</b>인가
       이 글자를 담는 .osr-results 가 위쪽에 34px 여백을 갖고 있습니다.
       그 여백은 <b>검색 결과가 있을 때</b>도 쓰이므로 줄이면 결과 화면의
       짜임이 함께 흐트러집니다. 그래서 이 글자만 음수 여백으로
       <b>끌어올립니다.</b> 검색칸에서 22px 아래에 놓입니다.
     ★ 이 글자는 <b>검색어가 없을 때만</b> 나오고 그 위에는 아무것도
       없으므로(요약 줄이 비어 있음) 끌어올려도 겹칠 것이 없습니다. */
  .osr-empty{margin:-12px 0 56px;text-align:center;font-size:15.5px;color:var(--text-2,#5c5e70);line-height:2}
  .osr-empty b{color:var(--text-1,#1b1c2b)}
  .osr-empty span{display:block;margin-top:4px;font-size:13px;color:var(--text-3,#8a8c9e)}
  /* .osr-scope 스타일은 걷어냈습니다 — 그 상자를 없앴습니다 */

  /* 로딩 */
  .osr-skel{display:block;height:13px;border-radius:5px;
    background:linear-gradient(90deg,var(--paper-2,#f1f1f5) 25%,var(--line-2,#e8e8ef) 37%,var(--paper-2,#f1f1f5) 63%);
    background-size:400% 100%;animation:osrsk 1.3s ease infinite}
  .osr-skel.w3{width:30%}.osr-skel.w4{width:46%}.osr-skel.w5{width:60%}
  .osr-skel.w6{width:120px;height:17px}
  @keyframes osrsk{0%{background-position:100% 0}100%{background-position:0 0}}

  @media (max-width:640px){
    .osr-ring{border-radius:16px}
    .osr-form{padding:6px 6px 6px 15px;border-radius:14px}
    .osr-form input{height:50px;font-size:15.5px}
    .osr-form button{height:42px;padding:0 17px;font-size:13.5px}
    .osr-eg button{font-size:12px;padding:0 11px}
    .osr-results{padding:26px 16px 70px}
    .osr-label{font-size:15px}
    .osr-thumb{width:44px;height:44px}
  }
</style>
</head>

<script>
/* 히어로 배경: 라인 네트워크 (DB 페이지와 같은 패턴) */
(function(){
  var g=document.querySelector('.pdb-bg .scene-net g');
  if(!g)return;
  g.innerHTML='';
  var W=1280,H=460,NN=70,maxD=132,NS='http://www.w3.org/2000/svg';
  function el(t){return document.createElementNS(NS,t);}
  var nodes=[];
  for(var i=0;i<NN;i++) nodes.push({x:Math.random()*W, y:Math.random()*H});
  for(var a=0;a<nodes.length;a++){
    for(var b=a+1;b<nodes.length;b++){
      var dx=nodes[a].x-nodes[b].x, dy=nodes[a].y-nodes[b].y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<maxD){
        var ln=el('line');
        ln.setAttribute('x1',nodes[a].x.toFixed(1));ln.setAttribute('y1',nodes[a].y.toFixed(1));
        ln.setAttribute('x2',nodes[b].x.toFixed(1));ln.setAttribute('y2',nodes[b].y.toFixed(1));
        ln.style.animationDuration=(3.2+Math.random()*3.2).toFixed(2)+'s';
        ln.style.animationDelay=(-Math.random()*4.5).toFixed(2)+'s';
        g.appendChild(ln);
      }
    }
  }
  nodes.forEach(function(n){
    var c=el('circle');
    c.setAttribute('cx',n.x.toFixed(1));c.setAttribute('cy',n.y.toFixed(1));
    c.setAttribute('r',(1.1+Math.random()*1.7).toFixed(1));
    c.style.animationDuration=(3+Math.random()*3).toFixed(2)+'s';
    c.style.animationDelay=(-Math.random()*4).toFixed(2)+'s';
    g.appendChild(c);
  });
})();
</script>

<script>
  document.addEventListener('DOMContentLoaded', function(){ OCSearch.boot(); });

  /* ── 「담긴 것」 건수 채우기 (2026-08-21) ──────────────────────
     ★ 비용을 먼저 생각했습니다 — 하루에 한 번만 묻습니다.
       센 값을 브라우저에 날짜와 함께 담아 둡니다. 같은 사람이 하루에
       몇 번을 들어와도 조회는 8번뿐입니다.
     ★ <b>담아 둔 값을 먼저 그립니다.</b> 날이 지났으면 화면은 그대로 둔 채
       뒤에서 다시 세어 슬쩍 갈아 끼웁니다. 그래서 숫자가 깜빡이지 않습니다.
     ★★ 못 세었을 때 <b>빈 상자</b>가 되지 않게 합니다. 지난번 값이 있으면
       그것을 그대로 두고, 그마저 없을 때만 줄표를 놓습니다.
       숫자 없는 상자는 고장 난 것처럼 보입니다.
     ★ 감춘 것(hidden)을 빼고 셉니다 — 목록에 보이는 수와 같아야 합니다.
       칸이 없는 표를 만나면 조건 없이 한 번 더 묻습니다. */
  (function () {
    var KEY = 'oc-search-counts';
    var SB  = 'https://ptdxzxkgddvkusamkiol.supabase.co';
    var PK  = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';
    var H   = { apikey: PK, Authorization: 'Bearer ' + PK,
                Prefer: 'count=exact', Range: '0-0' };
    var cards = [].slice.call(document.querySelectorAll('.osr-card'));
    if (!cards.length) return;

    var today = new Date().toISOString().slice(0, 10);

    function paint(t, n) {
      cards.forEach(function (c) {
        if (c.getAttribute('data-t') !== t) return;
        var b = c.querySelector('.n');
        if (!b) return;
        b.classList.remove('wait');
        b.textContent = (n == null) ? '—' : Number(n).toLocaleString();
      });
    }

    /* ① 담아 둔 것이 있으면 곧바로 그립니다 (날짜와 상관없이) */
    var old = null, fresh = false;
    try {
      var o = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (o && o.n) { old = o.n; fresh = (o.d === today); }
    } catch (e) {}
    if (old) {
      cards.forEach(function (c) {
        var t = c.getAttribute('data-t');
        if (old[t] != null) paint(t, old[t]);
      });
      if (fresh) return;          /* 오늘 센 것이면 더 묻지 않습니다 */
    }

    function count(url) {
      return fetch(url, { headers: H }).then(function (r) {
        if (!r.ok) return null;
        var v = parseInt(String(r.headers.get('content-range') || '').split('/')[1], 10);
        return isFinite(v) ? v : null;
      });
    }

    /* ② 오늘 것이 아니면 뒤에서 다시 셉니다 */
    var got = {};
    Promise.all(cards.map(function (c) {
      var t = c.getAttribute('data-t');
      var base = SB + '/rest/v1/' + t + '?select=id&limit=1';
      return count(base + '&hidden=not.is.true')
        .then(function (n) { return (n == null) ? count(base) : n; })
        .catch(function () { return count(base).catch(function () { return null; }); })
        .then(function (n) {
          if (n != null) { got[t] = n; paint(t, n); return; }
          /* 못 셌습니다 — 지난번 값이 있으면 건드리지 않습니다 */
          if (!old || old[t] == null) paint(t, null);
          else got[t] = old[t];
        });
    })).then(function () {
      try { localStorage.setItem(KEY, JSON.stringify({ d: today, n: got })); } catch (e) {}
    });
  })();

  /* 예시 단추 — 누르면 그대로 찾습니다 */
  (function () {
    var wrap = document.getElementById('osrEg');
    var inp  = document.querySelector('.osr-form input');
    var form = document.querySelector('.osr-form');
    if (!wrap || !inp || !form) return;
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      inp.value = b.textContent.trim();
      if (typeof form.requestSubmit === 'function') form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    });
  })();
</script>

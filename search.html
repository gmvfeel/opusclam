<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('oc-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합검색 · OPUSCLAM</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#0a0d24">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPUSCLAM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/assets/base.css">
<style>
  /* ── 통합검색 전용 (다른 페이지에 영향 없음) ── */
  .osr-wrap{max-width:1000px;margin:0 auto;padding:0 20px 80px}
  .osr-head{padding:44px 0 10px;text-align:center}
  .osr-eyebrow{font-size:11.5px;letter-spacing:.16em;font-weight:700;color:var(--violet-3,#9C7FD6)}
  .osr-title{margin:8px 0 22px;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--text-1,#1b1c2b)}
  .osr-form{display:flex;gap:8px;max-width:620px;margin:0 auto}
  .osr-form input{flex:1;min-width:0;height:52px;padding:0 18px;font-size:16px;
    border:1.5px solid var(--line,#e4e4ec);border-radius:12px;background:var(--paper,#fff);
    color:var(--text-1,#1b1c2b);outline:none;transition:border-color .15s}
  .osr-form input:focus{border-color:var(--violet-3,#9C7FD6)}
  .osr-form button{height:52px;padding:0 24px;font-size:15px;font-weight:700;color:#fff;
    background:var(--text-1,#1b1c2b);border:0;border-radius:12px;cursor:pointer;white-space:nowrap}
  .osr-form button:hover{background:var(--violet-3,#7C63B0)}
  .osr-summary{margin:26px 0 6px;font-size:13.5px;color:var(--text-3,#8a8c9e)}
  .osr-summary b{color:var(--text-1,#1b1c2b);font-weight:700}
  .osr-summary strong{color:var(--violet-3,#7C63B0);font-weight:800}

  .osr-group{margin-top:30px}
  .osr-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding-bottom:9px;
    border-bottom:1.5px solid var(--line,#e4e4ec);font-size:15.5px;font-weight:800;color:var(--text-1,#1b1c2b)}
  .osr-h b{font-size:12.5px;font-weight:700;color:var(--violet-3,#7C63B0);
    background:rgba(156,127,214,.12);border-radius:20px;padding:2px 9px}
  .osr-more{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--text-3,#8a8c9e);text-decoration:none}
  .osr-more:hover{color:var(--violet-3,#7C63B0)}

  .osr-items{display:flex;flex-direction:column}
  .osr-item{display:flex;gap:13px;align-items:flex-start;padding:12px 6px;
    border-bottom:1px solid var(--line-2,#f1f1f5);text-decoration:none;color:inherit}
  .osr-item:hover{background:var(--paper-2,#f8f8fb)}
  .osr-thumb{flex:0 0 auto;width:46px;height:46px;border-radius:8px;overflow:hidden;
    background:var(--paper-2,#f2f2f7);display:block}
  .osr-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .osr-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .osr-t{font-size:14.5px;font-weight:700;color:var(--text-1,#1b1c2b);line-height:1.4}
  .osr-t em{font-style:normal;font-weight:500;font-size:12.5px;color:var(--text-3,#8a8c9e);margin-left:4px}
  .osr-s{font-size:12.5px;color:var(--text-3,#8a8c9e)}
  .osr-d{font-size:12.5px;color:var(--text-2,#5c5e70);line-height:1.55}
  .osr-empty{margin:50px 0;text-align:center;font-size:15px;color:var(--text-2,#5c5e70);line-height:1.9}
  .osr-empty span{font-size:13px;color:var(--text-3,#8a8c9e)}

  .osr-skel{display:block;height:13px;border-radius:5px;
    background:linear-gradient(90deg,var(--paper-2,#f1f1f5) 25%,var(--line-2,#e8e8ef) 37%,var(--paper-2,#f1f1f5) 63%);
    background-size:400% 100%;animation:osrsk 1.3s ease infinite}
  .osr-skel.w3{width:30%}.osr-skel.w4{width:44%}.osr-skel.w5{width:58%}.osr-skel.w6{width:22%;height:16px}
  @keyframes osrsk{0%{background-position:100% 0}100%{background-position:0 0}}

  .osr-tips{margin-top:36px;padding:16px 18px;background:var(--paper-2,#f8f8fb);
    border-radius:11px;font-size:12.5px;color:var(--text-3,#8a8c9e);line-height:1.85}
  .osr-tips b{color:var(--text-2,#5c5e70)}

  @media (max-width:640px){
    .osr-title{font-size:24px}
    .osr-form input{height:48px;font-size:15px}
    .osr-form button{height:48px;padding:0 18px}
  }
</style>
</head>
<body>
<div id="oc-header"></div>
<script src="/assets/include.js"></script>
<script src="/assets/header.js"></script>

<main class="osr-wrap">
  <div class="osr-head">
    <div class="osr-eyebrow">INTEGRATED SEARCH</div>
    <h1 class="osr-title">통합검색</h1>
    <form class="osr-form" role="search">
      <input type="text" name="q" placeholder="인물 · 단체 · 공연장 · 학교 · 게시글을 한 번에" aria-label="검색어" autocomplete="off">
      <button type="submit">검색</button>
    </form>
  </div>

  <div class="osr-summary"></div>
  <div class="osr-groups"></div>

  <div class="osr-tips">
    인물DB · 음악단체 · 공연장 · 음악학교 · 현대음악 · 기관재단 · 학술, 그리고 커뮤니티 게시판을 한 번에 찾습니다.<br>
    <b>이름의 일부만</b> 넣어도 됩니다. 한국어와 영문 이름 모두 찾습니다.
  </div>
</main>

<div id="oc-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/search.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function(){ OCSearch.boot(); });
</script>
<script src="/assets/app.js" defer></script>
</body>
</html>

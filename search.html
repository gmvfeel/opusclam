<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('oc-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통합검색 · OPUSCLAM</title>
<meta name="description" content="오퍼스클램 통합검색 — 인물 · 단체 · 공연장 · 학교 · 작품 · 논문 · 커뮤니티 글을 한 번에 찾습니다.">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#0a0d24">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPUSCLAM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/assets/base.css">
<style>
  /* ── 통합검색 전용 · 다른 페이지에 영향 없음 ── */

  /* 히어로 안 검색창 */
  .osr-searchbar{max-width:660px;margin:22px auto 0;position:relative}
  .osr-form{display:flex;align-items:center;gap:0;
    background:var(--paper,#fff);border:1.5px solid var(--line,#e4e4ec);border-radius:15px;
    box-shadow:0 10px 30px rgba(24,24,50,.07);
    padding:6px 6px 6px 17px;transition:border-color .16s, box-shadow .16s}
  .osr-form:focus-within{border-color:#9C7FD6;box-shadow:0 14px 36px rgba(124,99,176,.16)}
  .osr-form .ic{flex:0 0 auto;width:19px;height:19px;color:var(--text-3,#8a8c9e);margin-right:11px}
  .osr-form input{flex:1;min-width:0;height:48px;border:0;background:transparent;outline:none;
    font-size:16.5px;font-weight:500;color:var(--text-1,#1b1c2b);letter-spacing:-.01em}
  .osr-form input::placeholder{color:var(--text-3,#a8aabb);font-weight:400;opacity:.85}
  .osr-form button{flex:0 0 auto;height:42px;padding:0 22px;border:0;border-radius:11px;cursor:pointer;
    font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:#fff;
    background:linear-gradient(120deg,#7C63B0,#9C7FD6 55%,#C9A94E);
    box-shadow:0 5px 14px rgba(124,99,176,.30)}
  .osr-form button:hover{filter:brightness(1.06)}
  .osr-hint{margin:13px 0 0;text-align:center;font-size:12.5px;
    color:var(--text-3,#8a8c9e);letter-spacing:-.01em}
  .osr-hint b{color:var(--text-2,#5c5e70);font-weight:600}

  /* 결과 영역 */
  .osr-results{max-width:1000px;margin:0 auto;padding:34px 20px 90px}
  .osr-summary{font-size:13.5px;color:var(--text-3,#8a8c9e);letter-spacing:-.01em}
  .osr-summary b{color:var(--text-1,#1b1c2b);font-weight:700}
  .osr-summary strong{color:#7C63B0;font-weight:800}

  /* 영역 탭 */
  .osr-tabs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 4px}
  .osr-tab{display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 14px;
    border:1px solid var(--line,#e4e4ec);border-radius:99px;background:var(--paper,#fff);
    font-size:12.5px;font-weight:600;color:var(--text-2,#5c5e70);cursor:pointer;
    transition:border-color .15s,color .15s,background .15s}
  .osr-tab b{font-size:11.5px;font-weight:700;color:var(--text-3,#8a8c9e)}
  .osr-tab:hover{border-color:#c9bbe6;color:#7C63B0}
  .osr-tab.on{background:#1b1c2b;border-color:#1b1c2b;color:#fff}
  .osr-tab.on b{color:rgba(255,255,255,.7)}

  /* 그룹 */
  .osr-group{margin-top:30px}
  .osr-h{display:flex;align-items:center;gap:9px;margin:0 0 4px;padding:0 0 11px;
    border-bottom:1.5px solid var(--line,#e4e4ec)}
  .osr-label{position:relative;padding-left:11px;font-size:16px;font-weight:800;
    letter-spacing:-.02em;color:var(--text-1,#1b1c2b)}
  .osr-label::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;
    background:linear-gradient(180deg,#9C7FD6,#C9A94E)}
  .osr-h b{font-size:12px;font-weight:800;color:#7C63B0;background:rgba(156,127,214,.13);
    border-radius:99px;padding:2px 9px;letter-spacing:0}
  .osr-more{margin-left:auto;display:inline-flex;align-items:center;gap:4px;
    font-size:12.5px;font-weight:600;color:var(--text-3,#8a8c9e);text-decoration:none}
  .osr-more span{font-size:15px;line-height:1}
  .osr-more:hover{color:#7C63B0}

  /* 항목 */
  .osr-items{display:flex;flex-direction:column}
  .osr-item{display:flex;gap:14px;align-items:center;padding:13px 10px 13px 6px;
    border-bottom:1px solid var(--line-2,#f1f1f5);text-decoration:none;color:inherit;
    border-radius:10px;transition:background .13s}
  .osr-item:hover{background:var(--paper-2,#f7f7fb)}
  .osr-item:hover .osr-go{opacity:1;transform:none}
  .osr-thumb{flex:0 0 auto;width:50px;height:50px;border-radius:10px;overflow:hidden;
    background:var(--paper-2,#f2f2f7);display:block}
  .osr-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .osr-thumb-ph{display:grid;place-items:center;font-size:19px;font-weight:800;
    color:#b6b8c9;background:var(--paper-2,#f2f2f7)}
  .osr-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .osr-t{font-size:14.8px;font-weight:700;letter-spacing:-.01em;color:var(--text-1,#1b1c2b);line-height:1.42}
  .osr-t em{font-style:normal;font-weight:500;font-size:12.5px;color:var(--text-3,#8a8c9e);margin-left:5px}
  .osr-s{font-size:12.5px;color:var(--text-3,#8a8c9e)}
  .osr-d{font-size:12.8px;color:var(--text-2,#5c5e70);line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .osr-go{flex:0 0 auto;font-size:15px;color:#c9bbe6;opacity:0;transform:translateX(-4px);
    transition:opacity .15s, transform .15s}
  .osr-item mark{background:rgba(201,169,78,.26);color:inherit;border-radius:3px;padding:0 1px;font-weight:800}

  /* 빈 결과 · 안내 */
  /* ★ 「검색어를 입력해 주세요」를 <b>위로</b> 올립니다 (2026-08-05 · 파트너 지시)
       56px → 14px → <b>-12px</b> (지금)

     ★ 왜 <b>음수</b>인가
       이 글자를 담는 .osr-results 가 위쪽에 34px 여백을 갖고 있습니다.
       그 여백은 <b>검색 결과가 있을 때</b>도 쓰이므로 줄이면 결과 화면의
       짜임이 함께 흐트러집니다. 그래서 이 글자만 음수 여백으로
       <b>끌어올립니다.</b> 검색칸에서 22px 아래에 놓입니다.
     ★ 이 글자는 <b>검색어가 없을 때만</b> 나오고 그 위에는 아무것도
       없으므로(요약 줄이 비어 있음) 끌어올려도 겹칠 것이 없습니다. */
  .osr-empty{margin:-12px 0 56px;text-align:center;font-size:15.5px;color:var(--text-2,#5c5e70);line-height:2}
  .osr-empty b{color:var(--text-1,#1b1c2b)}
  .osr-empty span{display:block;margin-top:4px;font-size:13px;color:var(--text-3,#8a8c9e)}
  /* .osr-scope 스타일은 걷어냈습니다 — 그 상자를 없앴습니다 */

  /* 로딩 */
  .osr-skel{display:block;height:13px;border-radius:5px;
    background:linear-gradient(90deg,var(--paper-2,#f1f1f5) 25%,var(--line-2,#e8e8ef) 37%,var(--paper-2,#f1f1f5) 63%);
    background-size:400% 100%;animation:osrsk 1.3s ease infinite}
  .osr-skel.w3{width:30%}.osr-skel.w4{width:46%}.osr-skel.w5{width:60%}
  .osr-skel.w6{width:120px;height:17px}
  @keyframes osrsk{0%{background-position:100% 0}100%{background-position:0 0}}

  @media (max-width:640px){
    .osr-form{padding:5px 5px 5px 14px;border-radius:14px}
    .osr-form input{height:46px;font-size:15.5px}
    .osr-form button{height:40px;padding:0 16px;font-size:13.5px}
    .osr-results{padding:26px 16px 70px}
    .osr-label{font-size:15px}
    .osr-thumb{width:44px;height:44px}
  }
</style>
</head>
<body data-header="overlay">
<div id="oc-header"></div>
<script src="/assets/include.js"></script>
<script src="/assets/header.js"></script>
<script src="/assets/hero-scene.js" defer></script>

<section class="pdb pdb-board">
  <div class="pdb-bg" aria-hidden="true">
    <div class="wave">
      <div class="scene scene-net on">
        <svg viewBox="0 0 1280 460" preserveAspectRatio="xMidYMid slice">
          <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7FD6"/><stop offset="1" stop-color="#C9A94E"/></linearGradient></defs>
          <g fill="url(#dg)"></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="pdb-inner">

    <nav class="pdb-crumb" aria-label="위치">
      <a href="/home.html">홈</a><span>/</span><span class="on">통합검색</span>
    </nav>

    <header class="pdb-head">
      <div class="pdb-titlebar">
        <div>
          <div class="pdb-eyebrow">INTEGRATED SEARCH</div>
          <h1 class="pdb-title">통합검색</h1>
        </div>
      </div>

      <div class="osr-searchbar">
        <form class="osr-form" role="search">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" name="q" placeholder="인물 · 단체 · 공연장 · 학교 · 게시글" aria-label="검색어" autocomplete="off">
          <button type="submit">검색</button>
        </form>
        <p class="osr-hint">데이터베이스 7종과 커뮤니티 게시판을 <b>한 번에</b> 찾습니다 · 이름의 일부만 넣어도 됩니다</p>
      </div>
    </header>
  </div>
</section>

<main class="osr-results">
  <div class="osr-summary"></div>
  <div class="osr-groups"></div>

  <!-- ★ 「검색 범위」 상자를 없앴습니다 (2026-08-05 · 파트너 지시)
       검색칸 아래에 이미 「데이터베이스 7종과 커뮤니티 게시판을 한 번에
       찾습니다」 안내가 있어 <b>같은 말이 두 번</b>이었습니다.
       ★ CSS 로 감추지 않고 <b>만들지 않습니다</b> — 감추면 언제든 되살아납니다. -->
</main>

<div id="oc-footer"></div>

<script>
/* 히어로 배경: 라인 네트워크 (DB 페이지와 같은 패턴) */
(function(){
  var g=document.querySelector('.pdb-bg .scene-net g');
  if(!g)return;
  g.innerHTML='';
  var W=1280,H=460,NN=70,maxD=132,NS='http://www.w3.org/2000/svg';
  function el(t){return document.createElementNS(NS,t);}
  var nodes=[];
  for(var i=0;i<NN;i++) nodes.push({x:Math.random()*W, y:Math.random()*H});
  for(var a=0;a<nodes.length;a++){
    for(var b=a+1;b<nodes.length;b++){
      var dx=nodes[a].x-nodes[b].x, dy=nodes[a].y-nodes[b].y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<maxD){
        var ln=el('line');
        ln.setAttribute('x1',nodes[a].x.toFixed(1));ln.setAttribute('y1',nodes[a].y.toFixed(1));
        ln.setAttribute('x2',nodes[b].x.toFixed(1));ln.setAttribute('y2',nodes[b].y.toFixed(1));
        ln.style.animationDuration=(3.2+Math.random()*3.2).toFixed(2)+'s';
        ln.style.animationDelay=(-Math.random()*4.5).toFixed(2)+'s';
        g.appendChild(ln);
      }
    }
  }
  nodes.forEach(function(n){
    var c=el('circle');
    c.setAttribute('cx',n.x.toFixed(1));c.setAttribute('cy',n.y.toFixed(1));
    c.setAttribute('r',(1.1+Math.random()*1.7).toFixed(1));
    c.style.animationDuration=(3+Math.random()*3).toFixed(2)+'s';
    c.style.animationDelay=(-Math.random()*4).toFixed(2)+'s';
    g.appendChild(c);
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/assets/search.js"></script>

</script>

</html>

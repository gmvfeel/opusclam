<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPUSCLAM.COM — 클래식 음악 포털</title>
<!-- ★★★ 2026-08-20 · <b>카카오톡·페이스북에 걸리는 미리보기</b> (파트너 발견)
     ═══════════════════════════════════════════════════════════════
     파트너가 다른 분께 주소를 보냈더니 미리보기에 <b>LPSTOCK 광고 배너</b>가
     대표 그림으로 나갔습니다.

     ★ 왜 그랬나 — 이 화면에 <b>og 태그가 하나도 없었습니다.</b>
       무엇을 보여 줄지 안 정해 주면, 카카오톡·페이스북은
       <b>화면에서 제일 큰 그림을 자기가 고릅니다.</b> 그게 광고 배너였습니다.
       설명도 마찬가지로 「여기를 눌러 링크를 확인하세요」라는 <b>기본 문구</b>가
       나갔습니다 — description 은 있었지만 og:description 이 없었으니까요.

     ★ 카카오톡 봇(kakaotalk-scrap)은 middleware.js 의 봇 목록에 있어
       `/` 로 오면 <b>이 화면(home.html)</b>을 받습니다. 그래서 여기 답니다.

     ★★ 카카오톡은 <b>한 번 가져간 것을 오래 담아 둡니다.</b> 고쳐 올려도
       예전 그림이 그대로 나옵니다 — 카카오 「공유 디버거」에서 <b>초기화</b>를
       한 번 눌러야 합니다. 자세한 것은 함께 드린 안내에 적었습니다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="OPUSCLAM.COM">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://opusclam.com/">
<meta property="og:title" content="OPUSCLAM.COM — 클래식 음악 전문 포털">
<meta property="og:description" content="인물 · 작품 · 공연장 · 음악학교 · 음악단체 · 음악용어를 하나로 잇는 클래식 음악 전문 포털입니다.">
<meta property="og:image" content="https://opusclam.com/og-default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="OPUSCLAM.COM — Classic Speciality">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OPUSCLAM.COM — 클래식 음악 전문 포털">
<meta name="twitter:description" content="인물 · 작품 · 공연장 · 음악학교 · 음악단체 · 음악용어를 하나로 잇는 클래식 음악 전문 포털입니다.">
<meta name="twitter:image" content="https://opusclam.com/og-default.png">
<link rel="canonical" href="https://opusclam.com/home.html">
<meta name="robots" content="noindex,follow">

<!-- ★★ 2026-08-19 · 대문에서 <b>갈라 보내는 얇은 문</b> (파트너 요청)
     ═══════════════════════════════════════════════════════════
   ★ 무엇을 하나
       처음 온 사람  → 인트로(/intro.html)
       두 번째부터   → 포털 메인(/home.html)
       봇           → 포털 메인 (vercel.json 이 먼저 보냅니다)

   ★ 왜 이런 파일이 필요한가
     Vercel 은 `/` 요청에 <b>index.html 이 있으면 그것을 먼저</b>
     줍니다. rewrite 는 파일이 없을 때만 듭니다. 그래서 인트로를
     그대로 index.html 로 두면 <b>늘 인트로가 나옵니다.</b>
     (원래는 redirects 로 넘겼는데, 그것이 구글 「리디렉션 오류」의
      원인이라 rewrite 로 바꾸었습니다.)
     그래서 이 자리에 <b>판정만 하는 파일</b>을 두고, 인트로는
     /intro.html 로 옮겼습니다.

   ★ noindex 를 붙였습니다 — 이 화면은 <b>보여줄 내용이 없습니다.</b>
     구글에는 vercel.json 이 곧바로 /home 을 주므로 여기 올 일이
     없지만, 어쩌다 오더라도 빈 화면이 색인되지 않게 막습니다.
     follow 는 남겨 링크는 따라가게 합니다.
   ★ canonical 로 <b>포털 메인이 대표</b>임을 알립니다.

   ★ 자바스크립트가 꺼져 있으면 아래 <noscript> 가 보냅니다.
     아무것도 없으면 흰 화면에 갇힙니다.
     ═══════════════════════════════════════════════════════════ -->
<script>
(function () {
  var HOME  = '/home.html';
  var INTRO = '/intro.html';
  var to = HOME;
  try {
    /* 인트로를 본 적이 없으면 인트로로 — 표시는 인트로가 남깁니다 */
    if (!localStorage.getItem('oc_seen_intro')) to = INTRO;
  } catch (e) {
    /* ★ 저장이 막힌 브라우저(몰래 창 등)에서는 <b>메인으로</b> 보냅니다.
         인트로로 보내면 표시를 못 남겨 <b>갈 때마다 인트로</b>가 됩니다. */
    to = HOME;
  }
  location.replace(to);
})();
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=/home.html">
</noscript>
<style>
  html,body{margin:0;background:#0b0d1e}
</style>
</head>
<body>
  <!-- 자바스크립트가 늦게 돌 때 잠깐 보이는 자리 — 어두운 바탕뿐입니다 -->
  <a href="/home.html" style="position:absolute;left:-9999px">OPUSCLAM 포털로 들어가기</a>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('oc-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>질문하기 · OPUSCLAM</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#0a0d24">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPUSCLAM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/board.css">
</head>
<body data-header="overlay">
<div id="oc-header"></div>
<script src="/assets/include.js"></script>
<script src="/assets/header.js"></script>
<script src="/assets/hero-scene.js" defer></script>

<section class="pdb pdb-board">
  <div class="pdb-bg" aria-hidden="true">
    <div class="wave">
      <div class="scene scene-orbit on">
        <svg viewBox="0 0 1280 460" preserveAspectRatio="xMidYMid slice">
          <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7FD6"/><stop offset="1" stop-color="#C9A94E"/></linearGradient></defs>
          <g fill="url(#dg)"></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="pdb-inner">
    <nav class="pdb-crumb" aria-label="위치">
      <a href="/home.html">홈</a><span>/</span><a href="/community/index.html">OC커뮤니티</a><span>/</span><a href="/community/qna.html">지식나눔</a><span>/</span><span class="on">질문하기</span>
    </nav>
    <header class="pdb-head">
      <div class="pdb-titlebar">
        <div>
          <div class="pdb-eyebrow">OC COMMUNITY</div>
          <h1 class="pdb-title" id="bwHead">질문하기</h1>
          <!-- ★ 2026-08-14 · 갈래 이름을 <b>제목 아래로</b> 내렸습니다 (파트너 요청)
                 전에는 「질문하기 [ 음악지식 Q&A ]」 한 줄이라 좁은 화면에서
                 두 줄로 감기고, 큰 글자에 대괄호가 섞여 어수선했습니다.
                 「질문하기」가 하는 일이고 갈래는 <b>어디에 쓰는지</b>이므로
                 크기를 달리하는 편이 뜻에 맞습니다.
               ★ .pdb-lead 는 다른 화면이 부제에 쓰는 짜임입니다 —
                 새 규칙을 만들지 않고 그것을 씁니다. -->
          <p class="pdb-lead" id="bwSub" style="margin-top:8px"></p>
        </div>
      </div>
    </header>
  </div>
</section>

<main class="board">
  <div id="bw-root"></div>
</main>

<div id="oc-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/board-write.js"></script>
<script>
  (function(){
    /* 갈래 — 주소의 ?track (기본은 음악지식) */
    var TRACK = new URLSearchParams(location.search).get('track') === '전공별' ? '전공별' : '음악지식';
    var CATS = {
      '음악지식': ['음악학교','해외유학','현대음악','콩쿨','연주/공연/음반',
                  '입시/진로관련','연주자/연주단체/작곡과','서양음악사','공연홀','대관관련'],
      '전공별':   ['기악전공','성악전공','작곡전공','음악사/이론전공','교회음악전공','기타전공']
    };
    var label = TRACK === '전공별' ? '전공별 정보나눔' : '음악지식 Q&A';
    /* 제목은 「질문하기」 그대로 두고, 갈래는 아래 작은 줄에 둡니다 */
    document.getElementById('bwSub').textContent = label;

    OCBoardWrite.init({
      table:'qna', bucket:'qna',
      listPage:'qna.html?track=' + encodeURIComponent(TRACK),
      viewPage:'qna-view.html',
      formTitle:'질문 등록 · ' + label,
      fixed:{ track: TRACK },
      categories: CATS[TRACK].map(function(c){ return { value:c }; })
    });
  })();
</script>
<script src="/assets/app.js" defer></script>
</body>
</html>

<style>
  /* ── SELF PR (이 페이지 전용) ── */
  .sp-wrap{max-width:1360px;margin:0 auto;padding:0 24px 80px}

  /* 오늘의 인물 */
  .sp-head{display:flex;gap:30px;align-items:flex-start;border:1px solid var(--line);
    border-radius:14px;padding:28px 30px;background:var(--paper);margin-bottom:26px}
  /* ★★ 2026-08-12 · 사진을 크게 (파트너 요청) ★★
     ─────────────────────────────────────────────────────
     ★ 왜 「여러 장」이 아니라 「한 장 크게」인가
       자료를 세어 보고 정했습니다 — 사진이 있는 인물 6,321명 가운데
       <b>6,316명이 한 장</b>이고 두 장인 사람이 다섯입니다.
       여러 장 자리를 만들어도 채울 사진이 없습니다.
       그래서 <b>한 장을 크게</b> 두는 쪽으로 갑니다.
       160×200 → 300×380 (넓은 화면). 인물 사진은 세로가 길어
       3:4 에 가까운 비율이 자연스럽습니다.
     ★ 사진이 없으면 로고가 들어가는데, 그때는 자리를 조금 줄입니다 —
       큰 빈 칸이 남는 것보다 낫습니다. */
  .sp-photo{flex:0 0 auto;width:300px;height:380px;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(135deg,#262038,#332b4d);overflow:hidden;display:grid;place-items:center}
  .sp-photo img{width:100%;height:100%;object-fit:cover}
  .sp-photo.is-noimg{width:200px;height:250px}
  @media(max-width:1100px){ .sp-photo{width:240px;height:300px} }
  .sp-photo .sp-noimg{width:62%;height:auto;opacity:.4;filter:brightness(0) invert(1)}
  .sp-info{flex:1;min-width:0}
  .sp-role{font-family:var(--serif);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--violet-2);margin-bottom:6px}
  .sp-name{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em;
    color:var(--text);margin:0 0 4px;line-height:1.2}
  .sp-name-en{font-size:15px;color:var(--text-2);margin:0 0 16px;overflow-wrap:anywhere}
  /* ★ 2026-08-12 · 영문 소개 — 접었다 펴는 칸 */
  .sp-en{border:1px solid var(--line);border-radius:12px;background:var(--paper-2);
    padding:0 18px;margin-top:14px}
  .sp-en summary{cursor:pointer;padding:14px 0;font-size:14px;font-weight:600;color:var(--text-2);
    list-style:none;display:flex;align-items:center;gap:9px}
  .sp-en summary::-webkit-details-marker{display:none}
  .sp-en summary::after{content:"▾";margin-left:auto;font-size:12px;color:var(--text-3);
    transition:transform .18s ease}
  .sp-en[open] summary::after{transform:rotate(180deg)}
  .sp-en-badge{font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;
    background:var(--violet-2);border-radius:20px;padding:2px 9px}
  .sp-en-body{padding:0 0 16px;font-size:14.5px;line-height:1.75;color:var(--text-2)}
  .sp-en-body p{margin:0 0 12px}
  /* ★ 2026-08-12 · 작품·수상 목록 */
  .sp-list{margin:0;padding:0;list-style:none;display:grid;gap:9px}
  .sp-list li{display:flex;gap:12px;align-items:baseline;font-size:14.5px;line-height:1.6;
    padding-bottom:9px;border-bottom:1px solid var(--line-2)}
  .sp-list li:last-child{border-bottom:0;padding-bottom:0}
  .sp-list .sp-li-y{flex:0 0 auto;min-width:62px;color:var(--text-3);font-size:13px;
    font-variant-numeric:tabular-nums}
  .sp-list .sp-li-t{color:var(--text);overflow-wrap:anywhere}
  .sp-list .sp-li-s{color:var(--text-3);font-size:13px}
  .sp-more{margin-top:12px;font-size:13px;color:var(--text-3)}
  /* ★ 2026-08-12 · 소개문이 위키백과 <b>머리말까지만</b> 담겨 있어
       중간에 끊긴 것처럼 보입니다. 그 까닭을 알려 주고 원문으로
       가는 길을 둡니다. (수집기가 exintro 로 머리말만 받아옵니다 —
       나중에 절 단위로 더 받아오는 작업을 따로 할 예정입니다) */
  .sp-cut{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:14px;padding:12px 15px;border:1px dashed var(--line-2);
    border-radius:10px;background:var(--paper-2);font-size:13px;color:var(--text-3)}
  .sp-cut a{color:var(--violet-2);text-decoration:none;font-weight:600}
  .sp-cut a:hover{text-decoration:underline}
  .sp-meta{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px;line-height:1.6}
  .sp-meta dt{color:var(--text-3);white-space:nowrap}
  .sp-meta dd{margin:0;color:var(--text-2);overflow-wrap:anywhere}
  .sp-meta a{color:var(--violet-2);text-decoration:none}
  .sp-meta a:hover{text-decoration:underline}
  .sp-daybox{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .sp-badge{font-family:var(--display);font-size:12px;font-weight:700;color:#fff;background:var(--violet-2);
    border-radius:999px;padding:5px 13px;white-space:nowrap}
  .sp-daysel{font-size:14px;padding:9px 14px;border:1px solid var(--line-2);border-radius:8px;
    background:var(--paper);color:var(--text);cursor:pointer}

  /* 정보 묶음 */
  .sp-sec{border-top:1px solid var(--line);padding:24px 0}
  .sp-sec:first-of-type{border-top:0}
  .sp-sec h2{font-family:var(--display);font-size:16px;font-weight:800;letter-spacing:-.01em;
    color:var(--text);margin:0 0 12px;display:flex;align-items:center;gap:9px}
  .sp-sec h2::before{content:"";width:3px;height:15px;background:var(--violet-2);border-radius:2px}
  .sp-body{font-size:var(--sp-fs,15px);line-height:1.85;color:var(--text-2);overflow-wrap:anywhere}
  .sp-body p{margin:0 0 12px}
  .sp-tags{display:flex;flex-wrap:wrap;gap:8px}
  .sp-tag{font-size:13px;color:var(--text-2);border:1px solid var(--line-2);border-radius:999px;padding:5px 13px}
  .sp-tag a{color:inherit;text-decoration:none}
  .sp-tag-link{border-color:rgba(124,99,176,.5);padding:0}
  .sp-tag-link a{display:inline-flex;align-items:center;gap:5px;color:var(--violet-2);
    text-decoration:none;padding:5px 13px;font-weight:600}
  .sp-tag-link:hover{background:var(--violet-2)}
  .sp-tag-link:hover a{color:#fff}

  /* 인물DB 로 가는 단추 */
  .sp-go{display:flex;gap:14px;align-items:center;border:1px solid rgba(124,99,176,.4);
    border-radius:12px;padding:18px 20px;background:var(--paper-2);margin-top:6px}
  .sp-go-t{flex:1;min-width:0}
  .sp-go-t b{display:block;font-size:15px;color:var(--text);margin-bottom:3px}
  .sp-go-t span{font-size:13.5px;color:var(--text-3)}
  .sp-go a{flex:0 0 auto;font-family:var(--display);font-size:13.5px;font-weight:700;color:#fff;
    background:var(--violet-2);border-radius:8px;padding:11px 20px;text-decoration:none;white-space:nowrap}

  /* 지난 인물 */
  .sp-past{border-top:1px solid var(--line);margin-top:34px;padding-top:24px}
  .sp-past h2{font-family:var(--display);font-size:15px;font-weight:800;color:var(--text);margin:0 0 16px}
  .sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px}
  .sp-card{display:block;text-decoration:none;border:1px solid var(--line);border-radius:12px;
    overflow:hidden;background:var(--paper);transition:border-color .15s,transform .15s}
  .sp-card:hover{border-color:var(--violet-2);transform:translateY(-2px)}
  .sp-card-img{display:block;aspect-ratio:3/4;background:linear-gradient(135deg,#262038,#332b4d);
    display:grid;place-items:center;overflow:hidden}
  .sp-card-img img{width:100%;height:100%;object-fit:cover}
  .sp-card-img .sp-noimg{width:62%;height:auto;opacity:.4;filter:brightness(0) invert(1)}
  .sp-card-body{padding:10px 11px 12px}
  .sp-card-day{font-family:var(--display);font-size:11px;font-weight:700;color:var(--violet-2);
    letter-spacing:.02em;display:block;margin-bottom:3px}
  .sp-card-name{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.35;
    display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sp-card-sub{font-size:11.5px;color:var(--text-3);display:block;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 안내·상태 */
  .sp-note{font-size:13px;color:var(--text-3);line-height:1.75;margin-top:26px;
    padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2)}
  .sp-empty{padding:70px 20px;text-align:center;color:var(--text-3);font-size:15px;line-height:1.8}
  .sp-skel{height:200px;border-radius:12px;background:var(--paper-2);animation:spp 1.1s ease-in-out infinite}
  @keyframes spp{0%,100%{opacity:.55}50%{opacity:.9}}

  @media(max-width:720px){
    .sp-head{flex-wrap:wrap;gap:18px;padding:20px}
    .sp-photo{width:118px;height:148px}
    .sp-name{font-size:23px}
    .sp-daybox{order:-1;width:100%;flex-direction:row;justify-content:space-between;align-items:center}
    .sp-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
    .sp-go{flex-wrap:wrap}
  }
</style>
</head>

<main class="sp-wrap"><article class="pv">
  <div id="spMain"><div class="sp-skel"></div></div>

  <div class="sp-note">
    이 코너는 <strong>인물DB</strong>에 정리된 내용을 바탕으로 매일 자동으로 구성됩니다.
    소개·이력·대표작이 충실하게 채워진 분을 먼저 소개합니다.<br>
    앞으로는 <strong>오퍼스클램에 등록하신 회원</strong>을 중심으로 소개할 예정입니다.
    인물 정보는 공개된 자료를 취합해 정리한 것이므로 빠진 내용이나 잘못된 정보가 있을 수 있습니다.
    수정이 필요한 부분을 발견하시면 알려주세요.
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/assets/pv.js" defer></script>
<script>
(function () {
  var SB_URL = 'https://ptdxzxkgddvkusamkiol.supabase.co';
  var SB_KEY = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';
  var H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };
  var LOGO = '/assets/logo.png';

  var mainEl = document.getElementById('spMain');
  var pastEl = document.getElementById('spPast');

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function nl2br(v) { return esc(v).replace(/\r?\n/g, '<br>'); }
  function has(v) { return v != null && String(v).trim() !== ''; }
  function dayLabel(d) {
    var p = String(d || '').slice(0, 10).split('-');
    return p.length === 3 ? p[0] + '.' + p[1] + '.' + p[2] : d;
  }
  function api(path) {
    return fetch(SB_URL + '/rest/v1/' + path, { headers: H }).then(function (r) {
      if (!r.ok) throw new Error('load failed');
      return r.json();
    });
  }
  function paras(txt) {
    return String(txt).split(/\n\s*\n/).map(function (p) {
      return '<p>' + nl2br(p.trim()) + '</p>';
    }).join('');
  }
  function splitList(txt) {
    return String(txt).split(/[,·;／\/\n]+/).map(function (x) { return x.trim(); })
      .filter(function (x) { return x; });
  }
  function tags(txt) {
    var arr = splitList(txt);
    if (arr.length < 2) return '<div class="sp-body">' + nl2br(txt) + '</div>';
    return '<div class="sp-tags">' + arr.map(function (x) {
      return '<span class="sp-tag">' + esc(x) + '</span>';
    }).join('') + '</div>';
  }
  function section(title, inner) {
    return '<section class="sp-sec"><h2>' + esc(title) + '</h2>' + inner + '</section>';
  }
  /* 사진이 없을 때 로고를 대신 넣습니다 */
  function photoHtml(url, name) {
    if (has(url)) return '<img src="' + esc(url) + '" alt="' + esc(name || '') + '" loading="lazy">';
    return '<img class="sp-noimg" src="' + LOGO + '" alt="" loading="lazy">';
  }

  function render(row, p, list) {
    if (!p) {
      mainEl.innerHTML = '<div class="sp-empty">오늘 소개할 분이 아직 준비되지 않았습니다.<br>곧 소개해 드리겠습니다.</div>';
      return;
    }

    var nm = /[가-힣]/.test(String(p.name_ko || '')) ? p.name_ko : (p.name_ko || p.name_en || '');
    var role = (p.instrument || p.field || '').trim();

    var meta = '';
    if (has(p.life))        meta += '<dt>생몰</dt><dd>' + esc(p.life) + '</dd>';
    if (has(p.nationality)) meta += '<dt>국적</dt><dd>' + esc(p.nationality) + '</dd>';
    if (has(p.school))      meta += '<dt>출신학교</dt><dd>' + esc(p.school) + '</dd>';
    if (has(p.era_name))    meta += '<dt>사조</dt><dd>' + esc(p.era_name) + '</dd>';
    if (has(p.era_yr))      meta += '<dt>활동 시기</dt><dd>' + esc(p.era_yr) + '</dd>';

    var opts = list.map(function (d) {
      return '<option value="' + esc(d.ymd) + '"' + (d.ymd === row.ymd ? ' selected' : '') + '>'
        + esc(dayLabel(d.ymd)) + '</option>';
    }).join('');

    var head =
      '<div class="sp-head">' +
        '<div class="sp-photo' + (has(p._photo) ? '' : ' is-noimg') + '">'
          + photoHtml(p._photo, nm) + '</div>' +
        '<div class="sp-info">' +
          (role ? '<div class="sp-role">' + esc(role) + '</div>' : '') +
          '<h2 class="sp-name">' + esc(nm) + '</h2>' +
          (has(p.name_en) && p.name_en !== nm ? '<p class="sp-name-en">' + esc(p.name_en) + '</p>' : '') +
          (meta ? '<dl class="sp-meta">' + meta + '</dl>' : '') +
        '</div>' +
        '<div class="sp-daybox">' +
          '<span class="sp-badge">' + esc(dayLabel(row.ymd)) + '</span>' +
          (list.length > 1 ? '<select class="sp-daysel" id="spDay" aria-label="날짜 선택">' + opts + '</select>' : '') +
        '</div>' +
      '</div>';

    var secs = '';

    /* ★★ 2026-08-12 · 소개문 — 한국어와 영문을 함께 (파트너 요청) ★★
       ──────────────────────────────────────────────────────────
       ★ 왜
         영문 소개가 있는 인물이 <b>다섯 배 넘게 많습니다</b>
         (한국어 1,716명 · 영문 8,863명).
         예전에는 한국어만 써서 대부분의 인물에서 소개가 비어 보였습니다.

       ★ 어떻게
         한국어가 있으면 그것을 펼쳐서 보여 주고, 영문은 <b>접어서</b>
         아래에 둡니다 — 원문을 확인하고 싶은 분을 위한 자리입니다.
         한국어가 없으면 <b>영문을 펼쳐서</b> 보여 줍니다. 접혀 있으면
         소개가 아예 없는 것처럼 보이기 때문입니다.

       ★ 번역하지 않습니다
         8,863명을 기계번역하면 비용이 들고 품질도 고르지 않습니다.
         원문이 위키백과 글이라 정확하고, 「영문」 표시를 달아 두면
         읽는 분이 브라우저 번역을 쓸 수 있습니다. */
    var hasKo = has(p.description), hasEn = has(p.description_en);

    /* ★ 소개문이 끊긴 것처럼 보이는 까닭을 알려 줍니다 (2026-08-12)
         소개문은 위키백과 문서의 <b>머리말까지만</b> 담겨 있습니다.
         그래서 문장 도중에 끝나는 일이 있습니다. 화면이 자르는 것이
         아니므로 「더 보기」로는 해결되지 않고, 원문으로 보내야 합니다. */
    function cutNote(txt, wikiUrl) {
      var s = String(txt || '').trim();
      /* 문장이 온전히 끝났으면 안내를 붙이지 않습니다 */
      if (/[.!?。]["')\]]?$/.test(s) || /(습니다|입니다|이다|였다|한다)[.]?$/.test(s)) return '';
      return '<div class="sp-cut">'
        + '<span>소개문이 위키백과 문서의 머리말까지만 담겨 있어 여기서 끊깁니다.</span>'
        + (has(wikiUrl)
          ? '<a href="' + esc(wikiUrl) + '" target="_blank" rel="noopener">위키백과에서 전문 보기 &#8599;</a>'
          : '')
        + '</div>';
    }

    if (hasKo) {
      secs += section('소개 · 이력',
        '<div class="sp-body">' + paras(p.description) + '</div>'
        + cutNote(p.description, p.link_wiki)
        + (hasEn
          ? '<details class="sp-en"><summary>'
            + '<span class="sp-en-badge">영문</span> 영문 소개 원문 보기'
            + '</summary><div class="sp-en-body">' + paras(p.description_en) + '</div></details>'
          : ''));
    } else if (hasEn) {
      secs += section('소개 · 이력 (영문)',
        '<div class="sp-body">' + paras(p.description_en) + '</div>'
        + cutNote(p.description_en, p.link_wiki)
        + '<p class="sp-more">위키백과 영문 문서에서 가져온 글입니다. '
        + '한국어 소개는 준비되는 대로 함께 보여 드리겠습니다.</p>');
    }

    /* ★ 작품 — person_works 를 이어 읽은 것이 있으면 그것을 씁니다.
         없으면 예전처럼 persons.works(글자 한 칸)를 씁니다. */
    if (p._works && p._works.length) {
      var ws = p._works.slice(0, 12);
      secs += section('대표작 (' + p._works.length + '곡)',
        '<ul class="sp-list">' + ws.map(function (w) {
          var ti = has(w.title_ko) ? w.title_ko : (w.title || '');
          var yr = has(w.year_text) ? w.year_text : (w.year_from || '');
          var sub = [w.opus, w.form_ko || w.genre].filter(has).join(' · ');
          return '<li><span class="sp-li-y">' + esc(yr) + '</span>'
            + '<span class="sp-li-t">' + esc(ti)
            + (sub ? ' <span class="sp-li-s">' + esc(sub) + '</span>' : '')
            + '</span></li>';
        }).join('') + '</ul>'
        + (p._works.length > ws.length
          ? '<p class="sp-more">그리고 ' + (p._works.length - ws.length)
            + '곡이 더 있습니다 — 인물DB에서 전부 보실 수 있습니다.</p>'
          : ''));
    } else if (has(p.works)) {
      secs += section('대표작', tags(p.works));
    }

    /* ★ 수상 이력 — 담긴 것이 있을 때만 */
    if (p._awards && p._awards.length) {
      var as = p._awards.slice(0, 10);
      secs += section('수상 · 이력 (' + p._awards.length + '건)',
        '<ul class="sp-list">' + as.map(function (a) {
          var ti = has(a.title_ko) ? a.title_ko : (a.title || '');
          var yr = has(a.year_text) ? a.year_text : (a.year || '');
          var sub = [a.org, a.kind_ko].filter(has).join(' · ');
          return '<li><span class="sp-li-y">' + esc(yr) + '</span>'
            + '<span class="sp-li-t">' + esc(ti)
            + (sub ? ' <span class="sp-li-s">' + esc(sub) + '</span>' : '')
            + '</span></li>';
        }).join('') + '</ul>'
        + (p._awards.length > as.length
          ? '<p class="sp-more">그리고 ' + (p._awards.length - as.length) + '건이 더 있습니다.</p>'
          : ''));
    }

    if (has(p.field))       secs += section('분야', tags(p.field));

    /* 관련 자료 */
    var links = '';
    if (has(p.link_wiki))  links += '<span class="sp-tag"><a href="' + esc(p.link_wiki) + '" target="_blank" rel="noopener">위키 문서 &#8599;</a></span>';
    if (has(p.link_audio)) links += '<span class="sp-tag"><a href="' + esc(p.link_audio) + '" target="_blank" rel="noopener">음원 &#8599;</a></span>';
    if (has(p.link_video)) links += '<span class="sp-tag"><a href="' + esc(p.link_video) + '" target="_blank" rel="noopener">영상 &#8599;</a></span>';
    if (links) secs += section('관련 자료', '<div class="sp-tags">' + links + '</div>');

    /* 인물DB 로 가는 단추 */
    secs += section('더 보기',
      '<div class="sp-go">' +
        '<div class="sp-go-t"><b>' + esc(nm) + '</b>' +
          '<span>인물DB에서 사사관계·소속단체·연주 기록까지 보실 수 있습니다</span></div>' +
        '<a href="/db/person-view.html?id=' + encodeURIComponent(p.id) + '">인물DB 보기</a>' +
      '</div>');

    mainEl.innerHTML = head + secs;

    var sel = document.getElementById('spDay');
    if (sel) sel.addEventListener('change', function () { load(sel.value); });
  }

  function renderPast(list, curYmd) {
    var rest = list.filter(function (d) { return d.ymd !== curYmd && d._p; });
    if (!rest.length) { pastEl.innerHTML = ''; return; }
    pastEl.innerHTML =
      '<div class="sp-past"><h2>지난 소개</h2><div class="sp-grid">' +
      rest.slice(0, 12).map(function (d) {
        var p = d._p;
        var nm = /[가-힣]/.test(String(p.name_ko || '')) ? p.name_ko : (p.name_ko || p.name_en || '');
        var sub = (p.instrument || p.field || '').trim();
        return '<a class="sp-card" href="?ymd=' + encodeURIComponent(d.ymd) + '">' +
          '<span class="sp-card-img">' + photoHtml(p._photo, nm) + '</span>' +
          '<span class="sp-card-body">' +
            '<span class="sp-card-day">' + esc(dayLabel(d.ymd)) + '</span>' +
            '<span class="sp-card-name">' + esc(nm) + '</span>' +
            (sub ? '<span class="sp-card-sub">' + esc(sub) + '</span>' : '') +
          '</span></a>';
      }).join('') + '</div></div>';
  }

  function load(ymd) {
    mainEl.innerHTML = '<div class="sp-skel"></div>';
    pastEl.innerHTML = '';

    api('daily_self_pr?select=ymd,person_id,score&order=ymd.desc&limit=30')
      .then(function (list) {
        if (!list.length) { render(null, null, []); return; }

        var row = ymd ? list.filter(function (d) { return d.ymd === ymd; })[0] : list[0];
        if (!row) row = list[0];

        var ids = list.map(function (d) { return d.person_id; }).filter(function (v) { return v; });
        var uniq = ids.filter(function (v, i) { return ids.indexOf(v) === i; });
        if (!uniq.length) { render(row, null, list); return; }

        /* ★★ 2026-08-12 · 담긴 자료를 더 끌어옵니다 (파트너 요청) ★★
           ──────────────────────────────────────────────────────────
           ★ description_en 을 <b>함께 받습니다</b>
             예전에는 조회조차 하지 않았습니다. 그런데 세어 보니
             한국어 소개는 1,716명인데 <b>영문 소개는 8,863명</b>입니다.
             다섯 배 넘게 많습니다. 한국어만 쓰면 대부분의 인물에서
             소개가 비어 보였습니다.

           ★ 작품·수상을 <b>이어서 받습니다</b>
             작품 16,642건 · 수상 5,989건이 담겨 있는데 SELF PR 은
             persons.works(글자 한 칸)만 썼습니다. 표를 이어 읽으면
             해마다 정리된 목록을 보여드릴 수 있습니다.
             ★ hidden=not.is.true — 숨긴 줄은 빼야 합니다.
               인물DB 상세(assets/works.js)가 쓰는 조건과 같게 맞췄습니다. */
        return Promise.all([
          api('persons?select=id,name_ko,name_en,field,instrument,nationality,life,era_name,era_yr,'
              + 'school,works,description,description_en,image_url,link_wiki,link_audio,link_video'
              + '&id=in.(' + uniq.join(',') + ')'),
          api('entity_photo_main?select=entity_id,src,thumb&entity_type=eq.person'
              + '&entity_id=in.(' + uniq.join(',') + ')&limit=' + uniq.length),
          /* 작품 — 이름이 있는 것만, 오래된 것부터 */
          api('person_works?select=person_id,title,title_ko,opus,year_text,year_from,genre,form_ko'
              + '&person_id=in.(' + uniq.join(',') + ')&hidden=not.is.true'
              + '&order=year_from.asc,id.asc&limit=400').catch(function () { return []; }),
          /* 수상 — 해마다 */
          api('person_awards?select=person_id,year,year_text,title,title_ko,org,kind_ko'
              + '&person_id=in.(' + uniq.join(',') + ')&hidden=not.is.true'
              + '&order=year.asc,id.asc&limit=200').catch(function () { return []; }),
        ]).then(function (res) {
          var people = res[0] || [], photos = res[1] || [];
          var works = res[2] || [], awards = res[3] || [];
          var byId = {}, phId = {};
          photos.forEach(function (x) { phId[x.entity_id] = x.thumb || x.src; });
          /* 사람마다 작품·수상을 갈라 담아 둡니다 */
          var wkId = {}, awId = {};
          works.forEach(function (w) { (wkId[w.person_id] = wkId[w.person_id] || []).push(w); });
          awards.forEach(function (a) { (awId[a.person_id] = awId[a.person_id] || []).push(a); });

          people.forEach(function (x) {
            /* 인물DB 에 있는 사진을 먼저 쓰고, 없으면 모아둔 사진을 씁니다 */
            x._photo = has(x.image_url) ? x.image_url : (phId[x.id] || '');
            x._works = wkId[x.id] || [];
            x._awards = awId[x.id] || [];
            byId[x.id] = x;
          });
          list.forEach(function (d) { d._p = byId[d.person_id] || null; });

          render(row, byId[row.person_id] || null, list);
          renderPast(list, row.ymd);
        });
      })
      .catch(function () {
        mainEl.innerHTML = '<div class="sp-empty">정보를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
      });
  }

  /* 글자 크기 조절 — 다른 뷰 화면과 같은 방식 */
  (function () {
    var btns = document.querySelectorAll('.pdb-fontsize .fs-btn');
    if (!btns.length) return;
    var sizes = [13, 15, 17, 19, 21], ix = 1;
    var box = document.querySelector('main.sp-wrap');
    function apply() { if (box) box.style.setProperty('--sp-fs', sizes[ix] + 'px'); }
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-fs');
        if (k === 'up') ix = Math.min(sizes.length - 1, ix + 1);
        else if (k === 'down') ix = Math.max(0, ix - 1);
        else ix = 1;
        apply();
      });
    });
  })();

  var q = new URLSearchParams(location.search);
  load(q.get('ymd') || '');
})();
</script>
<script src="/assets/app.js" defer></script>
<!-- 앱 설치 안내 · 서비스워커 등록 (공용) -->
<script src="/assets/pwa-install.js" defer></script>
</body>

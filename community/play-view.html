<style>
/* ============================================================
   연주 상세 · 조언 — community/play-view.html
   ------------------------------------------------------------
   2026-08-16

   ★ 이 화면의 주인공은 <b>영상</b>입니다. 크게 놓고, 그 아래에
     「어떤 조언을 받고 싶은지」와 조언들을 잇습니다.

   ★ 조언은 <b>점수가 아니라 글</b>입니다. 별점·추천 수가 없습니다.
     대신 올린 사람이 「도움이 됐습니다」를 표시할 수 있습니다 —
     점수가 아니라 고마움이고, 좋은 조언이 위로 올라옵니다.

   ★ 조언은 <b>누구나</b> 남길 수 있습니다. 올리는 것만 전공자·
     음악관계자·음악학교로 한정합니다(들을 사람이 많아야 합니다).
   ============================================================ */

.pv2{max-width:900px;margin:0 auto;padding:36px 24px 90px}

/* ── 영상 ──────────────────────────────────────────────
   ★ 2026-08-16 · 영상<b>만</b> 넓힙니다 (파트너 지시)
     852 → 1,092px. 글은 852px 그대로 둡니다 — 한 줄이 너무 길면
     눈이 다음 줄 첫 글자를 찾기 어려워집니다(40~55자가 읽기 좋습니다).
   ★ 가운데를 지키며 양옆으로만 벌립니다. 화면이 좁으면 저절로
     본문 폭에 맞춰집니다. */
.pv-video{position:relative;width:min(1092px, calc(100vw - 48px));
  margin:0 auto 22px;left:50%;transform:translateX(-50%);
  aspect-ratio:16/9;border-radius:14px;
  overflow:hidden;background:var(--ink,#0E1230)}
.pv-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ── 표지 + 재생 단추 (2026-08-16) ────────────────────────
   ★ 파트너 지적 — 유튜브가 그리는 <b>빨간 재생 단추</b>가 보였습니다.
     레슨:ON·상세 화면은 <b>흰 테두리 동그라미</b>를 쓰는데 이곳만 달랐습니다.
   ★ 유튜브 단추는 우리가 바꿀 수 없습니다. 그래서 <b>표지 그림을 먼저</b>
     놓고 그 위에 우리 단추를 얹습니다. 누르면 그때 영상이 실립니다.
   ★ 덤으로 화면이 <b>가벼워집니다</b> — 유튜브 플레이어는 무거운데,
     누르기 전에는 그림 한 장만 받습니다. */
.pv-cover{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;
  cursor:pointer;background:var(--ink,#0E1230);display:grid;place-items:center}
.pv-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.62;transition:opacity .18s ease,transform .3s ease}
.pv-cover:hover img{opacity:.8;transform:scale(1.02)}
/* 흰 동그라미 — board.css 의 .bv-playbtn 과 같은 값 */
.pv-cover i{position:relative;z-index:1;font-style:normal;
  width:72px;height:72px;border-radius:50%;
  border:2px solid rgba(255,255,255,.8);color:#fff;
  display:grid;place-items:center;font-size:24px;padding-left:5px;
  background:rgba(0,0,0,.35);pointer-events:none;
  transition:transform .18s ease,background .18s ease}
.pv-cover:hover i{transform:scale(1.12);background:rgba(0,0,0,.5)}
.pv-cover span{position:absolute;left:0;right:0;bottom:16px;z-index:1;
  text-align:center;font-size:12.5px;letter-spacing:.02em;
  color:rgba(255,255,255,.72);pointer-events:none}
.pv-cover:focus-visible{outline:2px solid var(--violet-2);outline-offset:-4px}
@media (max-width:620px){ .pv-cover i{width:56px;height:56px;font-size:19px} }

/* ── 머리 ────────────────────────────────────────────── */
.pv-t{font-size:23px;font-weight:800;letter-spacing:-.03em;color:var(--text);
  line-height:1.35;margin:0 0 10px}
.pv-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-size:13px;color:var(--text-3);margin:0 0 20px}
.pv-meta b{font-weight:700;color:var(--text-2)}
.pv-meta .dot{color:var(--line-2)}
.pv-tag{display:inline-flex;align-items:center;padding:4px 11px;border-radius:14px;
  background:var(--paper-2);font-size:11.5px;font-weight:700;color:var(--text-2)}

/* 「어떤 조언을 받고 싶은지」 */
.pv-ask{padding:18px 20px;margin:0 0 30px;border-radius:12px;
  background:var(--paper-2);border-left:3px solid var(--violet-2)}
.pv-ask h3{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.02em;
  color:var(--violet-2)}
.pv-ask p{margin:0;font-size:14px;line-height:1.85;color:var(--text-2);
  white-space:pre-wrap;word-break:break-word}

/* ── 조언 ────────────────────────────────────────────── */
.pv-sec{margin-top:38px;padding-top:26px;border-top:2px solid var(--text-3)}
.pv-sech{display:flex;align-items:baseline;gap:9px;margin:0 0 8px}
.pv-sech h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.pv-sech span{font-size:13px;color:var(--text-3)}
.pv-guide{margin:0 0 22px;font-size:12.5px;line-height:1.8;color:var(--text-3)}
.pv-guide b{color:var(--text-2)}

.adv{display:flex;flex-direction:column;gap:0}
.adv-item{padding:20px 0;border-bottom:1px solid var(--line)}
.adv-item:first-child{padding-top:0}
.adv-head{display:flex;align-items:center;gap:8px;margin:0 0 9px}
.adv-who{font-size:13.5px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
/* ★ span 에 padding 을 주려면 display 를 함께 적어야 합니다 —
     기본값 inline 은 좌우 padding 이 줄 흐름에 반영되지 않습니다.
     (play.html 에서 같은 실수로 여백이 안 먹은 적이 있습니다) */
.adv-type{display:inline-block;font-size:11px;color:var(--text-3);
  padding:2px 8px;border-radius:10px;background:var(--paper-2)}
.adv-when{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.adv-body{margin:0;font-size:14px;line-height:1.9;color:var(--text-2);
  white-space:pre-wrap;word-break:break-word}
/* 「도움이 됐습니다」 — 점수가 아니라 고마움의 표시 */
.adv-help{display:inline-flex;align-items:center;gap:5px;margin-top:11px;
  padding:6px 12px;border-radius:16px;border:1px solid var(--line-2);
  background:var(--paper);font-size:12px;font-weight:700;color:var(--text-3);
  cursor:default;font-family:inherit}
.adv-help.on{border-color:#C9A94E;background:rgba(201,169,78,.1);color:#8a6d1e}
.adv-help.can{cursor:pointer}
.adv-help.can:hover{border-color:#C9A94E;color:#8a6d1e}
.adv-help svg{width:13px;height:13px}
html[data-theme="dark"] .adv-help.on{background:rgba(201,169,78,.16);color:#d9bd6a}

.adv-empty{padding:44px 20px;text-align:center;font-size:14px;line-height:1.9;
  color:var(--text-3)}
.adv-empty b{display:block;font-size:15px;color:var(--text-2);margin-bottom:6px}

/* ── 조언 쓰기 ───────────────────────────────────────── */
.wr{margin-top:30px;padding:20px;border:1px solid var(--line);border-radius:14px;
  background:var(--paper)}
.wr textarea{width:100%;box-sizing:border-box;min-height:110px;padding:13px 15px;
  border:1px solid var(--line-2);border-radius:11px;font-size:14px;font-family:inherit;
  line-height:1.8;background:var(--paper);color:var(--text);resize:vertical}
.wr textarea:focus{outline:none;border-color:var(--violet-2)}
.wr-act{display:flex;align-items:center;gap:10px;margin-top:12px}
.wr-act .n{font-size:12px;color:var(--text-3)}
.wr-act button{margin-left:auto;height:42px;padding:0 22px;border-radius:11px;
  border:0;background:var(--violet-2);color:#fff;font-family:inherit;
  font-size:13.5px;font-weight:800;cursor:pointer}
.wr-act button:hover{background:#4a3d7e}
.wr-act button[disabled]{opacity:.5;cursor:default}
.wr-login{padding:22px;text-align:center;font-size:13.5px;line-height:1.8;
  color:var(--text-3);border:1px dashed var(--line-2);border-radius:14px;margin-top:30px}
.wr-login a{color:var(--violet-2);font-weight:800;text-decoration:none}
.wr-login a:hover{text-decoration:underline}

.pv-msg{display:none;padding:14px 16px;margin:14px 0 0;border-radius:11px;
  font-size:13px;line-height:1.7}
.pv-msg.on{display:block}
.pv-msg.err{background:#fdeeee;color:#9a2323;border:1px solid #f0c4c4}
html[data-theme="dark"] .pv-msg.err{background:#2a1616;color:#e8a0a0;border-color:#4a2020}

.pv-load{padding:80px 20px;text-align:center;color:var(--text-3);font-size:14px}

/* ── 맨 아래 돌아가기 (2026-08-16) ────────────────────────
   ★ 2026-08-16 (두 번째) · 다른 뷰 화면과 <b>같은 방식</b>으로 (파트너 지시)
     넓은 화면에서는 <b>왼쪽에 붙어 따라다니는 세로 탭</b>(.pv-sidetabs)을
     씁니다 — 핫토픽·오퍼니티 등 게시판 뷰가 다 그렇습니다. 짜임은
     assets/board.css 에 이미 있으므로 마크업만 두면 됩니다.
   ★ 좁은 화면에서는 세로 탭이 자리를 가려 감춰집니다. 그래서 맨 아래
     단추를 <b>남겨</b> 둡니다(.pv-tolist-m 과 같은 몫). */
.pv-back{display:none;align-items:center;gap:10px;margin-top:40px;
  padding-top:24px;border-top:1px solid var(--line)}
.pv-back a{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  flex:1;height:46px;padding:0 20px;
  border-radius:12px;font-size:13.5px;font-weight:700;text-decoration:none;
  border:1px solid var(--line-2);background:var(--paper);color:var(--text-2);
  transition:border-color .15s ease,color .15s ease}
.pv-back a:hover{border-color:var(--violet-2);color:var(--violet-2)}
.pv-back a.go{background:var(--violet-2);border-color:var(--violet-2);color:#fff}
.pv-back a.go:hover{background:#4a3d7e;color:#fff}
.pv-back svg{width:15px;height:15px}

/* 세로 탭이 사라지는 폭(board.css 의 1040px)부터 아래 단추를 보입니다 */
@media (max-width:1040px){ .pv-back{display:flex} }
@media (max-width:520px){ .pv-back{flex-direction:column;align-items:stretch} }

@media (max-width:620px){
  .pv2{padding:24px 16px 80px}
  .pv-t{font-size:19px}
  .pv-video{border-radius:11px;margin-bottom:18px}
  .wr{padding:16px}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  'use strict';

  var SB_URL = 'https://ptdxzxkgddvkusamkiol.supabase.co';
  var SB_KEY = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';
  var U = SB_URL + '/rest/v1/';
  var H = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

  var TYPE_KO = { major:'전공자', industry:'음악관계자', org:'단체·기업',
                  school:'음악학교', general:'일반' };

  function $(id) { return document.getElementById(id); }
  function esc(x) {
    return String(x == null ? '' : x)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function tr(x) {
    try { return (window.OCI18N && window.OCI18N.t) ? window.OCI18N.t(x) : x; }
    catch (e) { return x; }
  }
  function ocN(tpl, v) {
    try { if (window.OCI18N && window.OCI18N.n) return window.OCI18N.n(tpl, v); } catch (e) {}
    return String(tpl).replace('{n}', v);
  }
  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso), now = new Date();
    var day = Math.floor((now - d) / 86400000);
    if (day <= 0) return tr('오늘');
    if (day === 1) return tr('어제');
    if (day < 7) return ocN('{n}일 전', day);
    return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0')
         + '.' + String(d.getDate()).padStart(2, '0');
  }

  var id = new URLSearchParams(location.search).get('id');
  var play = null, me = null;

  if (!id) {
    $('body').innerHTML = '<div class="pv-load">' + esc(tr('주소가 올바르지 않습니다.')) + '</div>';
    return;
  }

  /* 회원 정보는 화면과 <b>따로</b> 받습니다 — 로그인 확인이 늦어도
     영상과 조언은 먼저 보이는 편이 낫습니다. */
  function loadMe() {
    return new Promise(function (ok) {
      function ask(n) {
        n = n || 0;
        if (window.ocAuth && window.ocAuth.myMember) {
          window.ocAuth.myMember().then(function (m) { me = m || null; ok(); })
            .catch(function () { ok(); });
          return;
        }
        if (n > 30) { ok(); return; }
        setTimeout(function () { ask(n + 1); }, 150);
      }
      ask();
    });
  }

  function loadAll() {
    Promise.all([
      fetch(U + 'oc_play?select=*&id=eq.' + encodeURIComponent(id), { headers: H })
        .then(function (r) { return r.ok ? r.json() : []; }),
      fetch(U + 'oc_play_advice?select=*&play_id=eq.' + encodeURIComponent(id)
              + '&status=eq.open&order=helpful.desc,created_at.asc', { headers: H })
        .then(function (r) { return r.ok ? r.json() : []; }),
      loadMe()
    ]).then(function (res) {
      var rows = res[0] || [];
      if (!rows.length) {
        $('body').innerHTML = '<div class="pv-load">' + esc(tr('그런 연주가 없습니다.'))
          + '<br><br><a href="/community/play.html" style="color:var(--violet-2)">'
          + esc(tr('목록으로 가기')) + '</a></div>';
        return;
      }
      play = rows[0];
      draw(res[1] || []);
    }).catch(function () {
      $('body').innerHTML = '<div class="pv-load">' + esc(tr('불러오지 못했습니다.')) + '</div>';
    });
  }

  function draw(advs) {
    var p = play;
    var mine = me && me.id === p.member_id;      /* 내가 올린 것인가 */
    var meta = [];
    if (p.author_name) meta.push('<b>' + esc(p.author_name) + '</b>');
    if (p.author_type) meta.push('<span class="pv-tag">' + esc(tr(TYPE_KO[p.author_type] || p.author_type)) + '</span>');
    if (p.instrument)  meta.push('<span class="pv-tag">' + esc(tr(p.instrument)) + '</span>');
    if (p.composer)    meta.push('<span class="dot">·</span>' + esc(p.composer));
    meta.push('<span class="dot">·</span>' + esc(when(p.created_at)));

    var html = ''
      /* ★ 처음에는 <b>표지 그림</b>만 놓습니다. 누르면 그때 영상이
           실립니다 — 유튜브 빨간 단추를 감추고, 화면도 가벼워집니다. */
      + '<div class="pv-video" id="vBox">'
      +   (p.video_id
            ? '<button type="button" class="pv-cover" id="vCover" aria-label="'
              + esc(tr('영상 보기')) + '">'
              + '<img src="https://i.ytimg.com/vi/' + encodeURIComponent(p.video_id)
              + '/hqdefault.jpg" alt="" loading="lazy" decoding="async">'
              + '<i aria-hidden="true">&#9654;</i>'
              + '<span>' + esc(tr('눌러서 보기')) + '</span>'
              + '</button>'
            : '')
      + '</div>'
      + '<h1 class="pv-t">' + esc(p.title || '') + '</h1>'
      + '<div class="pv-meta">' + meta.join('') + '</div>'
      + (p.body
          ? '<div class="pv-ask"><h3>' + esc(tr('이런 조언을 받고 싶습니다')) + '</h3>'
            + '<p>' + esc(p.body) + '</p></div>'
          : '')

      + '<section class="pv-sec">'
      +   '<div class="pv-sech"><h2>' + esc(tr('조언')) + '</h2>'
      +     '<span>' + (advs.length ? esc(ocN('{n}개', advs.length)) : esc(tr('아직 없습니다'))) + '</span></div>'
      +   '<p class="pv-guide">'
      +     esc(tr('점수를 매기는 곳이 아닙니다.')) + ' <b>'
      +     esc(tr('「여기를 이렇게 해 보면 어떨까요」')) + '</b> '
      +     esc(tr('처럼 구체적으로 적어 주시면 큰 도움이 됩니다.'))
      +   '</p>'
      +   '<div class="adv" id="advBox">' + (advs.length ? advs.map(function (a) { return advHtml(a, mine); }).join('')
          : '<div class="adv-empty"><b>' + esc(tr('아직 조언이 없습니다.')) + '</b>'
            + esc(tr('첫 조언을 남겨 주시겠습니까? 한 줄이라도 좋습니다.')) + '</div>') + '</div>'
      +   writerHtml(mine)
      +   '<div class="pv-msg" id="msg"></div>'
      + '</section>'

      /* 맨 아래 돌아가기 — 조언을 남기고 나면 갈 곳이 있어야 합니다 */
      + '<div class="pv-back">'
      +   '<a href="/community/play.html">'
      +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'
      +     esc(tr('목록으로')) + '</a>'
      +   '<a class="go" href="/community/play-write.html">'
      +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
      +     esc(tr('내 연주 올리기')) + '</a>'
      + '</div>';

    $('body').innerHTML = html;
    bind(mine);
  }

  function advHtml(a, mine) {
    /* ★ 「도움이 됐습니다」는 <b>올린 사람만</b> 누를 수 있습니다.
         다른 사람에게는 표시만 보입니다 — 점수처럼 여럿이 누르는
         것이 아니라, 올린 사람의 고마움이기 때문입니다. */
    var can = mine ? ' can' : '';
    var on = a.helpful ? ' on' : '';
    var show = a.helpful || mine;
    return '<div class="adv-item" data-aid="' + esc(a.id) + '">'
      + '<div class="adv-head">'
      +   '<span class="adv-who">' + esc(a.author_name || '') + '</span>'
      +   (a.author_type ? '<span class="adv-type">' + esc(tr(TYPE_KO[a.author_type] || a.author_type)) + '</span>' : '')
      +   '<span class="adv-when">' + esc(when(a.created_at)) + '</span>'
      + '</div>'
      + '<p class="adv-body">' + esc(a.body || '') + '</p>'
      + (show
          ? '<button type="button" class="adv-help' + on + can + '"'
            + (mine ? '' : ' disabled') + '>'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'
            + '<path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM7 11l4-7a2 2 0 0 1 3 2l-1 5h5a2 2 0 0 1 2 2l-1 6a2 2 0 0 1-2 2H7"/></svg>'
            + esc(tr(a.helpful ? '도움이 됐습니다' : '도움이 됐다고 표시'))
            + '</button>'
          : '')
      + '</div>';
  }

  function writerHtml(mine) {
    if (!me) {
      return '<div class="wr-login">' + esc(tr('조언을 남기려면 로그인이 필요합니다.'))
        + '<br><a href="/account/login.html">' + esc(tr('로그인하러 가기')) + '</a></div>';
    }
    if (mine) {
      /* 자기 연주에 자기가 조언할 까닭이 없습니다 */
      return '<div class="wr-login">' + esc(tr('내가 올린 연주입니다. 조언이 오면 알려 드리겠습니다.')) + '</div>';
    }
    return '<div class="wr">'
      + '<textarea id="advBody" maxlength="1200" placeholder="'
      + esc(tr('예) 3분 20초 부분에서 왼손이 조금 급한 것 같습니다. 조금 늦춰 보시면 어떨까요.')) + '"></textarea>'
      + '<div class="wr-act"><span class="n" id="advN">0 / 1200</span>'
      + '<button type="button" id="advSave">' + esc(tr('조언 남기기')) + '</button></div>'
      + '</div>';
  }

  function bind(mine) {
    /* 표지를 누르면 그 자리에 영상을 싣습니다.
       ★ autoplay=1 — 이미 한 번 눌렀으므로 바로 나오는 것이 맞습니다.
         누르지 않았는데 저절로 소리가 나면 안 되지만, 누른 뒤에는
         한 번 더 누르게 하는 것이 번거롭습니다. */
    var cov = $('vCover');
    if (cov) {
      cov.addEventListener('click', function () {
        var box = $('vBox');
        if (!box || !play.video_id) return;
        box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/'
          + encodeURIComponent(play.video_id) + '?rel=0&modestbranding=1&autoplay=1"'
          + ' title="' + esc(play.title || '') + '"'
          + ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"'
          + ' allowfullscreen></iframe>';
      });
    }

    var ta = $('advBody');
    if (ta) {
      ta.addEventListener('input', function () {
        $('advN').textContent = ta.value.length + ' / 1200';
      });
      $('advSave').addEventListener('click', saveAdvice);
    }
    if (mine) {
      [].forEach.call(document.querySelectorAll('.adv-help.can'), function (b) {
        b.addEventListener('click', function () { toggleHelp(b); });
      });
    }
  }

  function sb() {
    if (window.__ocSb) return window.__ocSb;
    if (!window.supabase || !window.supabase.createClient) return null;
    window.__ocSb = window.supabase.createClient(SB_URL, SB_KEY);
    return window.__ocSb;
  }
  function say(html) {
    var m = $('msg'); if (!m) return;
    m.className = 'pv-msg on err'; m.innerHTML = html;
  }

  function saveAdvice() {
    var ta = $('advBody'), btn = $('advSave');
    var body = (ta.value || '').trim();
    if (body.length < 5) { say(esc(tr('조금 더 적어 주십시오. 다섯 글자 이상이면 됩니다.'))); ta.focus(); return; }
    var c = sb(); if (!c || !me) return;

    btn.disabled = true; btn.textContent = tr('남기는 중…');
    c.from('oc_play_advice').insert({
      play_id: play.id,
      member_id: me.id,
      author_name: me.name || me.username || '회원',
      author_type: me.member_type || null,
      body: body
    }).then(function (r) {
      if (r.error) throw r.error;
      /* 다시 그립니다 — 조언 수도 방아쇠가 세어 두므로 그대로 맞습니다 */
      location.reload();
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = tr('조언 남기기');
      say(esc(tr('남기지 못했습니다')) + ' — ' + esc(e && e.message ? e.message : e));
    });
  }

  function toggleHelp(btn) {
    var wrap = btn.closest('.adv-item');
    var aid = wrap && wrap.getAttribute('data-aid');
    if (!aid) return;
    var c = sb(); if (!c) return;
    var turnOn = !btn.classList.contains('on');

    btn.disabled = true;
    /* ★ 함수로 부릅니다 — 「올린 사람만」을 서버에서 확인합니다.
         화면에서만 막으면 손대는 사람이 있습니다. */
    c.rpc('oc_play_mark_helpful', { p_advice_id: Number(aid), p_on: turnOn })
      .then(function (r) {
        if (r.error) throw r.error;
        btn.classList.toggle('on', turnOn);
        btn.lastChild.nodeValue = tr(turnOn ? '도움이 됐습니다' : '도움이 됐다고 표시');
        btn.disabled = false;
      })
      .catch(function (e) {
        btn.disabled = false;
        say(esc(tr('표시하지 못했습니다')) + ' — ' + esc(e && e.message ? e.message : e));
      });
  }

  loadAll();
})();
</script>

<main class="board">

<script>
  /* ★★ 2026-08-13 · 오퍼니티 (파트너 요청) ★★
     ─────────────────────────────────────────────────────────────
     ★ 무엇인가
       핫토픽보다 <b>더 자유롭게</b> 쓰는 커뮤니티 게시판입니다.
       핫토픽은 「음악계의 화제와 이슈」라 글이 무거워지는데,
       오퍼니티는 수다·고민·자랑도 괜찮은 자리입니다.

     ★ 핫토픽 설정을 <b>그대로</b> 씁니다 — 표만 다릅니다.
       엔진(assets/board.js)이 아홉 게시판을 한 코드로 다루므로
       설정만 바꾸면 됩니다. 화면을 새로 만들지 않았습니다.

     ★ 분류만 다릅니다
       핫토픽 국내 / 해외
       오퍼니티 <b>수다 · 고민 · 자랑 · 질문 · 추천</b>
       ★ 표에 못을 박아 두었으므로(opusnity_category_ck) 이 다섯 가지
         밖의 값은 저장되지 않습니다. 여기 목록과 <b>같아야 합니다.</b> */
  document.addEventListener('DOMContentLoaded', function(){
    OCBoard.list({
      table:'opusnity', pageSize:20, viewPage:'opusnity-view.html', writePage:'opusnity-write.html',
      searchCols:['title','body','keywords'],
      categories:[{value:'',label:'전체'},
                  {value:'수다',label:'수다'},
                  {value:'고민',label:'고민'},
                  {value:'자랑',label:'자랑'},
                  {value:'질문',label:'질문'},
                  {value:'추천',label:'추천'}],
      twoCol:true, articleStyle:true, writeRole:'member', pinnedFirst:true, defaultSort:'created_at',
      reactions:true, rowThumb:true
    });
  });
</script>

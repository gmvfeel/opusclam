<style>
  /* ── 지식나눔 전용 ── */

  /* 오늘 현황 */
  .qn-todays{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px}
  .qn-today{display:inline-flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--text-3)}
  .qn-today i{font-style:normal}
  .qn-today b{font-size:16px;font-weight:900;letter-spacing:-.03em;
    color:var(--violet-2,#7C63B0);font-variant-numeric:tabular-nums}

  /* 다크모드 — 네이비가 어두워 테두리가 묻히므로 밝은 쪽으로 */
  html[data-theme="dark"] .qn-bestwrap{border-color:#5b6cb8}
  html[data-theme="dark"] .qn-arw{border-color:rgba(147,165,222,.3)}
  html[data-theme="dark"] .qn-arw:hover{border-color:#93a5de;color:#93a5de}
  @keyframes qnsk{0%{background-position:100% 0}100%{background-position:0 0}}

  /* Best Q&A — 네이비 테두리 2px + 상단 액센트 바 5px */
  .qn-bestbox{margin-top:36px}
  .qn-bestwrap{border:2px solid #41508e;border-top-width:5px;border-radius:16px;
    background:var(--paper);padding:30px 30px 34px}
  .qn-besthead{display:flex;align-items:center;margin-bottom:24px}
  .qn-bestttl{font-size:27px;font-weight:800;letter-spacing:-.03em;color:var(--text)}
  .qn-bestnav{margin-left:auto;display:flex;gap:7px}
  .qn-arw{width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:16px;
    border:1px solid rgba(65,80,142,.24);border-radius:50%;background:var(--paper);color:var(--text-3);
    line-height:1}
  .qn-arw:hover{border-color:#41508e;color:#41508e}
  .qn-besttrack{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;
    scrollbar-width:none}
  .qn-besttrack::-webkit-scrollbar{display:none}
  .qn-best{flex:0 0 100%;scroll-snap-align:start;min-width:0}
  .qn-q{display:flex;align-items:flex-start;gap:11px;text-decoration:none;color:inherit;
    padding:0 0 20px}
  .qn-mark{flex:0 0 auto;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;
    font-size:12.5px;font-weight:800;color:#fff;background:var(--violet-2,#7C63B0)}
  .qn-mark-a{background:var(--text-3,#8a8c9e)}
  .qn-qtitle{flex:1;min-width:0;font-size:17.5px;font-weight:700;letter-spacing:-.03em;
    color:var(--text);line-height:1.45}
  .qn-q:hover .qn-qtitle{color:var(--violet-2)}
  .qn-who{flex:0 0 auto;font-size:12px;color:var(--text-3);padding-top:5px}
  .qn-a{display:flex;align-items:flex-start;gap:11px;padding:21px 22px;border-radius:12px;
    background:var(--paper-2)}
  .qn-atext{flex:1;min-width:0;font-size:13.2px;color:var(--text-2);line-height:1.8;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .qn-bestfoot{display:flex;flex-wrap:wrap;gap:7px 12px;margin-top:18px;align-items:center}
  .qn-bcat{font-size:11px;font-weight:800;color:var(--violet-2);
    background:rgba(124,99,176,.12);border-radius:6px;padding:3px 9px}
  .qn-bnum{font-size:11.5px;color:var(--text-3)}

  /* 질문하기 */
  .qn-askrow{display:flex;justify-content:center;margin-top:22px}
  .qn-ask{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 34px;
    border:0;border-radius:99px;cursor:pointer;text-decoration:none;
    font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:#fff;
    background:var(--violet-2,#7C63B0);box-shadow:0 8px 20px rgba(124,99,176,.3)}
  .qn-ask:hover{filter:brightness(1.07)}

  .bd-loading{display:flex;flex-direction:column;gap:9px;padding:14px 4px}
  .bd-empty{padding:26px 0;text-align:center;font-size:13px;color:var(--text-3)}
  .hub-skel{display:block;height:13px;border-radius:5px;
    background:linear-gradient(90deg,var(--paper-2) 25%,var(--line-2) 37%,var(--paper-2) 63%);
    background-size:400% 100%;animation:qnsk 1.3s ease infinite}
  .hub-skel.w5{width:58%}.hub-skel.w7{width:82%}

  @media (max-width:760px){
    .qn-bestwrap{padding:24px 18px 26px}
    .qn-bestttl{font-size:22px}
    .qn-qtitle{font-size:15.5px}
    .qn-who{display:none}
  }
</style>
</head>

<script>
  document.addEventListener('DOMContentLoaded', function(){

    /* 갈래 — 주소의 ?track 으로 정한다 (기본은 음악지식) */
    var TRACK = new URLSearchParams(location.search).get('track') === '전공별' ? '전공별' : '음악지식';

    var CATS = {
      '음악지식': ['음악학교','해외유학','현대음악','콩쿨','연주/공연/음반',
                  '입시/진로관련','연주자/연주단체/작곡과','서양음악사','공연홀','대관관련'],
      '전공별':   ['기악전공','성악전공','작곡전공','음악사/이론전공','교회음악전공','기타전공']
    };
    var LEAD = {
      '음악지식': '음악학교 · 유학 · 콩쿨 · 공연에 대해 묻고 답하는 공간입니다.',
      '전공별':   '전공별로 필요한 정보를 회원들과 나누는 공간입니다.'
    };

    /* 화면 문구와 탭 표시 */
    document.getElementById('qnSub').textContent =
      TRACK === '전공별' ? '[ 전공별 정보나눔 ]' : '[ 음악지식 Q&A ]';
    document.getElementById('qnLead').textContent = LEAD[TRACK];
    document.getElementById(TRACK === '전공별' ? 'tkB' : 'tkA').classList.add('on');
    document.getElementById('qnAsk').href = '/community/qna-write.html?track=' + encodeURIComponent(TRACK);

    /* 상단 — 오늘 현황 · Best Q&A (분류는 아래 툴바의 드롭다운이 담당) */
    OCHub.qnaTop({
      track: TRACK,
      today: '#qnToday', best: '#qnBest',
      order: CATS[TRACK],
      catCount: '.board-catsel',
      viewPage: 'qna-view.html'
    });

    /* 목록 — 공용 게시판 엔진 */
    OCBoard.list({
      table:'qna', pageSize:20,
      viewPage:'qna-view.html', writePage:'qna-write.html?track=' + encodeURIComponent(TRACK),
      where:'&track=eq.' + encodeURIComponent(TRACK),
      searchCols:['title','body','keywords'],
      categories:[{value:'',label:'전체'}].concat(CATS[TRACK].map(function(c){ return {value:c,label:c}; })),
      articleStyle:true, writeRole:'member', pinnedFirst:true, defaultSort:'created_at',
      reactions:true
    });
  });
</script>

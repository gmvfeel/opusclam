name: 공연정보 수집 (KOPIS · 클래식)

# ── 무엇을 하나 ──
#  공연예술통합전산망(KOPIS)에서 서양음악(클래식) 공연을 받아
#  정보SPOT 「공연정보」 갈래에 담습니다.
#
# ── 예전에 걷어낸 까닭과 이번에 다른 점 ──
#  예전에는 「공연시설 API」 로 공연장DB 를 채우려다
#  카페·회의실 같은 쓰레기 자료가 잔뜩 들어와 그만두었습니다.
#  이번에는 「공연목록 API」 를 쓰고 갈래를 클래식으로 못박습니다.
#  또 공연마다 상세를 부르지 않아 무료 시간이 터지지 않습니다
#  (공연 1,200건에 API 호출 열두 번쯤).
#
# ── 언제 실행되나 ──
#  1) 수동 — 처음에는 「실제로 담기: no」 로 무엇이 오는지 먼저 보세요
#  2) 자동 — 매주 월요일 오전 7시(KST). 공연 일정은 자주 바뀝니다
on:
  workflow_dispatch:
    inputs:
      months:
        description: '앞으로 몇 달까지 받을지'
        required: true
        default: '3'
      past:
        description: '지난 몇 달도 함께 받을지 (0 이면 앞날만)'
        required: true
        default: '0'
      save:
        description: '실제로 담기 (처음에는 no 로 확인하세요)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      genre:
        description: '갈래 (비우면 클래식만 · CCCC 는 국악)'
        required: false
        default: ''
  schedule:
    # 매주 월요일 오전 7시(KST) = 일요일 22:00 UTC
    - cron: '0 22 * * 0'

concurrency:
  group: collect-kopis
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 공연정보 수집 실행
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          M="${{ github.event.inputs.months }}"
          P="${{ github.event.inputs.past }}"
          SAVE="${{ github.event.inputs.save }}"
          G="${{ github.event.inputs.genre }}"

          # 자동 실행이면 입력값이 비어 있습니다 — 그때는 앞으로 석 달을 담습니다
          if [ -z "$M" ]; then M="3"; P="0"; SAVE="yes"; G=""; fi

          OPTS="--months=$M --past=$P"
          if [ "$SAVE" != "yes" ]; then OPTS="$OPTS --dry"; fi
          if [ -n "$G" ]; then OPTS="$OPTS --genre=$G"; fi

          echo "── 실행 : node seed/kopis-collect.mjs $OPTS ──"
          node seed/kopis-collect.mjs $OPTS

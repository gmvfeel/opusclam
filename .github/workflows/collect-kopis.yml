name: SPOT · 공연정보 KOPIS (주간)

# ── 무엇을 하나 ──
#  공연예술통합전산망(KOPIS)에서 서양음악(클래식) 공연을 받아
#  정보SPOT 「공연정보」 갈래에 담습니다.
#
# ── 예전에 걷어낸 까닭과 이번에 다른 점 ──
#  예전에는 「공연시설 API」 로 공연장DB 를 채우려다
#  카페·회의실 같은 쓰레기 자료가 잔뜩 들어와 그만두었습니다.
#  이번에는 「공연목록 API」 를 쓰고 갈래를 클래식으로 못박습니다.
#  또 공연마다 상세를 부르지 않아 무료 시간이 터지지 않습니다
#  (공연 1,200건에 API 호출 열두 번쯤).
#
# ── 언제 실행되나 ──
#  1) 수동 — 처음에는 「실제로 담기: no」 로 무엇이 오는지 먼저 보세요
#  2) 자동 — 매주 월요일 오전 7시(KST). 공연 일정은 자주 바뀝니다
on:
  workflow_dispatch:
    inputs:
      months:
        description: '앞으로 몇 달까지 받을지'
        required: true
        default: '3'
      past:
        description: '지난 몇 달도 함께 받을지 (0 이면 앞날만)'
        required: true
        default: '0'
      save:
        description: '실제로 담기 (처음에는 no 로 확인하세요)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      genre:
        description: '구분 (비우면 클래식만 · CCCC 는 국악)'
        required: false
        default: ''
  schedule:
    # 매주 월요일 오전 7시(KST) = 일요일 22:00 UTC
    - cron: '13 22 * * 0'   # KST 매주 월 07:13

# 수동 실행과 예약 실행이 겹치지 않게 합니다.
concurrency:
  group: oc-collect-kopis
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 공연정보 수집 실행
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          M="${{ github.event.inputs.months }}"
          P="${{ github.event.inputs.past }}"
          SAVE="${{ github.event.inputs.save }}"
          G="${{ github.event.inputs.genre }}"

          # 자동 실행이면 입력값이 비어 있습니다 — 그때는 앞으로 석 달을 담습니다
          if [ -z "$M" ]; then M="3"; P="0"; SAVE="yes"; G=""; fi

          OPTS="--months=$M --past=$P"
          if [ "$SAVE" != "yes" ]; then OPTS="$OPTS --dry"; fi
          if [ -n "$G" ]; then OPTS="$OPTS --genre=$G"; fi

          echo "── 실행 : node seed/kopis-collect.mjs $OPTS ──"
          try2 node seed/kopis-collect.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ★ 왜 필요한가 — 예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #    공연장 수집이 며칠 멈춰 있던 것을 아무도 몰랐던 일이 그 예입니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: collect
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

name: 인물DB 한국 작곡가 보강

# ── 무엇을 하나 ──
#  정해진 명단(52명)의 한국 클래식 작곡가를 한국어 위키백과에서 찾아
#  인물DB 에 담습니다.
#
# ── 왜 필요한가 ──
#  인물 9,145명은 대부분 위키데이터에서 왔습니다. 그런데 위키데이터는
#  영문 정보가 넉넉한 사람에 치우쳐 있어, 국내에서만 활동한 작곡가가
#  통째로 빠졌습니다. 서른 명을 짚어 보니 열넷이 없었습니다.
#
#    담김 : 윤이상 · 진은숙 · 강석희 · 백병동  (국제적으로 알려진 분들)
#    빠짐 : 이영조 · 김택수 · 최우정 · 임준희 · 이건용 · 홍난파 …
#
# ── 왜 명단으로 하나 ──
#  처음에는 「대한민국의 작곡가」 분류를 훑었습니다. 그런데 1,146명 가운데
#  대부분이 대중음악 쪽이었습니다(가수·랩퍼·배우·연주단체).
#  걸러내기를 조여도 섞일 위험이 남아, 명단을 정해 그 이름만 찾습니다.
#
#  명단을 늘리시려면 seed/kr-composer.mjs 의 KR_COMPOSERS 에
#  이름을 한 줄 더하시면 됩니다.
#
# ── 언제 실행되나 ──
#  손으로만 돌립니다. 한 번 담으면 크게 늘어나지 않으므로
#  때때로 확인하는 편이 알맞습니다.
#  ★ 처음에는 「실제로 담기: no」 로 누가 들어올지 먼저 보세요.
on:
  workflow_dispatch:
    inputs:
      save:
        description: '실제로 담기 (처음에는 no 로 목록을 확인하세요)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      debug:
        description: '분류를 어떻게 훑었는지 자세히 보기'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

# ★ persons 표를 함께 쓰는 것들을 한 대기줄로 묶습니다.
#   예약 실행이 제각각 늦게 시작해도 순서를 지켜 하나씩 돕니다 —
#   같은 사람 줄을 서로 덮어쓰거나 Wikidata 를 동시에 두드리는 것을 막습니다.
concurrency:
  group: oc-persons
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 한국 작곡가 보강 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          OPTS=""
          if [ "${{ github.event.inputs.save }}" != "yes" ]; then OPTS="$OPTS --dry"; fi
          if [ "${{ github.event.inputs.debug }}" = "yes" ]; then OPTS="$OPTS --debug"; fi

          echo "── 실행 : node seed/kr-composer.mjs $OPTS ──"
          try2 node seed/kr-composer.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ★ 왜 필요한가 — 예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #    공연장 수집이 며칠 멈춰 있던 것을 아무도 몰랐던 일이 그 예입니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

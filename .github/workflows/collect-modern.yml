name: 현대음악 · 수집 (주간)

# ── 예약을 멈췄습니다 · 2026-07-29 ──
#  현대음악DB(modern_composers)를 인물DB 로 통합했습니다.
#    450건 중 200건이 인물DB 와 겹쳐 있었고, 관계는 0건이었습니다.
#    같은 사람이 두 표에 있으면 사사관계 · 소속을 어디에 붙일지 모호해집니다.
#    사진도 두 번 수집됩니다. 그래서 인물DB 하나로 모았습니다.
#
#  이 수집기를 계속 돌리면 통합한 것을 다시 두 곳으로 갈라 놓습니다.
#  그래서 예약을 뺐습니다. 파일은 남깁니다 — 아래 두 가지를 고치면 다시 쓸 수 있습니다.
#
#  다시 쓰려면 고쳐야 할 것
#    ① 저장 대상을 modern_composers 에서 persons 로 바꿔야 합니다
#    ② 판정에 구멍이 있습니다 (2026-07-29 확인)
#       · 제외 직업 12종에 영화감독이 없어 홍상수가 들어왔습니다
#       · 재즈가 배제 장르에 없어 찰리 파커 · 글렌 밀러 · 셀로니어스 멍크가 들어왔습니다
#       · 뉴에이지 · 뮤지컬 · 탱고도 걸러지지 않았습니다
#       · 판정에 '디스코' 를 넣으면 안 됩니다 — 디스코그래피(음반 목록)에 걸립니다
#
#  당장은 수동 실행만 남겨 둡니다.
on:
  schedule:
    - cron: '47 18 * * 2'   # KST 매주 수 03:47
  workflow_dispatch: {}

# 수동 실행과 예약 실행이 겹치지 않게 합니다.
concurrency:
  group: oc-collect-modern
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run modern composer collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          try2 node scripts/collect-modern.mjs

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ★ 왜 필요한가 — 예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #    공연장 수집이 며칠 멈춰 있던 것을 아무도 몰랐던 일이 그 예입니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: collect
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

name: Enrich persons (daily)

# 매일 05:30 KST — 월요일 수집 작업(03:00~04:00)이 모두 끝난 뒤에 돕니다.
# 같은 시각에 위키데이터를 조회하면 요청이 거절될 수 있어 시간을 벌려두었습니다.
on:
  schedule:
    - cron: '30 20 * * *'   # 매일 05:30 KST
  workflow_dispatch:
    inputs:
      daily_limit:
        description: '이번 실행에서 처리할 인물 수 (기본 1500)'
        required: false
        default: '1500'

# 앞 실행이 아직 돌고 있으면 겹치지 않게 기다립니다
concurrency:
  group: enrich-persons
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run persons enricher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAILY_LIMIT: ${{ github.event.inputs.daily_limit || '1500' }}
        run: node scripts/enrich-persons.mjs

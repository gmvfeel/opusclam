name: 인물 · 보강 (매일)

# 매일 05:30 KST — 월요일 수집 작업(03:00~04:00)이 모두 끝난 뒤에 돕니다.
# 같은 시각에 위키데이터를 조회하면 요청이 거절될 수 있어 시간을 벌려두었습니다.
on:
  schedule:
    - cron: '13 3 * * *'   # KST 매일 12:13
  workflow_dispatch:
    inputs:
      daily_limit:
        description: '이번 실행에서 처리할 인물 수 (기본 1500)'
        required: false
        default: '1500'
      # ★ 2026-08-12 v1.3 · 「소개문이 비어 있는 사람만」 (파트너 요청)
      #
      #  ★ 왜 필요한가 (2026-08-12 실측)
      #    인물 15,233명 가운데 소개문이 아예 없는 사람이 4,653명입니다.
      #    그런데 그 사람들은 이미 「점검했다」 표시(wd_checked_at)가 찍혀
      #    있어서, 예전 규칙으로는 다시 보지 않았습니다.
      #    v1.3 은 차례를 ① 미점검 → ② 소개문 비어 있음 → ③ 오래된 순
      #    으로 바꿨습니다. 그래서 그냥 돌려도 빈 것부터 채워집니다.
      #
      #  ★ 이 칸을 yes 로 두면 ③ 을 건너뜁니다.
      #    빈 화면을 급히 없애고 싶을 때 씁니다. 4,653명을 하루 1500명씩
      #    보면 사흘이면 끝납니다.
      #  ★ 비워 두면(no) 평소대로 — 빈 것을 먼저 채우고, 남는 자리는
      #    이미 있는 소개문을 더 길게 다시 받아 오는 데 씁니다.
      # ★ 2026-08-18 · 「숨은 콩쿠르 인물도 함께」 (파트너 요청)
      #
      #  ★ 왜 필요한가
      #    콩쿠르 입상 기록에서 담은 683명은 hidden 으로 넣었습니다
      #    (이름밖에 없어 공개할 수 없었습니다). 그런데 이 수집기가
      #    「hidden=false」 만 보기 때문에 그들에게는 손도 대지
      #    못했습니다. 채워야 공개할 수 있는데 채워지지 않는 셈입니다.
      #
      #  ★ yes 로 두면 숨은 사람 가운데 source='concours' 인 사람까지
      #    함께 봅니다. 숨은 사람을 전부 열지는 않습니다 — 어드민에서
      #    일부러 숨긴 사람(잘못 담긴 인물)에게 자료를 채우면 안 됩니다.
      with_hidden:
        description: '숨은 콩쿠르 인물도 함께 보기 (사진·생몰년 채우기)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      only_empty:
        description: '소개문이 비어 있는 사람만 보기 (빈 화면 먼저 채우기)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

# 앞 실행이 아직 돌고 있으면 겹치지 않게 기다립니다
# ★ persons 표를 함께 쓰는 것들을 한 대기줄로 묶습니다.
#   예약 실행이 제각각 늦게 시작해도 순서를 지켜 하나씩 돕니다 —
#   같은 사람 줄을 서로 덮어쓰거나 Wikidata 를 동시에 두드리는 것을 막습니다.
concurrency:
  group: oc-persons
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run persons enricher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAILY_LIMIT: ${{ github.event.inputs.daily_limit || '1500' }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          OPTS=""
          if [ "${{ github.event.inputs.only_empty }}" = "yes" ]; then OPTS="--only-empty"; fi
          if [ "${{ github.event.inputs.with_hidden }}" = "yes" ]; then OPTS="$OPTS --with-hidden"; fi
          echo "── 실행 : node scripts/enrich-persons.mjs $OPTS ──"
          try2 node scripts/enrich-persons.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ★ 왜 필요한가 — 예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #    공연장 수집이 며칠 멈춰 있던 것을 아무도 몰랐던 일이 그 예입니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: enrich
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: enrich
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

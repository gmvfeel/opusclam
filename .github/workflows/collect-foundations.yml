name: Collect foundations (monthly)

on:
  schedule:
    - cron: '0 19 1 * *'   # 매월 2일 04:00 KST
  workflow_dispatch:
    inputs:
      dry:
        description: '시험 실행 (저장하지 않고 판정 결과만 확인합니다. 처음엔 켜보세요)'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run foundations collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FOUNDATIONS_DRY: ${{ inputs.dry && '1' || '' }}
        run: node scripts/collect-foundations.mjs

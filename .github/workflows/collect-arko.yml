name: 지원금 갱신 (아르코 공모)

# ── 무엇을 하나 ──
#  한국문화예술위원회(아르코)의 「문예진흥기금 공모 한눈에 보기」 를 읽어
#  정보SPOT 「지원금」 갈래의 공모 일정을 갱신합니다.
#
# ── 왜 필요한가 ──
#  아르코 공모는 해마다 새로 열립니다. 지금 담긴 20건의 마감일은
#  2025년 9~12월이라 이미 지났습니다.
#  2027년 공모는 2026년 9월 무렵 나오는데, 그때 손으로 스무 건을
#  다시 고치지 않으려고 만들었습니다.
#
# ── 새 연도를 어떻게 찾나 ──
#  아르코 페이지의 연도 탭(2026·2025·2024·2023)에서 가장 큰 연도를
#  골라 따라갑니다. 2027년 탭이 생기면 저절로 그쪽을 읽습니다.
#
# ── 언제 실행되나 ──
#  1) 수동 — 처음에는 「실제로 담기: no」 로 무엇이 바뀔지 먼저 보세요
#  2) 자동 — 매주 화요일 오전 8시(KST).
#     공모가 열리는 9~10월에는 일정이 자주 바뀌므로 주 단위가 알맞습니다.
on:
  workflow_dispatch:
    inputs:
      save:
        description: '실제로 담기 (처음에는 no 로 확인하세요)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      year:
        description: '읽을 연도 (비우면 가장 최근)'
        required: false
        default: ''
      url:
        description: '페이지를 직접 지정 (비우면 2026년 페이지에서 시작)'
        required: false
        default: ''
  schedule:
    # 매주 화요일 오전 8시(KST) = 월요일 23:00 UTC
    - cron: '0 23 * * 1'

concurrency:
  group: collect-arko
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 아르코 공모 갱신 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SAVE="${{ github.event.inputs.save }}"
          Y="${{ github.event.inputs.year }}"
          U="${{ github.event.inputs.url }}"

          # 자동 실행이면 입력값이 비어 있습니다 — 그때는 실제로 담습니다
          if [ -z "$SAVE" ]; then SAVE="yes"; fi

          OPTS=""
          if [ "$SAVE" != "yes" ]; then OPTS="$OPTS --dry"; fi
          if [ -n "$Y" ]; then OPTS="$OPTS --year=$Y"; fi
          if [ -n "$U" ]; then OPTS="$OPTS --url=$U"; fi

          echo "── 실행 : node seed/arko-collect.mjs $OPTS ──"
          node seed/arko-collect.mjs $OPTS

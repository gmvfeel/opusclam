name: SPOT · 지원금 아르코 (주간)

# ── 무엇을 하나 ──
#  한국문화예술위원회(아르코)의 「문예진흥기금 공모 한눈에 보기」 를 읽어
#  정보SPOT 「지원금」 갈래의 공모 일정을 갱신합니다.
#
# ── 왜 필요한가 ──
#  아르코 공모는 해마다 새로 열립니다. 지금 담긴 20건의 마감일은
#  2025년 9~12월이라 이미 지났습니다.
#  2027년 공모는 2026년 9월 무렵 나오는데, 그때 손으로 스무 건을
#  다시 고치지 않으려고 만들었습니다.
#
# ── 새 연도를 어떻게 찾나 ──
#  아르코 페이지의 연도 탭(2026·2025·2024·2023)에서 가장 큰 연도를
#  골라 따라갑니다. 2027년 탭이 생기면 저절로 그쪽을 읽습니다.
#
# ── 언제 실행되나 ──
#  1) 수동 — 처음에는 「실제로 담기: no」 로 무엇이 바뀔지 먼저 보세요
#  2) 자동 — 매주 화요일 오전 8시(KST).
#     공모가 열리는 9~10월에는 일정이 자주 바뀌므로 주 단위가 알맞습니다.
on:
  workflow_dispatch:
    inputs:
      save:
        description: '실제로 담기 (처음에는 no 로 확인하세요)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      year:
        description: '읽을 연도 (비우면 가장 최근)'
        required: false
        default: ''
      url:
        description: '페이지를 직접 지정 (비우면 2026년 페이지에서 시작)'
        required: false
        default: ''
      debug:
        description: '무엇을 읽었는지 자세히 보기'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      all:
        description: '문학·시각예술까지 다 담기 (기본은 클래식 관련만)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
  schedule:
    # 매주 화요일 오전 8시(KST) = 월요일 23:00 UTC
    - cron: '23 23 * * 1'   # KST 매주 화 08:23

# 수동 실행과 예약 실행이 겹치지 않게 합니다.
concurrency:
  group: oc-collect-arko
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 아르코 공모 갱신 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          SAVE="${{ github.event.inputs.save }}"
          Y="${{ github.event.inputs.year }}"
          U="${{ github.event.inputs.url }}"

          # 자동 실행이면 입력값이 비어 있습니다 — 그때는 실제로 담습니다
          if [ -z "$SAVE" ]; then SAVE="yes"; fi

          OPTS=""
          if [ "$SAVE" != "yes" ]; then OPTS="$OPTS --dry"; fi
          if [ -n "$Y" ]; then OPTS="$OPTS --year=$Y"; fi
          if [ -n "$U" ]; then OPTS="$OPTS --url=$U"; fi
          if [ "${{ github.event.inputs.debug }}" = "yes" ]; then OPTS="$OPTS --debug"; fi
          if [ "${{ github.event.inputs.all }}" = "yes" ]; then OPTS="$OPTS --all"; fi

          echo "── 실행 : node seed/arko-collect.mjs $OPTS ──"
          try2 node seed/arko-collect.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ★ 왜 필요한가 — 예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #    공연장 수집이 며칠 멈춰 있던 것을 아무도 몰랐던 일이 그 예입니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: collect
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

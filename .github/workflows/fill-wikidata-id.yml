name: 위키데이터 번호 · 채우기 (주1회)

# ★ 무엇을 하는가
#   이름으로 위키데이터를 찾아 wikidata_id 가 빈 줄을 채웁니다.
#   인물·현대음악·단체·공연장·학교·기관재단 여섯 표가 대상입니다.
#
# ★ 왜 이것을 먼저 자동으로 돌리는가
#   wikidata_id 는 <다른 자동화의 전제>입니다.
#     · enrich-persons  — 이 번호가 있는 사람만 보강합니다
#     · photo-wiki      — 이 번호로 사진을 찾습니다
#     · collect-name-ja — 이 번호로 일본어 이름을 받습니다
#   번호가 비어 있으면 그 자동화들이 그 줄을 <아예 건너뜁니다>.
#   즉 이 하나가 막혀 있으면 뒤의 셋이 함께 막힙니다.
#
# ★ 어드민 화면(admin/wikidata-fill.html)은 남겨 둡니다
#   자동은 <뚜렷한 것만> 넣습니다. 같은 이름이 여럿이면 넘깁니다.
#   그 넘긴 것을 사람이 보는 자리가 그 화면입니다.
#   즉 화면이 없어지는 것이 아니라, <자동이 못 가린 것만> 다루게 됩니다.
#
# ★ 왜 자동이 조심스러운가
#   잘못 이은 번호는 그 뒤의 보강·사진·번역을 <모두 엉뚱하게> 만듭니다.
#   그래서 점수 6점 이상이고 1등이 2등보다 3점 이상 높을 때만 넣습니다.
#   안 넣는 것이 잘못 넣는 것보다 낫습니다.
#
# ★ 여러 번 돌아도 안전합니다
#   이미 채워진 줄은 아예 읽지 않고, 넣기 직전에 <다시 한 번> 비어 있는지
#   봅니다. 스크립트가 도는 동안 사람이 화면에서 채웠을 수 있기 때문입니다.

on:
  schedule:
    # 토요일 04:40 KST — 일본어 이름(일 05:20)·사진(화 05:00)과 겹치지 않는 자리.
    # 번호를 먼저 채워 두어야 그 뒤의 수집기들이 그 줄을 볼 수 있습니다.
    - cron: '40 19 * * 5'
  workflow_dispatch:
    inputs:
      tables:
        description: '표 이름을 쉼표로 (persons,orgs,venues,schools,modern_composers,foundations). 비우면 전부.'
        type: string
        default: ''
      limit:
        description: '표마다 몇 줄까지 볼지 (비우면 400)'
        type: string
        default: ''
      dryrun:
        description: '넣지 않고 무엇이 들어갈지만 봅니다'
        type: boolean
        default: false

concurrency:
  # ★ persons 표를 함께 쓰는 것들과 <같은 이름>의 대기줄에 섭니다.
  #   이미 enrich-persons · link-persons · photo-collect · photo-commons ·
  #   audit-classic · collect-awards 가 oc-persons 를 쓰고 있습니다.
  #
  #   처음에는 oc-persons-write 라는 새 이름을 지었는데, 그러면 대기줄이
  #   <갈라져> 같은 줄을 동시에 고칠 수 있습니다. 한쪽이 넣은 값을
  #   다른 쪽이 덮어쓰면 조용히 어긋납니다.
  #   ★ 이름을 지어내지 말고 <이미 쓰는 것>을 확인해 맞췄습니다.
  group: oc-persons
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fill wikidata_id
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OC_TABLES: ${{ inputs.tables }}
          OC_LIMIT: ${{ inputs.limit }}
          OC_DRY: ${{ inputs.dryrun == true && '1' || '' }}
        run: |
          # 위키데이터가 잠시 받지 않는 일이 있어 두 번까지 다시 시도합니다
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          try2 node scripts/fill-wikidata-id.mjs

  oc-notify-failure:
    needs: fill
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: fill
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

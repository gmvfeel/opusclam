name: 사진 · 커먼즈 (주간)

# ── 무엇인가 ──
#  위키미디어 커먼즈 카테고리에서 항목당 여러 장을 모아 entity_photos 에 넣습니다.
#  위키데이터 P18 수집(photo-collect)은 항목당 한 장이라, 공연장 · 학교처럼
#  여러 장이 필요한 곳을 이 스크립트가 채웁니다.
#
# ── 왜 예약이 없나 ──
#  시험 단계입니다. 수동 실행으로 결과를 확인한 뒤 예약을 붙입니다.
#  예약 자리는 화요일 05:00(KST)로 비워 두었습니다.
#  다른 수집기와 겹치지 않는 시간대입니다.
#
# ── 왜 photo-collect 와 같은 concurrency 그룹인가 ──
#  두 스크립트가 같은 표(entity_photos)에 씁니다.
#  요일이 달라 예약끼리는 안 겹치지만 수동 실행은 겹칠 수 있습니다.
#  같은 그룹으로 묶어 두면 한쪽이 도는 동안 다른 쪽이 기다립니다.

on:
  # ★ 2026-08-08 · <b>자동으로 돌게 바꿨습니다.</b>
  #
  #   왜
  #     사진 있는 사람 4,464 / 15,239 (29.3%) · 없는 사람 10,775명.
  #     인물이 두 배로 늘면서 비율이 크게 떨어졌습니다.
  #     한 번에 150명씩이라 손으로 누르려면 72번을 눈러야 합니다.
  #     주 한 번씩 저절로 돌면 손 안 대고 조금씩 채워집니다.
  #
  #   「이미지 수집(위키데이터)」와 겹치지 않습니다 —
  #   그쪽은 위키데이터 P18 을 보고, 이쪽은 P18 이 없어도
  #   커먼즈에 파일이 있는 경우를 잡습니다(성공률 3.3%).
  #
  #   ★ 시각을 달리 둘니다.
  #     「이미지 수집」은 월요일 13:17 에 돕니다.
  #     같은 때 돌리면 위키미디어가 속도 제한을 걸 수 있습니다.
  schedule:
    - cron: '43 3 * * 4'   # KST 매주 목 12:43
  workflow_dispatch:
    inputs:
      type:
        description: '수집 대상'
        type: choice
        options:
          - venue
          - school
          - org
        default: venue
      limit:
        description: '처리할 항목 수 (전체를 원하면 9999)'
        required: true
        default: '200'
      max:
        description: '항목당 사진 최대 장수'
        required: true
        default: '6'

# ★ persons 표를 함께 쓰는 것들을 한 대기줄로 묶습니다.
#   예약 실행이 제각각 늦게 시작해도 순서를 지켜 하나씩 돕니다 —
#   같은 사람 줄을 서로 덮어쓰거나 Wikidata 를 동시에 두드리는 것을 막습니다.
concurrency:
  group: oc-persons
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 스크립트의 실행 예산(scripts/lib/http.mjs · 25분)보다 크게 둡니다.
    # 예산이 먼저 걸려야 모은 것을 저장하고 정상 종료할 수 있습니다.
    # 이 값이 더 작으면 강제 취소되어 저장 전에 끊깁니다.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 커먼즈 이미지 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 두 이름을 모두 넘깁니다 — 스크립트가 어느 쪽을 읽어도 작동합니다.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 입력값은 env 로 받아 씁니다.
          #   run: 안에 ${{ inputs.x }} 를 직접 적으면 입력에 셸 명령이 섞여 들어올 수 있습니다.
          #   공개 저장소이므로 습관으로 지킵니다.
          IN_TYPE: ${{ inputs.type }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_MAX: ${{ inputs.max }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }

          # ★★ 2026-08-21 · <b>예약 실행이 2주째 실패하고 있었습니다</b>
          #   workflow_dispatch 의 `default:` 는 <b>손으로 돌릴 때만</b>
          #   쓰입니다. 예약 실행에서는 inputs 가 <b>빈 문자열</b>로 오고,
          #   --type="" 로 넘어가 스크립트가 「venue/school/org 중 하나여야
          #   합니다」 하고 멈췄습니다.
          #   ▶ 비어 있으면 여기서 채웁니다. photo-collect.yml 이 이미
          #     쓰는 방식과 같습니다 — 새 방식을 만들지 않습니다.
          TYPE="${IN_TYPE:-venue}"
          LIMIT="${IN_LIMIT:-200}"
          MAX="${IN_MAX:-6}"

          echo "── 커먼즈 수집 · 대상 $TYPE · 항목 $LIMIT 건 · 장당 최대 $MAX 장 ──"
          try2 node seed/photo-commons.mjs \
            --type="$TYPE" \
            --limit="$LIMIT" \
            --max="$MAX"

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ★ 왜 필요한가 — 예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #    공연장 수집이 며칠 멈춰 있던 것을 아무도 몰랐던 일이 그 예입니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: collect
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

name: 운영 · DB 백업 (매일)

# ── 무엇을 하나 ──────────────────────────────────────────────
#  Supabase 자료를 매일 떠서 <b>암호를 걸어</b> 보관합니다.
#
#  ★ 왜 필요한가
#    무료 플랜에는 백업이 없습니다. 지금은 자료가 사라지면
#    되돌릴 방법이 아예 없습니다. 인물·학교·공연장은 수집기가 다시
#    받아 오지만, <b>회원 · 채용 · 지원 · 차단 목록 · 커뮤니티 글</b>은
#    되돌릴 수 없습니다.
#
#  ★ 왜 암호를 거는가
#    이 저장소는 공개입니다. Actions 가 남기는 파일은 저장소를 볼 수
#    있는 사람이면 내려받을 수 있습니다. 암호 없이 두면 회원 이메일·
#    전화번호·비밀번호 해시가 그대로 공개됩니다.
#    그래서 암호가 없으면 스크립트가 아예 멈춥니다.
#
#  ★ 미리 넣어 두셔야 하는 것 (Settings → Secrets → Actions)
#    SUPABASE_DB_URL     Supabase → Connect → <b>Session pooler</b> 주소
#                        (Direct connection 은 IPv6 라 여기서 안 됩니다)
#    BACKUP_PASSPHRASE   백업을 열 암호 — <b>따로 적어 두십시오.</b>
#                        잃으면 백업도 못 씁니다.
#
#  ★ 90일치가 남습니다. 더 오래 두시려면 받아서 따로 보관하십시오.

on:
  schedule:
    # 매일 01:37 KST — 다른 워크플로와 겹치지 않는 시각
    - cron: '37 16 * * *'
  workflow_dispatch:

concurrency:
  group: oc-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ★ pg_dump 는 서버보다 <b>같거나 새로운</b> 판이어야 합니다.
      #   Supabase 서버가 17.6 이므로 17 이상이 필요합니다.
      #
      #   실제로 겪은 일 — 예전에는 postgresql-client-17 을 설치하라고만
      #   적어 두었는데 <b>16.14 가 깔렸습니다.</b> 우분투에 이미 있던 16이
      #   쓰인 것입니다. 설치가 실패해도 다음 줄로 넘어가 버려서,
      #   덤프를 뜨는 자리에서야 「판이 안 맞는다」 로 막혔습니다.
      #
      #   그래서 셋을 고쳤습니다.
      #     ① 저장소 열쇠와 목록을 확실히 넣습니다
      #     ② 설치할 때 -qq 를 빼서 <b>무엇이 깔렸는지 로그에 남깁니다</b>
      #     ③ 깔린 뒤 <b>판을 확인해 17보다 낮으면 여기서 멈춥니다</b>
      #        (덤프 자리에서 실패하는 것보다 여기서 알려 주는 편이 낫습니다)
      - name: pg_dump 17 설치
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # ★ 17이 여러 판과 함께 깔리면 기본 pg_dump 가 16을 가리킬 수 있습니다.
          #   17 쪽을 앞세워 확실히 쓰게 합니다.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"

          echo "── 깔린 것 확인 ──"
          which pg_dump psql
          pg_dump --version
          psql --version

          # ★ 여기서 막아 둡니다 — 낮은 판이면 더 가지 않습니다
          MAJ=$(pg_dump --version | grep -oE '[0-9]+' | head -1)
          if [ "${MAJ}" -lt 17 ]; then
            echo "::error::pg_dump 판이 ${MAJ} 입니다. 서버(17)보다 낮아 백업할 수 없습니다."
            exit 1
          fi
          echo "   → pg_dump ${MAJ} · 서버(17)와 맞습니다"

      - name: 백업 뜨기
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 60초 뒤 다시 시도합니다"; sleep 60; done; return 1; }
          try2 bash scripts/db-backup.sh

      # ★ 암호 걸린 파일만 올립니다.
      #   scripts/db-backup.sh 가 암호 걸리지 않은 것은 스스로 지웁니다.
      - name: 보관하기
        uses: actions/upload-artifact@v4
        with:
          name: opusclam-db-backup
          path: backup/*.gpg
          retention-days: 90
          if-no-files-found: error      # 파일이 없으면 실패로 알려 줍니다

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #   ★ 백업은 <b>실패해도 아무 일이 없어 보입니다.</b> 그래서 알림이
  #     다른 워크플로보다 더 중요합니다. 몇 달 뒤에 「백업이 없다」 를
  #     알게 되는 것이 가장 나쁩니다.
  oc-notify-failure:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[백업 실패] $WF"
          B=$(printf 'DB 백업이 실패했습니다. <b>자료를 되돌릴 방법이 없는 상태</b>이니 빨리 확인해 주십시오.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n자주 있는 까닭\n1. SUPABASE_DB_URL 이 Session pooler 주소가 아님 (Direct 는 IPv6 라 안 됩니다)\n2. DB 비밀번호가 바뀌었음\n3. BACKUP_PASSPHRASE 가 비어 있음' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다"
          fi

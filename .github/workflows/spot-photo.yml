name: 정보SPOT 사진·로고 수집 (위키데이터)

# ── 무엇을 하나 ──
#  축제·콩쿠르·기관·공연장의 로고와 사진을 위키데이터·커먼즈에서 찾아 채웁니다.
#  우리 서버에 파일을 두지 않고 커먼즈 주소를 그대로 가리킵니다.
#
# ── 언제 실행되나 ──
#  1) 수동 실행 — 자료를 새로 넣은 뒤에 돌리면 됩니다
#  2) 자동 — 매주 화요일 오전 6시(KST). 새로 들어온 항목의 사진을 채웁니다
#
# ── 드는 비용 ──
#  없습니다. 위키미디어는 열려 있고 값을 받지 않습니다.
#  다만 예의상 요청 사이를 띄우므로 한 건에 1초쯤 걸립니다.
on:
  workflow_dispatch:
    inputs:
      section:
        description: '갈래 (비우면 전체 · 페스티벌 / 콩쿨 / 지원금 / 공연정보 / 관련사이트)'
        required: false
        default: ''
      limit:
        description: '한 번에 처리할 건수'
        required: true
        default: '60'
      save:
        description: '실제로 담기'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      force:
        description: '이미 채워진 것도 다시 찾기'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # 매주 화요일 오전 6시(KST) = 월요일 21:00 UTC
    - cron: '0 21 * * 1'

concurrency:
  group: spot-photo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 사진·로고 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SEC="${{ github.event.inputs.section }}"
          LIM="${{ github.event.inputs.limit }}"
          SAVE="${{ github.event.inputs.save }}"
          FORCE="${{ github.event.inputs.force }}"

          # 자동 실행이면 입력값이 비어 있습니다 — 그때는 전체를 훑고 실제로 담습니다
          if [ -z "$LIM" ]; then LIM="200"; SAVE="yes"; FORCE="false"; fi

          OPTS="--limit=$LIM"
          if [ -n "$SEC" ]; then OPTS="$OPTS --section=$SEC"; fi
          if [ "$SAVE" != "yes" ]; then OPTS="$OPTS --dry"; fi
          if [ "$FORCE" = "true" ]; then OPTS="$OPTS --force"; fi

          echo "── 실행 : node seed/spot-photo.mjs $OPTS ──"
          node seed/spot-photo.mjs $OPTS

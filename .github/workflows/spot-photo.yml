name: 정보SPOT 사진·로고 수집 (위키데이터)

# ── 무엇을 하나 ──
#  축제·콩쿠르·기관·공연장의 로고와 사진을 위키데이터·커먼즈에서 찾아 채웁니다.
#  우리 서버에 파일을 두지 않고 커먼즈 주소를 그대로 가리킵니다.
#
# ── 언제 실행되나 ──
#  1) 수동 실행 — 자료를 새로 넣은 뒤에 돌리면 됩니다
#  2) 자동 — 매주 화요일 오전 6시(KST). 새로 들어온 항목의 사진을 채웁니다
#
# ── 드는 비용 ──
#  없습니다. 위키미디어는 열려 있고 값을 받지 않습니다.
#  다만 예의상 요청 사이를 띄우므로 한 건에 1초쯤 걸립니다.
on:
  workflow_dispatch:
    inputs:
      section:
        description: '갈래 (비우면 전체 · 페스티벌 / 콩쿨 / 지원금 / 공연정보 / 관련사이트)'
        required: false
        default: ''
      limit:
        description: '한 번에 처리할 건수'
        required: true
        default: '60'
      save:
        description: '실제로 담기'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      force:
        description: '이미 채워진 것도 다시 찾기'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # 매주 화요일 오전 6시(KST) = 월요일 21:00 UTC
    - cron: '17 21 * * 1'   # KST 매주 화 06:17

# 수동 실행과 예약 실행이 겹치지 않게 합니다.
concurrency:
  group: oc-spot-photo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 사진·로고 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          SEC="${{ github.event.inputs.section }}"
          LIM="${{ github.event.inputs.limit }}"
          SAVE="${{ github.event.inputs.save }}"
          FORCE="${{ github.event.inputs.force }}"

          # 자동 실행이면 입력값이 비어 있습니다 — 그때는 전체를 훑고 실제로 담습니다
          if [ -z "$LIM" ]; then LIM="200"; SAVE="yes"; FORCE="false"; fi

          OPTS="--limit=$LIM"
          if [ -n "$SEC" ]; then OPTS="$OPTS --section=$SEC"; fi
          if [ "$SAVE" != "yes" ]; then OPTS="$OPTS --dry"; fi
          if [ "$FORCE" = "true" ]; then OPTS="$OPTS --force"; fi

          echo "── 실행 : node seed/spot-photo.mjs $OPTS ──"
          try2 node seed/spot-photo.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ★ 왜 필요한가 — 예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #    공연장 수집이 며칠 멈춰 있던 것을 아무도 몰랐던 일이 그 예입니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

name: Collect academic (weekly)

on:
  schedule:
    # 수 · 목 · 금 04:00 KST · 사흘 연속 예약
    #   자료원(OpenAlex)이 GitHub 공용 IP 를 막는 일이 있어 하루치 예약으로는 놓칩니다.
    #   막힌 날은 몇 초 만에 정상 종료되므로 사흘 예약이 부담되지 않습니다.
    #   이미 받은 논문은 중복으로 걸러지므로 여러 번 돌아도 안전합니다.
    - cron: '0 19 * * 2,3,4'
  workflow_dispatch:
    inputs:
      full:
        description: '전체 구간 수집 (처음 한 번은 켜세요. 이후에는 끈 채로 두면 최근분만 갱신합니다)'
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40        # 무료 실행 시간을 지키기 위한 안전장치
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run academic collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ACADEMIC_FULL: ${{ inputs.full && '1' || '' }}
        run: node scripts/collect-academic.mjs

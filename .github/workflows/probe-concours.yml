name: 콩쿠르 입상자 수집

# ── 무엇을 하나 ──
#  쇼팽 콩쿠르 19회의 위키 문서를 받아, <몇 회를 읽어낼 수 있는지>만 셉니다.
#  ★ 담지 않습니다. Supabase 를 건드리지 않습니다. 세어만 봅니다.
#
#  ★ 왜 「수집기」가 아니라 「시험」인가
#    파트너가 예전에 한 번 시도해 하루를 쓰고 접으셨습니다.
#    그러니 만들기 전에 <될지부터> 봅니다.
#
#  ★ 판단 기준 (파트너와 정한 것)
#    · 15회 넘게 읽히면 → 다른 대회로 넓힙니다
#    · 절반도 안 되면  → 접습니다
#
#  ★ 못 읽은 회가 있으면
#    「원문 볼 회차」에 그 번호를 넣고 다시 돌리십시오.
#    그 회 문서가 어떤 꼴인지 그대로 보여 줍니다.

on:
  workflow_dispatch:
    inputs:
      dump:
        description: '읽어낸 입상자를 눈으로 보기'
        required: true
        default: 'yes'
        type: choice
        options: ['yes', 'no']
      only:
        description: '한 대회만 (비우면 전부 · chopin · tchaikovsky · queen-elisabeth · cliburn · leeds · busoni)'
        required: false
        default: ''
      raw:
        description: '원문 보기 (쇼팽 9 · 대회이름 tchaikovsky · 회차 문서 cliburn16)'
        required: false
        default: ''
      diag:
        description: '못 읽은 회의 원문 문형 보기 (문형을 고칠 때만 yes)'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']
      save:
        description: '실제로 담기 (먼저 sql/concours-01-table.sql 을 돌리십시오)'
        required: true
        default: 'no'
        type: choice
        options: ['no', 'yes']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 콩쿠르 입상자 시험
        run: |
          OPTS=""
          if [ "${{ github.event.inputs.dump }}" = "yes" ]; then OPTS="$OPTS --dump"; fi
          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then OPTS="$OPTS --only=$ONLY"; fi
          RAWNO="${{ github.event.inputs.raw }}"
          if [ -n "$RAWNO" ]; then OPTS="--raw=$RAWNO"; fi
          if [ "${{ github.event.inputs.diag }}" = "yes" ]; then OPTS="$OPTS --diag"; fi
          if [ "${{ github.event.inputs.save }}" = "yes" ]; then OPTS="$OPTS --save"; fi
          echo "── 실행 : node seed/concours-probe.mjs $OPTS ──"
          node seed/concours-probe.mjs $OPTS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

name: 인물 · 수집 (수동)

# ── 무엇을 하나 ──────────────────────────────────────────────
#  위키데이터에서 클래식 음악인을 받아 인물DB 에 담습니다.
#  판정은 scripts/lib/classic.mjs 한 곳에서만 합니다.
#
# ── 예전과 무엇이 다른가 ─────────────────────────────────────
#  예전(admin.html 단추) : FILTER(?sl > 8) — 위키백과 문서 8개 언어 이상
#                          + 클래식 확인은 없음
#  ▶ 넓으면서 동시에 좁았습니다.
#    클래식 확인 없이 직업만 보아 대중음악 쪽이 들어왔고,
#    문서 수 문턱 때문에 유명인만 들어왔습니다.
#
#  이제 : 클래식 장르(P136)를 <b>필수</b>로 두고, 문서 수는 보지 않습니다.
#
#  2026-08-08 실측
#    지금 조건                    27,779명
#    새 잣대(장르 필수·문서 무관)   20,266명
#    그때 우리 인물DB               9,058명
#  ▶ 엄격하게 조여도 두 배 넘게 받을 수 있습니다.
#
# ── ★ 처음에는 「실제로 담기 = no」 로 돌리십시오 ──
#  담지 않고 누가 올지만 보여 줍니다.
#
# ── 걸리는 시간 ──
#  직업 19가지 × 목록·상세 = 30~40분.
#  급하시면 「한 직업만」에 번호를 넣어 나눠 돌리십시오.

on:
  workflow_dispatch:
    inputs:
      save:
        description: '실제로 담기 (처음에는 no 로 누가 올지 보십시오)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      job:
        description: '한 직업만 (비우면 19가지 전부 · 예: Q36834 작곡가)'
        required: false
        default: ''
        type: string
      limit:
        description: '직업당 새로 담을 사람 최대 몇 명까지 (이미 담긴 사람은 세지 않습니다)'
        required: false
        default: '4000'
        type: string
      list:
        description: '받을 사람을 전부 찍기 (로그가 아주 길어집니다)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

concurrency:
  group: oc-persons
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 인물 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          OPTS=""
          if [ "${{ github.event.inputs.save }}" = "yes" ]; then OPTS="$OPTS --save"; fi
          if [ "${{ github.event.inputs.list }}" = "yes" ]; then OPTS="$OPTS --list"; fi

          J="${{ github.event.inputs.job }}"
          if [ -n "$J" ]; then OPTS="$OPTS --job=$J"; fi

          L="${{ github.event.inputs.limit }}"
          case "$L" in ''|*[!0-9]*) L=4000 ;; esac
          OPTS="$OPTS --limit=$L"

          echo "── 실행 : node scripts/collect-persons.mjs $OPTS ──"
          node scripts/collect-persons.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '인물 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다"
          fi

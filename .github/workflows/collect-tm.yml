name: SPOT · 해외 공연정보 Ticketmaster (주간)

# ── 무엇을 하나 ──
#  Ticketmaster Discovery API 에서 <해외 클래식 공연>을 받아
#  정보SPOT 「공연정보」 갈래에 담습니다(region='해외').
#  국내는 KOPIS 워크플로가 따로 담습니다 — 서로 건드리지 않습니다.
#
# ── 먼저 해 두실 것 ──
#  1) sql/spot-tm-id-지금돌리세요.sql 을 Supabase SQL Editor 에서 실행
#     (같은 공연을 두 번 담지 않게 하는 열쇠 칸을 만듭니다)
#  2) developer.ticketmaster.com 에서 Consumer Key 발급
#  3) 저장소 Settings → Secrets and variables → Actions →
#     New repository secret 으로 TM_API_KEY 등록
#
# ── 처음 한 번은 반드시 「담기: no」로 ──
#  무엇이 몇 건 오는지, 갈래가 알맞은지 먼저 보십시오.
#  로그에 <실제로 걸린 갈래>가 많은 순으로 찍힙니다.
#
# ── 왜 주간인가 ──
#  해외 공연은 몇 달 앞서 발표되고 자주 바뀌지 않습니다. 하루 한도가
#  5,000회인데 한 번 돌 때 서른 번쯤 부르므로 주간이면 넉넉합니다.
on:
  workflow_dispatch:
    inputs:
      months:
        description: '앞으로 몇 달까지 받을지'
        required: true
        default: '6'
      countries:
        description: '나라 (비우면 US,FR,DE,GB,CA,NL,ES)'
        required: false
        default: ''
      limit:
        description: '나라마다 최대 몇 건 (최대 1000)'
        required: true
        default: '800'
      merge:
        description: '같은 공연의 회차를 묶기 (no 로 하면 날짜마다 한 줄)'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      strict:
        description: '구분에 클래식 표시가 반드시 있어야 담기 (이름만 적힌 정통 공연도 함께 빠집니다)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      list:
        description: '제목 목록 찍기 (잣대를 고칠 때 — 나라 하나만 넣고 보십시오)'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'drop'
          - 'keep'
      save:
        description: '실제로 담기 (처음에는 no 로 확인하세요)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
  schedule:
    # 매주 화요일 오전 7시 20분(KST) = 월요일 22:20 UTC
    # KOPIS(월 07:13)와 겹치지 않게 하루 뒤로 두었습니다.
    - cron: '20 22 * * 1'

concurrency:
  group: oc-collect-tm
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 해외 공연정보 수집 실행
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          M="${{ github.event.inputs.months }}"
          C="${{ github.event.inputs.countries }}"
          L="${{ github.event.inputs.limit }}"
          SAVE="${{ github.event.inputs.save }}"
          MG="${{ github.event.inputs.merge }}"
          LS="${{ github.event.inputs.list }}"
          ST="${{ github.event.inputs.strict }}"

          # 예약 실행이면 입력값이 비어 있습니다 — 그때는 여섯 달·800건·담기
          if [ -z "$M" ]; then M="6"; L="800"; SAVE="yes"; MG="yes"; LS="none"; ST="no"; fi

          OPTS="--months=$M --limit=$L"
          if [ "$SAVE" = "yes" ]; then OPTS="$OPTS --save"; fi
          if [ "$MG" = "no" ]; then OPTS="$OPTS --merge=no"; fi
          if [ -n "$C" ]; then OPTS="$OPTS --countries=$C"; fi
          # 목록 찍기 — 잣대를 고칠 때만 씁니다(로그가 길어집니다)
          if [ "$LS" = "drop" ] || [ "$LS" = "keep" ]; then OPTS="$OPTS --list=$LS"; fi
          if [ "$ST" = "yes" ]; then OPTS="$OPTS --strict"; fi

          echo "── 실행 : node seed/tm-collect.mjs $OPTS ──"
          try2 node seed/tm-collect.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  예약 실행이 실패해도 눌러 보지 않으면 모릅니다. 실패하면 이슈를
  #  만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: collect
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

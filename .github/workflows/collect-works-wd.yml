name: 작품 · 위키데이터 수집 (주2회)

# ── 무엇을 하나 ──
#  인물DB 의 작곡가마다 위키데이터에서 작품 목록을 받아
#  person_works 표에 담습니다.
#
# ── 왜 위키데이터부터인가 ──
#  인물 9,332명 가운데 9,321명이 위키데이터 번호를 가지고 있습니다(99.9%).
#  그래서 작품을 위키데이터에서 받으면 「이 작품은 누구 것인가」가
#  문자열 짐작 없이 정해집니다. 이름으로 맞추면
#  J.S. Bach 와 Johann Sebastian Bach 가 어긋납니다.
#
#  게다가 위키데이터는 P839(IMSLP 문서 이름)을 줍니다. 그 값이
#  우리 악보 표(score_links.imslp_ref)와 같은 모양입니다.
#
#    Symphony_No.8,_Op.88_(Dvořák,_Antonín)
#
#  그러니 작품 ↔ 악보가 문자열 매칭 없이 그대로 이어집니다.
#
# ── 어떤 작곡가부터 담나 ──
#  악보가 많이 담긴 작곡가부터입니다(persons.score_count 내림차순).
#  그분들은 IMSLP 연결이 바로 확인되고, 널리 연주되는 작곡가이므로
#  작품 정보도 충실합니다. 작곡가 6,860명을 한 번에 돌리지 않습니다.
#
# ── 한 번에 몇 명까지 ──
#  ★ 2026-08-07 작곡가 100명으로 돌렸다가 50분을 넘겨 끊겼습니다.
#    바흐 한 사람만 작품이 1,000개를 넘고, 위키데이터 조회 한 번에
#    20~30초가 걸립니다. 100명이면 묶음이 34개입니다.
#    그래서 제한 시간을 300분으로 늘리고 기본값을 20으로 두었습니다.
#
#    ※ 중간까지 담긴 것은 <b>사라지지 않습니다</b> — 묶음마다 바로
#      담기 때문입니다. 끊겼으면 그대로 다시 돌리시면 이미 담긴 것은
#      건너뜁니다(source_id 로 알아봅니다).
#
# ── 언제 실행되나 ──
#  손으로만 돌립니다. 한 번에 조금씩 늘려 가며 결과를 확인하는 편이
#  알맞습니다.
#  ★ 처음에는 「실제로 담기: no」 로 무엇이 들어올지 먼저 보세요.
#
# ── 중복이 쌓이지 않습니다 ──
#  source_id 에 wd:Q188709 처럼 담고 그 칸이 고유로 묶여 있습니다.
#  여러 번 돌려도 같은 작품이 두 번 들어가지 않습니다.
# ── ★ 2026-08-19 · <b>예약 실행을 걸었습니다</b> (파트너와 재어 보고)
#
#  ★ 무엇이 문제였나
#    작품 16,642건이 <b>165명에게 몰려</b> 있었습니다. 헨델 1,370 ·
#    바흐 884 · 모차르트 852… 작곡가가 8,078명인데 나머지는 대표작이
#    하나도 없었습니다. 인물 화면의 「대표작」 자리가 거의 다 비어
#    있었다는 뜻입니다.
#
#  ★ 왜 멈춰 있었나 — 이 워크플로에 <b>예약이 없어</b> 손으로만
#    돌았습니다. 그리고 악보 수 조건 탓에 5개 넘는 작곡가는 이미
#    다 담겨 「더 담을 사람이 없는」 상태로 보였습니다.
#
#  ★ 재어 보니 스무 명에게서 <b>423건</b>이 나왔습니다(한 사람당 21건).
#    IMSLP 번호도 164개 딸려 와 악보와 이어집니다.
#
#  ★ 악보가 <b>1개 이상</b>인 작곡가만 봅니다(371명).
#    악보가 있다는 것은 그 작품이 <b>실제로 연주된다</b>는 뜻입니다.
#    악보 없는 7,643명까지 넓히면 이름뿐인 항목이 쏟아집니다 —
#    개수보다 충실도가 앞선다는 원칙에 어긋납니다.
#
#  ★ 한 번에 스물씩 주 2회면 <b>371명을 아홉 주에</b> 훑습니다.
#    다 훑고 나면 「조건에 맞는 새 작곡가가 없습니다」가 찍히고
#    아무 일도 하지 않습니다 — 그대로 두어도 해가 없습니다.
on:
  schedule:
    # 화·금 새벽 4시 20분(KST) = 전날 19:20 UTC
    # ★ 다른 인물 수집기와 겹치지 않는 시각으로 골랐습니다.
    #   concurrency 로 대기줄에 묶여 있어 겹쳐도 순서를 지킵니다.
    - cron: '20 19 * * 1,4'
  workflow_dispatch:
    inputs:
      save:
        description: '실제로 담기 (처음에는 no 로 목록을 확인하세요)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      limit:
        description: '작곡가 몇 명까지 (한 번에 20~30 을 권합니다. 100은 50분을 넘겨 끊겼습니다)'
        required: true
        default: '20'
        type: string
      min_scores:
        description: '악보가 몇 개 이상인 작곡가만 (0 이면 악보 없는 분도)'
        required: true
        default: '1'
        type: string
      composer:
        description: '특정 작곡가만 (위키데이터 번호, 예 Q1339). 비우면 자동 선정'
        required: false
        default: ''
        type: string
      debug:
        description: '받은 값을 자세히 보기'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

# ★ persons 표를 함께 쓰는 것들과 한 대기줄로 묶습니다.
#   같은 사람 줄을 서로 덮어쓰거나 위키데이터를 동시에 두드리는 것을 막습니다.
concurrency:
  group: oc-persons
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 작품 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }

          OPTS=""
          # ★★ 2026-08-19 · <b>예약 실행은 실제로 담습니다.</b>
          #   예약에는 입력이 없어 save 가 빈 값이 됩니다. 그대로 두면
          #   --dry 가 붙어 <b>아무것도 담기지 않습니다</b> — 매주 돌면서
          #   목록만 찍고 마는 셈입니다.
          #   손으로 돌릴 때는 no 가 기본이라 그대로 미리보기입니다.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "   (예약 실행 — 실제로 담습니다)"
          elif [ "${{ github.event.inputs.save }}" != "yes" ]; then
            OPTS="$OPTS --dry"
          fi
          if [ "${{ github.event.inputs.debug }}" = "yes" ]; then OPTS="$OPTS --debug"; fi

          LIM="${{ github.event.inputs.limit }}"
          # ★ 예약 실행에는 입력이 없으므로 20 으로 둡니다.
          #   재어 보니 스무 명이 20~25분입니다(50분 한도 안).
          case "$LIM" in ''|*[!0-9]*) LIM=20 ;; esac
          OPTS="$OPTS --limit=$LIM"

          MS="${{ github.event.inputs.min_scores }}"
          case "$MS" in ''|*[!0-9]*) MS=1 ;; esac
          OPTS="$OPTS --min-scores=$MS"

          CQ="${{ github.event.inputs.composer }}"
          if [ -n "$CQ" ]; then OPTS="$OPTS --composer=$CQ"; fi

          echo "── 실행 : node seed/works-wikidata.mjs $OPTS ──"
          try2 node seed/works-wikidata.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  예약 실행이 아니어도, 손으로 돌린 것이 실패하면 이슈로 남깁니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '작품 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: collect
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

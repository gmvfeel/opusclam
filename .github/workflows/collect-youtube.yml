name: 음원·동영상 수집 (유튜브)

# ── 어떻게 모으나 ──
#  주력은 「채널 훑기」입니다. 믿을 수 있는 채널(spot_media_channel)이
#  새로 올린 영상을 받아옵니다.
#  첫 시험에서 검색 방식은 26개 중 22개가 쓸 수 없는 것이었습니다
#  (재즈·무용·코믹콘). 쓸 만한 것은 모두 정식 채널이 올린 것이었습니다.
#
# ── 드는 한도 (하루 10,000) ──
#  채널 번호를 아직 모르는 곳   약 101  ← 처음 한 번만
#  번호를 알아낸 뒤              2
#  그래서 첫 실행은 채널을 나눠 도는 것이 안전합니다 (channels 값으로 조절).
#  자리를 잡은 뒤에는 채널 80곳을 다 돌아도 약 160 입니다.
#
# ── 언제 실행되나 ──
#  1) 수동 실행 — Actions 탭에서 「Run workflow」
#  2) 자동 — 매일 오전 7시(KST). 한도가 적게 들어 매일 돌 수 있습니다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '방식'
        required: true
        default: 'channels'
        type: choice
        options:
          - channels   # 채널 훑기 (주력)
          - search     # 검색 (보조 · 옛 명연 찾기)
          - both
      save:
        description: '실제로 담기'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'       # 결과만 봅니다 (첫 시험에 권합니다)
          - 'yes'
      channels:
        description: '이번에 훑을 채널 수 (비우면 전체 · 첫 실행은 25 권장)'
        required: false
        default: '25'
      per:
        description: '채널마다 최신 몇 개를 볼지'
        required: false
        default: '15'
      show_rejected:
        description: '버린 것도 이유와 함께 보기'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # 매일 오전 7시(KST) = 밤 22:00 UTC
    - cron: '47 22 * * *'   # KST 매일 07:47

# 수동 실행과 예약 실행이 겹치지 않게 합니다.
concurrency:
  group: oc-collect-youtube
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 음원·동영상 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          MODE="${{ github.event.inputs.mode }}"
          SAVE="${{ github.event.inputs.save }}"
          CHN="${{ github.event.inputs.channels }}"
          PER="${{ github.event.inputs.per }}"
          SHOWREJ="${{ github.event.inputs.show_rejected }}"

          # 자동 실행이면 입력값이 비어 있습니다 — 그때는 채널 전체를 훑고 실제로 담습니다
          if [ -z "$MODE" ]; then MODE="channels"; SAVE="yes"; CHN=""; PER="15"; SHOWREJ="true"; fi

          OPTS="--mode=$MODE"
          if [ "$SAVE" != "yes" ]; then OPTS="$OPTS --dry"; fi
          if [ -n "$CHN" ]; then OPTS="$OPTS --channels=$CHN"; fi
          if [ -n "$PER" ]; then OPTS="$OPTS --per=$PER"; fi
          if [ "$SHOWREJ" != "false" ]; then OPTS="$OPTS --show-rejected"; fi

          echo "── 실행 : node seed/youtube-collect.mjs $OPTS ──"
          try2 node seed/youtube-collect.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ★ 왜 필요한가 — 예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #    공연장 수집이 며칠 멈춰 있던 것을 아무도 몰랐던 일이 그 예입니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

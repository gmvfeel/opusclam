name: 음원·동영상 수집 (유튜브)

# ── 어떻게 모으나 ──
#  주력은 「채널 훑기」입니다. 믿을 수 있는 채널(spot_media_channel)이
#  새로 올린 영상을 받아옵니다.
#  첫 시험에서 검색 방식은 26개 중 22개가 쓸 수 없는 것이었습니다
#  (재즈·무용·코믹콘). 쓸 만한 것은 모두 정식 채널이 올린 것이었습니다.
#
# ── 드는 한도 (하루 10,000) ──
#  채널 번호를 아직 모르는 곳   약 101  ← 처음 한 번만
#  번호를 알아낸 뒤              2
#  그래서 첫 실행은 채널을 나눠 도는 것이 안전합니다 (channels 값으로 조절).
#  자리를 잡은 뒤에는 채널 80곳을 다 돌아도 약 160 입니다.
#
# ── 언제 실행되나 ──
#  1) 수동 실행 — Actions 탭에서 「Run workflow」
#  2) 자동 — 매일 오전 7시(KST). 한도가 적게 들어 매일 돌 수 있습니다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '방식'
        required: true
        default: 'channels'
        type: choice
        options:
          - channels   # 채널 훑기 (주력)
          - search     # 검색 (보조 · 옛 명연 찾기)
          - both
      save:
        description: '실제로 담기'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'       # 결과만 봅니다 (첫 시험에 권합니다)
          - 'yes'
      channels:
        description: '이번에 훑을 채널 수 (비우면 전체 · 첫 실행은 25 권장)'
        required: false
        default: '25'
      per:
        description: '채널마다 최신 몇 개를 볼지'
        required: false
        default: '15'
      show_rejected:
        description: '버린 것도 이유와 함께 보기'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # 매일 오전 7시(KST) = 밤 22:00 UTC
    - cron: '0 22 * * *'

concurrency:
  group: collect-youtube
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 음원·동영상 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          SAVE="${{ github.event.inputs.save }}"
          CHN="${{ github.event.inputs.channels }}"
          PER="${{ github.event.inputs.per }}"
          SHOWREJ="${{ github.event.inputs.show_rejected }}"

          # 자동 실행이면 입력값이 비어 있습니다 — 그때는 채널 전체를 훑고 실제로 담습니다
          if [ -z "$MODE" ]; then MODE="channels"; SAVE="yes"; CHN=""; PER="15"; SHOWREJ="true"; fi

          OPTS="--mode=$MODE"
          if [ "$SAVE" != "yes" ]; then OPTS="$OPTS --dry"; fi
          if [ -n "$CHN" ]; then OPTS="$OPTS --channels=$CHN"; fi
          if [ -n "$PER" ]; then OPTS="$OPTS --per=$PER"; fi
          if [ "$SHOWREJ" != "false" ]; then OPTS="$OPTS --show-rejected"; fi

          echo "── 실행 : node seed/youtube-collect.mjs $OPTS ──"
          node seed/youtube-collect.mjs $OPTS

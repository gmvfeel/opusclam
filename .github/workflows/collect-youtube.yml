name: 음원·동영상 수집 (유튜브)

# ── 언제 실행되나 ──
#  1) 수동 실행 — Actions 탭에서 「Run workflow」. 첫 시험은 「점수만 보기」로 하십시오.
#  2) 주 1회 자동 — 일요일 오전 7시(KST). 다른 수집 작업이 없는 시간입니다.
#
# ── 드는 비용 ──
#  유튜브 무료 한도는 하루 10,000 이며, 검색 조건 하나에 약 101 이 듭니다.
#  조건 일곱 개면 약 707 로 한도의 7% 입니다.
#  한도를 넘으면 과금이 아니라 그날 중단되고 다음날 초기화됩니다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식'
        required: true
        default: 'dry'
        type: choice
        options:
          - dry      # 저장하지 않고 점수만 봅니다 (첫 시험에 권합니다)
          - save     # 실제로 담습니다
      only_id:
        description: '조건 하나만 돌릴 때 그 번호 (비우면 전체)'
        required: false
        default: ''
      show_rejected:
        description: '버린 것도 이유와 함께 보기'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # 매주 일요일 오전 7시(KST) = 토요일 22:00 UTC
    - cron: '0 22 * * 6'

concurrency:
  group: collect-youtube
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 음원·동영상 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          ONLY="${{ github.event.inputs.only_id }}"
          SHOWREJ="${{ github.event.inputs.show_rejected }}"

          OPTS=""
          # 자동 실행(입력값 없음)이면 실제로 담습니다
          if [ "$MODE" = "dry" ]; then OPTS="$OPTS --dry"; fi
          if [ -n "$ONLY" ]; then OPTS="$OPTS --id=$ONLY"; fi
          # 자동 실행일 때도 버린 이유를 남겨 둡니다 — 걸러내기가 잘 듣는지 확인용
          if [ "$SHOWREJ" != "false" ]; then OPTS="$OPTS --show-rejected"; fi

          echo "── 실행 : node seed/youtube-collect.mjs $OPTS ──"
          node seed/youtube-collect.mjs $OPTS

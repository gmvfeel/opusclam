name: Link persons (weekly)

# 매주 월요일 06:30 KST — 단체·학교 수집(월 03:00~04:00)과 인물 보강(05:30) 뒤에 돕니다.
# 새로 수집된 단체·학교와 바로 연결되도록 순서를 맞춘 것입니다.
on:
  schedule:
    - cron: '30 21 * * 0'   # 월요일 06:30 KST
  workflow_dispatch: {}

# 관계를 지우고 다시 넣는 작업이라 동시 실행을 막습니다
concurrency:
  group: link-persons
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run persons linker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/link-persons.mjs

name: 인물 · 한글 이름 (매일)

# ★ 왜 이 워크플로가 필요한가
#   2026-08-03 확인 — 인물 9,348명 가운데 6,346명(68%)이 한글 이름이
#   없습니다. 한글 이름이 없으면 한국 사용자가 검색으로 찾을 수 없습니다.
#
#   이 일을 하는 기능이 admin/kr-collect.html 에 이미 있었지만
#   브라우저 창을 열어 두어야 돌고, 닫으면 끊깁니다. 6,346명을 손으로
#   지키고 앉아 있을 수 없으므로 자동으로 돌게 했습니다.
#
# ★ 시각을 KST 14:07 로 둔 까닭
#   persons 표를 함께 쓰는 것들과 겹치지 않게 벌려 두었습니다 —
#     collect-persons-kr  KST 목·금·토 05:43
#     enrich-persons      KST 매일     12:13
#     photo-collect       KST 매주 월  13:17
#     link-persons        KST 매주 월  15:23
#   그리고 정각을 비껴 두었습니다. 정각에는 전 세계 워크플로가 몰려
#   시작이 늦어지고 위키데이터도 붐빕니다.
#
# ★ 하루 1,500명씩 나눠 도는 까닭
#   6,346명을 한 번에 하면 위키데이터에 127번 물어보고 6,346번 저장해야
#   합니다. 실행 시간이 길어지고 중간에 끊기면 어디까지 했는지 알기
#   어렵습니다. 나눠 돌면 닷새쯤 뒤에 채워지고, 그 뒤에는 새로 들어온
#   인물만 처리하므로 몇 분 안에 끝납니다.

on:
  schedule:
    - cron: '7 5 * * *'      # KST 매일 14:07
  workflow_dispatch:
    inputs:
      daily_limit:
        description: '이번 실행에서 처리할 인물 수 (기본 1500)'
        required: false
        default: '1500'
      dry_run:
        description: '미리보기만 하고 저장하지 않음 (1 을 넣으면 미리보기)'
        required: false
        default: '0'
      wd_mode:
        description: '조회 방식 — auto(기본) · entities · sparql'
        required: false
        default: 'auto'

# ★ persons 표를 쓰는 것들을 한 대기줄로 묶습니다.
#   예약이 제각각 늦게 시작해도 순서를 지켜 하나씩 돕니다 —
#   같은 사람 줄을 서로 덮어쓰거나 위키데이터를 동시에 두드리는 것을 막습니다.
concurrency:
  group: oc-persons
  cancel-in-progress: false

jobs:
  hangulize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 한글 이름 보강
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAILY_LIMIT: ${{ github.event.inputs.daily_limit || '1500' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          WD_MODE: ${{ github.event.inputs.wd_mode || 'auto' }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }
          try2 node scripts/hangulize-persons.mjs

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: hangulize
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: hangulize
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

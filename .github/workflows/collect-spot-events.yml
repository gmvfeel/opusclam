name: SPOT · 콩쿨·페스티벌 채우기 (수동)

# ── 무엇을 하나 ──────────────────────────────────────────────
#  위키데이터에서 음악 콩쿠르와 음악 축제를 받아
#  정보SPOT 「국내/외콩쿨정보」·「페스티벌정보」에 담습니다.
#
# ── ★ 처음에는 「실제로 담기: no」 로 돌리십시오 ──
#  담지 않고 <b>무엇이 몇 개 오는지</b>만 보여 줍니다.
#  로그에서 이것들을 보실 수 있습니다.
#    · 위키데이터에 실제로 몇 개 있는지
#    · 공식 홈페이지가 적힌 것이 몇 개인지  ← 이게 있어야 쓸모가 있습니다
#    · 한국 대회는 몇 개인지
#    · 걸러낸 까닭 · 실제로 걸린 갈래 목록 · 표본 20개
#
#  숫자가 마음에 드시면 그때 「yes」 로 다시 돌리십시오.
#
# ── 왜 필요한가 ──────────────────────────────────────────────
#  콩쿨 39건 · 페스티벌 15건뿐이었습니다. 전 세계를 담는 자리인데
#  표본에 가깝습니다. 지금까지는 사람이 쓴 소개 29건이 전부였고,
#  재단DB 수집기는 「정확히 music competition 이라 적힌 것」만 보아서
#  「피아노 콩쿠르」처럼 좁은 갈래로 적힌 대회를 놓치고 있었습니다.
#
# ── 되돌리기 ─────────────────────────────────────────────────
#  담은 것에는 keywords 에 'oc-wd' 표시가 남습니다.
#    delete from spot where section in ('콩쿨','페스티벌') and keywords like '%oc-wd%';
#  (17-DO-NOT-RUN-emergency-spot-events-undo.sql 로도 드렸습니다)
#
# ── 언제 실행되나 ──
#  손으로만 돌립니다. 대회 목록은 자주 바뀌지 않습니다.

on:
  workflow_dispatch:
    inputs:
      save:
        description: '실제로 담기 (처음에는 no 로 무엇이 오는지 보십시오)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      kind:
        description: '무엇을 채울까요'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'concours'
          - 'festival'
      limit:
        description: '한 구분에서 최대 몇 개까지 볼까요 (3000 을 권합니다)'
        required: true
        default: '3000'
        type: string
      list:
        description: '받기로 한 것을 전부 찍기 (담기 전에 눈으로 보실 때)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      loose:
        description: '클래식 잣대를 느슨하게 (근거가 없어도 받습니다 — 처음에는 no)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      debug:
        description: '뺀 것을 한 줄씩 자세히 (로그가 길어집니다)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

# ★ spot 표를 쓰는 다른 수집기와 한 대기줄로 묶습니다.
concurrency:
  group: oc-spot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 콩쿨 · 페스티벌 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }

          OPTS=""
          if [ "${{ github.event.inputs.save }}"  = "yes" ]; then OPTS="$OPTS --save"; fi
          if [ "${{ github.event.inputs.list }}"  = "yes" ]; then OPTS="$OPTS --list";  fi
          if [ "${{ github.event.inputs.loose }}" = "yes" ]; then OPTS="$OPTS --loose"; fi
          if [ "${{ github.event.inputs.debug }}" = "yes" ]; then OPTS="$OPTS --debug"; fi

          K="${{ github.event.inputs.kind }}"
          case "$K" in concours|festival|both) ;; *) K=both ;; esac
          OPTS="$OPTS --kind=$K"

          LIM="${{ github.event.inputs.limit }}"
          case "$LIM" in ''|*[!0-9]*) LIM=3000 ;; esac
          OPTS="$OPTS --limit=$LIM"

          echo "── 실행 : node scripts/collect-spot-events.mjs $OPTS ──"
          try2 node scripts/collect-spot-events.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '콩쿨·페스티벌 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

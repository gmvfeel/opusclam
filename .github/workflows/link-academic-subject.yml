name: Link academic subjects (weekly)

on:
  schedule:
    - cron: '30 19 * * 2'   # 수요일 04:30 KST · 학술 수집(04:00) 직후
  workflow_dispatch:
    inputs:
      dry:
        description: '시험 실행 (저장하지 않고 결과만 확인합니다. 처음엔 켜보세요)'
        type: boolean
        default: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Link academic subjects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUBJECT_DRY: ${{ inputs.dry && '1' || '' }}
        run: node scripts/link-academic-subject.mjs

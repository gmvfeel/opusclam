name: 인물 분야 다시 판정

# ── 무엇을 하나 ──────────────────────────────────────────────
#  인물DB의 「분야」가 잘못 정해진 사람을 찾아 고칩니다.
#
# ── 왜 필요한가 ──────────────────────────────────────────────
#  분야를 정하는 규칙이 <b>규칙 순서</b>를 따르고 있었습니다.
#  `composer` 가 맨 앞이라, 직업 목록에 composer 가 하나라도 있으면
#  무조건 「작곡」이 되었습니다.
#
#    마우리치오 폴리니
#      concertmaster, pianist, musician, conductor, composer
#      → 「작곡」  ✗  (피아니스트입니다)
#
#  이용자가 <b>데이터 신고</b>로 알려 주셔서 드러났습니다.
#  위키데이터는 연주자에게도 composer 를 자주 붙이므로
#  같은 오류가 많이 있을 것입니다.
#
#  이제는 <b>직업 목록에 적힌 순서</b>를 따릅니다.
#  위키데이터는 대체로 주업을 앞에 적습니다.
#    폴리니       concertmaster 가 첫 번째 → 연주  ✓
#    라흐마니노프  composer 가 첫 번째      → 작곡  ✓
#
# ── ★ 처음에는 「실제로 고치기 = no」 로 돌리십시오 ──
#  고치지 않고 <b>누가 어떻게 바뀔지</b>만 보여 줍니다.
#  「전부 찍기 = yes」 를 함께 켜면 바뀔 사람을 모두 보실 수 있습니다.
#
# ── 무엇을 건드리지 않나 ─────────────────────────────────────
#  ★ field 칸만 고칩니다 (PATCH 로 그 칸만 보냅니다).
#    이름·설명·사진 등 다른 칸은 건드리지 않습니다.
#  ★ 빈칸은 기본적으로 채우지 않습니다.
#    이미 값이 있는데 <b>틀린 것</b>만 고칩니다.
#    (빈칸 채우기는 인물 보강 수집기가 합니다)

on:
  workflow_dispatch:
    inputs:
      save:
        description: '실제로 고치기 (처음에는 no 로 무엇이 바뀔지 보십시오)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      list:
        description: '바뀔 사람을 전부 찍기 (로그가 아주 길어집니다 — 보통은 no)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      only:
        description: '지금 값이 이것인 사람만 (비우면 전부 · 예: 작곡)'
        required: false
        default: ''
        type: string
      fill:
        description: '분야가 빈칸인 사람도 함께 채우기'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

concurrency:
  group: oc-persons
  cancel-in-progress: false

jobs:
  refield:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 인물 분야 다시 판정
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          OPTS=""
          if [ "${{ github.event.inputs.save }}" = "yes" ]; then OPTS="$OPTS --save"; fi
          if [ "${{ github.event.inputs.list }}" = "yes" ]; then OPTS="$OPTS --list"; fi
          if [ "${{ github.event.inputs.fill }}" = "yes" ]; then OPTS="$OPTS --fill"; fi

          ONLY="${{ github.event.inputs.only }}"
          if [ -n "$ONLY" ]; then OPTS="$OPTS --only=$ONLY"; fi

          echo "── 실행 : node scripts/fix-person-field.mjs $OPTS ──"
          node scripts/fix-person-field.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: refield
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '인물 분야 다시 판정이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다"
          fi

name: auto-seed community

on:
  schedule:
    - cron: '0 0 * * *'    # 매일 09:00 (한국 시간)
    - cron: '0 9 * * *'    # 매일 18:00 (한국 시간)
  workflow_dispatch:        # Actions 탭에서 손으로도 실행 가능

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 자동 시드 실행
        run: node seed/auto-seed.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 두 이름을 모두 넘깁니다 — 스크립트가 어느 쪽을 읽어도 작동합니다.
          #   scripts/ 의 수집기는 SUPABASE_SERVICE_KEY 를,
          #   seed/auto-seed.mjs 는 아직 SUPABASE_SERVICE_ROLE_KEY 를 읽습니다.
          #   seed/ 쪽이 모두 SUPABASE_SERVICE_KEY 로 바뀌면 아래 ROLE 줄을 지우면 됩니다.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

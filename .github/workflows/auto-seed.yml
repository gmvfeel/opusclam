name: auto-seed community

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 09:00 KST (오전)
    - cron: '0 9 * * *'   # 매일 18:00 KST (오후)
  workflow_dispatch:       # 수동 실행(테스트용) 버튼

concurrency:
  group: auto-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: seed
        run: npm install --no-audit --no-fund

      - name: Run auto-seed
        working-directory: seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node auto-seed.mjs

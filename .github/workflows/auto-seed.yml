name: 운영 · 커뮤니티 자동시드 (매일)

on:
  schedule:
    # ★ 2026-08-08 · 하루 두 번 → <b>한 번</b>으로 줄였습니다.
    #   지운 것 : - cron: '43 9 * * *'   # KST 매일 18:43
    #
    #   왜
    #     시드 풀이 거의 바닥났습니다.
    #       풀 150개 · 담긴 것 295건
    #       utility · news · qna 는 이미 소진
    #     하루 두 번 돌면 그만큼 빨리 줄어듭니다.
    #     한 번으로 줄이면 남은 것으로 <b>두 배 오래</b> 갑니다.
    #
    #   ▶ 풀을 더 채우신 뒤에 두 번으로 돌리셔도 됩니다.
    - cron: '23 0 * * *'   # KST 매일 09:23
  workflow_dispatch:        # Actions 탭에서 손으로도 실행 가능
    inputs:
      # ★ 2026-08-12 · 「한꺼번에 채우기」를 더했습니다 (파트너 요청)
      #
      #  ★ 왜 필요한가
      #    손으로 돌려도 글이 늘지 않는 일이 있습니다. 고장이 아니고
      #    일부러 넣어 둔 장치 때문입니다 —
      #      · 「조용한 회차」  평일 18% · 주말 35% 확률로 아무것도 안 올림
      #      · perRun [0, 1]   게시판마다 0건일 수도 있음
      #      · weekly          현대음악·태교음악·유틸리티는 대개 건너뜀
      #    날마다 조금씩 자연스럽게 쌓이게 하려는 것이라 평소에는 이게 맞습니다.
      #    그런데 런칭 전에 화면을 채워 두려면 몇 달을 기다릴 수 없습니다.
      #
      #  ★ 비워 두면 예전과 똑같이 돕니다. 예약(매일 새벽)도 그대로입니다.
      fill:
        description: '한꺼번에 채울 건수 (비우면 평소대로 · 예: 30)'
        required: false
        default: ''
        type: string
      board:
        description: '한 게시판만 (비우면 골고루 · 예: qna · hottopic · news)'
        required: false
        default: ''
        type: string
      # ★ 2026-08-15 · 언어를 골라 채웁니다 (파트너 요청)
      #
      #  ★ 왜 필요한가
      #    평소에는 게시판 설정의 비율대로 섞습니다(한국어 60 · 영어 25 ·
      #    일본어 15). 그런데 새 언어를 처음 넣을 때는 그 언어만 몰아서
      #    담아 화면에서 결을 봐야 합니다.
      #
      #  ★ 비워 두면 예전과 똑같이 비율대로 섞습니다.
      #  ★ 그 언어를 다루지 않는 게시판(입시의 영어 등)은 건너뜁니다.
      lang:
        description: '한 언어만 (비우면 비율대로 섞음)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'ko'
          - 'en'
          - 'ja'
      dry:
        description: '담지 않고 무엇이 올라갈지만 보기'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

# 수동 실행과 예약 실행이 겹치지 않게 합니다.
concurrency:
  group: oc-auto-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 자동 시드 실행
        run: |
          OPTS=""
          FILL="${{ github.event.inputs.fill }}"
          if [ -n "$FILL" ]; then OPTS="$OPTS --fill=$FILL"; fi

          BOARD="${{ github.event.inputs.board }}"
          if [ -n "$BOARD" ]; then OPTS="$OPTS --board=$BOARD"; fi

          LANG_IN="${{ github.event.inputs.lang }}"
          if [ -n "$LANG_IN" ]; then OPTS="$OPTS --lang=$LANG_IN"; fi

          if [ "${{ github.event.inputs.dry }}" = "yes" ]; then OPTS="$OPTS --dry"; fi

          echo "── 실행 : node seed/auto-seed.mjs $OPTS ──"
          node seed/auto-seed.mjs $OPTS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 두 이름을 모두 넘깁니다 — 스크립트가 어느 쪽을 읽어도 작동합니다.
          #   scripts/ 의 수집기는 SUPABASE_SERVICE_KEY 를,
          #   seed/auto-seed.mjs 는 아직 SUPABASE_SERVICE_ROLE_KEY 를 읽습니다.
          #   seed/ 쪽이 모두 SUPABASE_SERVICE_KEY 로 바뀌면 아래 ROLE 줄을 지우면 됩니다.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ★ 왜 필요한가 — 예약 실행이 실패해도 눌러 보지 않으면 모릅니다.
  #    공연장 수집이 며칠 멈춰 있던 것을 아무도 몰랐던 일이 그 예입니다.
  #  실패하면 이슈를 만들고, 같은 이슈가 이미 열려 있으면 댓글만 답니다.
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: seed
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '자동 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

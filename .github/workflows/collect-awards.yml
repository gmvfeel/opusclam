name: 인물 · 수상·수훈 경력 (주간)

# ── 무엇을 하나 ──
#  인물DB 의 위키데이터 번호로 P166(받은 상)을 물어보고,
#  무엇이 오는지 세어서 로그로 보여 줍니다.
#
# ── 무엇이 담기나 ──
#  훈장 · 공로상 · 콩쿠르 · 펠로십 · 명예칭호를 갈래로 나눠 담습니다.
#  갈래는 상 이름이 아니라 위키데이터가 말하는 「상의 종류」(P31)로
#  정합니다. 이름으로 판정했다가 「Stalin Prize」 가 콩쿠르가 되는
#  잘못을 겪었습니다.
#
# ── 처음에는 「실제로 담기: no」 로 ──
#  갈래표에 없는 종류가 로그에 나옵니다. 그것을 알려 주시면
#  SQL 한 줄로 채울 수 있습니다.
#
# ── 선행 조건 ──
#  ★ 13-RUN-NOW-awards-schema.sql 을 먼저 실행하셔야 합니다.
#    칸 · 갈래표 · 담는 함수가 거기서 생깁니다.
#
# ── 언제 실행되나 ──
#  손으로만 돌립니다.
# ── ★ 2026-08-19 · <b>예약을 걸었습니다</b> (파트너와 재어 보고)
#
#  ★ 무엇이 문제였나 — 위키 번호가 있는 인물 가운데 <b>14,395명(90%)</b>
#    이 수상 경력이 하나도 없었습니다. 인물 화면의 「수상」 자리가
#    거의 다 비어 있었다는 뜻입니다.
#    이 워크플로에 <b>예약이 없어</b> 손으로만 돌았기 때문입니다.
#
#  ★ 한 번에 500명씩 주 1회면 여러 달이 걸리지만, 손대지 않아도
#    <b>저절로 쌓입니다.</b> 급하면 손으로 더 돌리면 됩니다.
on:
  schedule:
    - cron: '50 20 * * 5'
  workflow_dispatch:
    inputs:
      save:
        description: '실제로 담기 (처음에는 no 로 무엇이 오는지 보십시오)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      limit:
        description: '인물 몇 명까지 (처음에는 1000 이면 넉넉합니다)'
        required: true
        default: '1000'
        type: string
      redo:
        description: '이미 수상이 담긴 인물도 다시 물어보기'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      kr:
        description: '한국 인물만 보기'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      debug:
        description: '받은 값을 한 줄씩 자세히 (로그가 매우 길어집니다)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

# ★ persons 를 읽는 것들과 한 대기줄로 묶습니다.
concurrency:
  group: oc-persons
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 수상 경력 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          try2() { for i in 1 2; do "$@" && return 0; echo "::warning::${i}번째 시도가 실패했습니다 — 120초 뒤 다시 시도합니다"; sleep 120; done; return 1; }

          OPTS=""
          # ★★ 2026-08-19 · <b>예약 실행은 실제로 담습니다.</b>
          #   이 수집기는 --save 를 줘야 담습니다. 예약에는 입력이
          #   없어 save 가 빈 값이 되므로, 그대로 두면 <b>매주 목록만
          #   찍고</b> 아무것도 담기지 않습니다.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OPTS="$OPTS --save"
            echo "   (예약 실행 — 실제로 담습니다)"
          elif [ "${{ github.event.inputs.save }}" = "yes" ]; then
            OPTS="$OPTS --save"
          fi
          if [ "${{ github.event.inputs.kr }}"    = "yes" ]; then OPTS="$OPTS --kr"; fi
          if [ "${{ github.event.inputs.redo }}"  = "yes" ]; then OPTS="$OPTS --redo"; fi
          if [ "${{ github.event.inputs.debug }}" = "yes" ]; then OPTS="$OPTS --debug"; fi

          LIM="${{ github.event.inputs.limit }}"
          case "$LIM" in ''|*[!0-9]*) LIM=1000 ;; esac
          OPTS="$OPTS --limit=$LIM"

          echo "── 실행 : node seed/awards-wikidata.mjs $OPTS ──"
          try2 node seed/awards-wikidata.mjs $OPTS

  # ── 실패를 알려 줍니다 ──────────────────────────────────────
  #  ※ Settings → Actions → General → Workflow permissions 를
  #    「Read and write permissions」 로 두셔야 이슈를 만들 수 있습니다.
  oc-notify-failure:
    needs: collect
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 실패를 이슈로 남깁니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          B=$(printf '인물 수상 경력 수집이 실패했습니다.\n\n- 워크플로 : %s\n- 실행 기록 : %s\n- 시각(UTC) : %s\n\n로그를 보시고 고친 뒤 이 이슈를 닫아 주십시오.' "$WF" "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$B" || echo "::warning::이슈에 댓글을 달지 못했습니다"
          else
            gh issue create --title "$T" --body "$B" || echo "::warning::이슈를 만들지 못했습니다 (Workflow permissions 를 확인해 주십시오)"
          fi

  # ── 잘 돌면 열려 있던 실패 이슈를 닫습니다 ──────────────────
  #  ★ 2026-08-21 · 파트너 지적으로 만들었습니다.
  #    실패하면 이슈가 생기는데 <b>고쳐도 저절로 닫히지 않았습니다.</b>
  #    그래서 백업은 8/9부터 열흘 넘게 잘 돌고 있었는데도 이슈는
  #    3주째 열린 채였고, 목록만 보면 「지금도 실패 중」으로 보였습니다.
  #  ▶ 이제 성공하면 스스로 닫습니다. 열린 이슈 = <b>진짜 지금 실패 중</b>
  #    이 되어, Issues 탭이 그대로 현황판이 됩니다.
  #  ★ 없으면 아무 일도 하지 않습니다 — 늘 성공하는 워크플로가
  #    쓸데없이 무언가를 만들지 않습니다.
  oc-close-issue:
    needs: collect
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 열려 있던 실패 이슈를 닫습니다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="[자동수집 실패] $WF"
          N=$(gh issue list --state open --search "$T in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$N" ]; then
            echo "열린 실패 이슈가 없습니다 — 할 일 없음"
            exit 0
          fi
          B=$(printf '다시 잘 돌았습니다. 이 이슈를 닫습니다.\n\n- 실행 기록 : %s\n- 시각(UTC) : %s' "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M')")
          gh issue comment "$N" --body "$B" || echo "::warning::댓글을 달지 못했습니다"
          gh issue close "$N" || echo "::warning::이슈를 닫지 못했습니다"
          echo "▶ #$N 을 닫았습니다"

<!DOCTYPE html>

<meta charset="UTF-8">
<!-- ★ 레슨:ON 은 <b>늘 어둡습니다</b> (2026-08-05 · 파트너 지시)
     시안의 성격 자체가 어둡고, 영상을 보는 화면은 어두운 편이 눈이 편합니다.
     그래서 회원이 밝은 모드를 쓰고 있어도 <b>이 섹션만</b> 어둡게 둡니다.
   ★ localStorage 는 <b>건드리지 않습니다</b> — 회원이 고른 모드를 바꿔
     버리면, 레슨:ON 을 한 번 다녀온 뒤 사이트 전체가 어두워집니다.
     여기서는 &lt;html&gt; 에만 붙이고 저장하지 않습니다.
   ★ ln-page 표시도 함께 붙입니다 — 헤더의 모드 전환 단추를 감추는 데
     씁니다(늘 어두우니 바꿀 것이 없습니다). -->
<script>(function(){try{
  document.documentElement.setAttribute('data-theme','dark');
  document.documentElement.classList.add('ln-page');
}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ★ data-header="overlay" — 헤더를 히어로 위에 <b>투명하게</b> 얹습니다.
     스크롤하면 assets/header.js 가 불투명(.solid)으로 바꿉니다. -->
<body data-header="overlay">
<div id="oc-header"></div>
<script src="/assets/include.js"></script>
<script src="/assets/header.js"></script>

<!-- ══════════════════════════════════════════════════════════════
     강의 목록 — 다섯 탭이 <b>이 한 짜임</b>을 함께 씁니다
       마스터클래스 · 공개레슨 · 진행중 레슨 · 분야별 1:1레슨 · 분야별 그룹레슨

     ★ 화면에는 <b>탭 이름만</b> 적습니다. 머리글·걸러내는 조건·카드 모양은
       assets/lesson-list.js 의 TABS 가 정합니다. 다섯 화면에 따로 적으면
       하나를 고칠 때 네 곳을 빠뜨립니다.
     ★ 표가 아니라 <b>뷰</b>(lessons_public)를 읽습니다 — 실시간 링크가
       아예 담기지 않고, 참여인원(applied)은 뷰가 세어 줍니다.
     ══════════════════════════════════════════════════════════════ -->
<div class="ln">

  <section class="ln-hero">
    <div class="ln-wrap ln-hero-in">
      <h1 class="ln-logo">LESSON:ON</h1>
      <p class="ln-hero-en">
        Learn from the most inspiring WORLD BEST artists,<br>
        Unlimited access to instructors MASTER CLASS.<br>
        New classes are added periodically.
      </p>
      <p class="ln-hero-ko">
        가장 많은 영감을 주는 아티스트에게 배우세요. 마스터 클래스 무제한수강, 매달 새로운 수업이 추가됩니다.
      </p>
      <div id="oc-subnav" data-src="/partials/subnav-lesson.html"></div>
    </div>
  </section>

  <div class="ln-wrap">
    <section class="ln-sec">
      <div class="ln-sec-top">
        <div>
          <!-- ★ 머리글 글자는 <b>화면에 적지 않습니다</b> —
               assets/lesson-list.js 의 TABS 한 곳이 정합니다.
               다섯 화면에 따로 적으면 하나를 고칠 때 네 곳을 빠뜨립니다. -->
          <div class="ln-eyebrow" id="lnEyebrow">&nbsp;</div>
          <h2 class="ln-h1" id="lnH1">&nbsp;</h2>
        </div>
        <select class="ln-select" id="lnField" aria-label="활동분야 고르기"></select>
      </div>
      <p class="ln-lead" id="lnLead"></p>

      <div class="ln-grid" id="lnList"><div class="ln-msg">불러오는 중…</div></div>
      <div class="ln-pager" id="lnPager"></div>
    </section>
  </div>

  <div class="ln-cta">
    <span class="ln-cta-in">
      <b>가르치실 분을 모으고 있습니다</b>
      <a href="/lesson/instructor-apply.html">인스트럭터 신청 &#9656;</a>
    </span>
  </div>

</div><!-- /.ln -->

<div id="oc-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/lesson-list.js"></script>
<script>
  /* ★ 화면은 <b>어느 탭인지만</b> 넘깁니다. 무엇을 어떻게 걸러 보여 줄지는
     assets/lesson-list.js 의 TABS 가 정합니다. */
  document.addEventListener('DOMContentLoaded', function () {
    if (window.OCLesson) OCLesson.list({ tab: 'live', pageSize: 20 });
  });
</script>
<script src="/assets/app.js" defer></script>
<!-- 앱 설치 안내 · 서비스워커 등록 (공용) -->

<style>
  /* 칸 폭 — 사전은 「뜻」이 가장 넓어야 합니다 */
  .pdb-table th.c-no{width:3.5%}
  .pdb-table th.c-name{width:18%}
  .pdb-table th.c-sym{width:12%}
  .pdb-table th.c-field{width:7%}
  .pdb-table th.c-sum{width:37%}
  .pdb-table th.c-genre{width:8%}
  .pdb-table th.c-era{width:8%}
  .pdb-table th.c-link{width:6%}

  /* ★ 기호 그림 — 악보에 어떻게 나타나는지 보여 줍니다.
     SVG 안의 색이 currentColor 라서, 글자색을 그대로 따라갑니다.
     그래서 마우스를 올려 줄이 진해지면 기호도 함께 밝아집니다. */
  .tm-sym{display:inline-flex;align-items:center;color:var(--text-2);
    max-width:100%;overflow:hidden}
  .tm-sym svg{max-width:100%;height:26px;width:auto;display:block}
  .pdb-table tbody tr:not(.pdb-norow):hover .tm-sym{color:#fff}

  /* 표제어 — 한국어를 앞세우고 원어는 아래에 작게 */
  .tm-en{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px;
    font-family:var(--display);letter-spacing:.01em}
  /* 설명 — 사전의 알맹이라 표에서 가장 넓게 둡니다.
     한 줄 뜻을 진하게, 본문 첫 문장을 그 아래 흐리게 둡니다. */
  .c-sum{color:var(--text-2);line-height:1.6;word-break:keep-all}
  .tm-sum{display:block;color:var(--text);font-weight:500}
  .tm-more{display:block;margin-top:3px;font-size:.92em;color:var(--text-3);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* ★ 마우스를 올리면 줄 배경이 진해집니다(base.css).
     그때 td 와 a 만 흰색이 되므로, 이 화면에서 새로 만든 글자들도
     함께 밝아지게 합니다. 안 그러면 흐린 글씨가 묻혀 안 보입니다. */
  .pdb-table tbody tr:not(.pdb-norow):hover .tm-sum{color:#fff}
  .pdb-table tbody tr:not(.pdb-norow):hover .tm-more,
  .pdb-table tbody tr:not(.pdb-norow):hover .tm-en{color:rgba(255,255,255,.78)}
  .pdb-table tbody tr:not(.pdb-norow):hover .tm-cat{color:#fff;border-color:rgba(255,255,255,.45)}
  .pdb-table tbody tr:not(.pdb-norow):hover .tm-cat.is-modern{color:#fff;border-color:rgba(255,255,255,.7)}
  .pdb-table tbody tr:not(.pdb-norow):hover .tm-work{color:#fff}
  /* 갈래 표시 — 현대음악은 눈에 띄게 */
  .tm-cat{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
    border:1px solid var(--line-2);color:var(--text-3);white-space:nowrap}
  .tm-cat.is-modern{color:var(--violet-2);border-color:var(--violet-2)}
  /* 작품DB 로 가는 고리 */
  .tm-work{font-size:11.5px;color:var(--violet-2);text-decoration:none;white-space:nowrap}
  .tm-work:hover{text-decoration:underline}

  @media(max-width:1080px){
    .pdb-table th.c-genre,.pdb-table td.c-genre{display:none}
  }
  /* 아주 좁으면 기호 칸도 접습니다 — 상세 화면에서 크게 볼 수 있습니다 */
  @media(max-width:700px){
    .pdb-table th.c-sym,.pdb-table td.c-sym{display:none}
  }
  @media(max-width:820px){
    .pdb-table th.c-era,.pdb-table td.c-era{display:none}
    .pdb-table th.c-no,.pdb-table td.c-no{display:none}
  }
  /* ★ 2026-08-13 · 휴대폰에서는 <b>용어와 설명</b>만 남깁니다 (390px 실기)
       390px 에서 네 칸(용어·구분·설명·작품)이 남아 좁은 칸이 7%·6% 로
       <b>40px</b> 밖에 되지 않았습니다. 그래서 머리글이
       「구 / 분」·「작 / 품」 처럼 한 글자씩 끊겼습니다.
     ★ 폭을 다시 나눠 줍니다 — 칸을 감추기만 하면 %가 남아
       용어 칸이 좁게 남습니다.
     ★ 구분·작품은 상세 화면에서 볼 수 있습니다. */
  @media(max-width:560px){
    .pdb-table th.c-field,.pdb-table td.c-field{display:none}
    .pdb-table th.c-link,.pdb-table td.c-link{display:none}
    .pdb-table th.c-name{width:34%}
    .pdb-table th.c-sum{width:66%}
    .pdb-table th{white-space:nowrap}
  }
</style>

<script>
/* ============================================================
   음악 용어사전 — 목록

   ★ 공용 엔진(assets/db-list.js)을 그대로 씁니다.
     이 화면이 하는 일은 셋뿐입니다 —
       buildFilters  고르는 상자를 조회 조건으로
       buildOrder    정렬 상자를 차례로
       renderRow     한 줄을 어떻게 그릴지

   ★ 왜 표(table)인가
     사전은 카드보다 표가 낫습니다. 「용어 — 뜻」이 나란히 놓여야
     훑어보기 쉽고, 뜻을 넓게 둘 수 있습니다.
     공용 엔진이 tbody 에 넣어 주므로 엔진을 손댈 일도 없습니다.

   ★ 작품DB 로 가는 고리
     work_form 이 person_works.form_ko 와 글자가 같습니다.
     「교향곡」 줄의 작품 단추를 누르면 그 형식의 작품 목록으로 갑니다.
     work_form 이 없는 항목(현대음악 기법 등)에는 단추를 그리지 않습니다.
   ============================================================ */
(function(){
  var SB  = 'https://ptdxzxkgddvkusamkiol.supabase.co';
  var KEY = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';
  var HDR = { apikey: KEY, Authorization: 'Bearer ' + KEY };

  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function nd(v){
    var t=(v==null?'':String(v)).trim();
    return t ? esc(t) : '<span class="nd">\u2014</span>';
  }

  /* 고르는 상자 → 조회 조건
     ★ 시대는 글자가 제각각입니다 — 「바로크」·「바로크 이후」·「약 1600~1750」.
       그래서 <꼭 같은지>가 아니라 <들어 있는지>로 봅니다(ilike).
       「20세기」는 20세기·21세기 표기를 함께 잡습니다. */
  function buildFilters(sels){
    var f='';
    var cat=(sels[0]&&sels[0].value)||'';
    var gen=(sels[1]&&sels[1].value)||'';
    var era=(sels[2]&&sels[2].value)||'';
    if(cat) f+='&category=eq.'+encodeURIComponent(cat);
    if(gen) f+='&genre=eq.'+encodeURIComponent(gen);
    if(era){
      if(era==='20세기'){
        f+='&or=(era.ilike.*20세기*,era.ilike.*21세기*,era.ilike.*19'
         + '0*,era.ilike.*195*,era.ilike.*196*,era.ilike.*197*,era.ilike.*198*)';
      } else {
        f+='&era=ilike.*'+encodeURIComponent(era)+'*';
      }
    }
    /* 감춘 항목은 목록에 넣지 않습니다 */
    f+='&hidden=is.false';
    return f;
  }

  /* 정렬 상자 → 차례
     기본순은 sort_order 를 따릅니다. 비어 있으면 표제어 가나다순으로
     떨어지도록 뒤에 term_ko 를 붙여 둡니다. */
  function buildOrder(sels){
    var v=(sels[3]&&sels[3].value)||'ord';   /* 시대 상자가 늘어 자리가 밀렸습니다 */
    if(v==='ko')   return 'term_ko.asc';
    if(v==='en')   return 'term_en.asc.nullslast';
    if(v==='view') return 'view_count.desc,term_ko.asc';
    return 'sort_order.asc.nullslast,term_ko.asc';
  }

  /* 본문(HTML)의 첫 문장을 뽑아 옵니다.
     한 줄 뜻이 평균 19자밖에 안 돼 「설명」 칸이 허전했습니다.
     자료를 고치지 않고, 이미 있는 본문에서 한 문장을 더 보여 줍니다.
     ★ 태그를 걷어내고 첫 마침표까지만 씁니다. */
  function firstSentence(html, cap){
    var t = String(html||'').replace(/<[^>]*>/g,' ').replace(/&[a-z]+;/g,' ')
              .replace(/\s+/g,' ').trim();
    if(!t) return '';
    var m = t.match(/^[^.!?]*[.!?]/);
    var one = (m ? m[0] : t).trim();
    if(cap && one.length > cap) one = one.slice(0, cap).replace(/\s+\S*$/,'') + '…';
    return one;
  }

  /* 설명 칸 — 한 줄 뜻 아래에 본문 첫 문장을 덧붙입니다.
     같은 말이 두 번 나오지 않도록, 첫 문장이 한 줄 뜻과 너무 비슷하면
     둘째 문장을 대신 씁니다. */
  function sumCell(o){
    var head = (o.summary||'').trim();
    var more = firstSentence(o.body, 90);
    if(more && head && more.replace(/[.\s]/g,'').indexOf(head.replace(/[.\s]/g,'').slice(0,12)) === 0){
      var t = String(o.body||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
      var rest = t.slice(more.length).trim();
      more = firstSentence(rest, 90);
    }
    if(!head && !more) return '<span class="nd">\u2014</span>';
    return (head ? '<span class="tm-sum">'+esc(head)+'</span>' : '')
         + (more ? '<span class="tm-more">'+esc(more)+'</span>' : '');
  }

  /* 한 줄 그리기 */
  function renderRow(o,no,ctx){
    var en = (o.term_en && String(o.term_en).trim())
      ? '<span class="tm-en">'+esc(o.term_en)+(o.reading?' · '+esc(o.reading):'')+'</span>' : '';

    var cat = o.category
      ? '<span class="tm-cat'+(o.category==='현대음악'?' is-modern':'')+'">'+esc(o.category)+'</span>'
      : '<span class="nd">\u2014</span>';

    /* 기호 그림 — 있는 항목만 그립니다.
       ★ 자료에 든 SVG 를 그대로 넣습니다. 이 자료는 우리가 만든 것이며
         관리자만 고칠 수 있으므로(RLS) 바깥에서 끼어들 수 없습니다. */
    var sym = (o.symbol_svg && String(o.symbol_svg).indexOf('<svg') === 0)
      ? '<span class="tm-sym" title="' + esc(o.symbol_note || '') + '">' + o.symbol_svg + '</span>'
      : '<span class="nd">\u2014</span>';

    /* 작품DB 로 가는 고리 — work_form 이 있을 때만 그립니다 */
    var work = (o.work_form && String(o.work_form).trim())
      ? '<a class="tm-work" href="/db/work.html?q='+encodeURIComponent(o.work_form)+'">작품 보기 \u2192</a>'
      : '<span class="nd">\u2014</span>';

    return '<tr data-id="'+esc(o.id)+'">'
      + '<td class="c-no">'+esc(no)+'</td>'
      + '<td class="c-name"><a href="terms-view.html?id='+encodeURIComponent(o.id)+'&p='+ctx.cur+'">'
      +   esc(o.term_ko||'')+en+'</a></td>'
      + '<td class="c-sym">'+sym+'</td>'
      + '<td class="c-field">'+cat+'</td>'
      + '<td class="c-sum">'+sumCell(o)+'</td>'
      + '<td class="c-genre">'+nd(o.genre)+'</td>'
      + '<td class="c-era">'+nd(o.era)+'</td>'
      + '<td class="c-link">'+work+'</td>'
      + '</tr>';
  }

  /* ── 구분·갈래 상자를 자료에서 채웁니다 ──────────────────
     ★ 왜 코드에 적어 두지 않는가
       배치를 더할 때마다 새 구분과 갈래가 생깁니다. 코드에 적어 두면
       그때마다 이 파일을 고쳐야 하고, 빠뜨리면 고를 수 없게 됩니다.
       화면이 열릴 때 한 번 세어 오면 그럴 일이 없습니다.

     ★ 왜 이어 두는가
       「악기」를 골랐는데 갈래에 「빠르기」가 남아 있으면 아무것도
       안 나옵니다. 구분을 고르면 그 구분에 <실제로 있는> 갈래만 남깁니다.

     ★ 건수도 함께 보여 줍니다 — 「악기 (150)」 처럼.
     ★ 조회에 실패하면 조용히 물러납니다. 상자는 「전체」만 남고
       목록은 그대로 나옵니다. */
  function fillSelects(){
    var cat = document.getElementById('tmCat');
    var gen = document.getElementById('tmGenre');
    if(!cat || !gen) return;

    fetch(SB + '/rest/v1/oc_terms?select=category,genre&hidden=is.false&limit=5000',
          { headers: HDR })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        if(!Array.isArray(rows) || !rows.length) return;

        /* 구분마다 어떤 갈래가 몇 건씩 있는지 셉니다 */
        var byCat = {}, catN = {};
        rows.forEach(function(x){
          var c = (x.category || '').trim(); if(!c) return;
          catN[c] = (catN[c] || 0) + 1;
          var g = (x.genre || '').trim();
          if(!g) return;
          (byCat[c] = byCat[c] || {});
          byCat[c][g] = (byCat[c][g] || 0) + 1;
        });

        /* 구분 — 건수 많은 순 */
        var cats = Object.keys(catN).sort(function(a,b){ return catN[b] - catN[a]; });
        cat.innerHTML = '<option value="">구분 전체</option>'
          + cats.map(function(c){
              return '<option value="' + esc(c) + '">' + esc(c) + ' (' + catN[c] + ')</option>';
            }).join('');

        /* 갈래 — 고른 구분에 맞춰 다시 채웁니다 */
        function drawGenres(){
          var picked = cat.value;
          var tally = {};
          if(picked){
            tally = byCat[picked] || {};
          } else {
            /* 구분을 안 골랐으면 모든 갈래를 합쳐 보여 줍니다 */
            Object.keys(byCat).forEach(function(c){
              Object.keys(byCat[c]).forEach(function(g){
                tally[g] = (tally[g] || 0) + byCat[c][g];
              });
            });
          }
          var keep = gen.value;
          var list = Object.keys(tally).sort(function(a,b){ return tally[b] - tally[a]; });
          /* ★ 이 고르개는 <b>장르</b>입니다 — 위 cat 이 「구분」입니다 */
          gen.innerHTML = '<option value="">장르 전체</option>'
            + list.map(function(g){
                return '<option value="' + esc(g) + '">' + esc(g) + ' (' + tally[g] + ')</option>';
              }).join('');
          /* 고르고 있던 갈래가 새 목록에도 있으면 그대로 둡니다 */
          if(keep && list.indexOf(keep) > -1) gen.value = keep;
        }

        drawGenres();
        cat.addEventListener('change', drawGenres);
      })
      .catch(function(){});
  }

  document.addEventListener('DOMContentLoaded', function(){
    fillSelects();
    OCList.init({
      table:'oc_terms', pageSize:30,
      orderDefault:'sort_order.asc.nullslast,term_ko.asc',
      /* 뜻과 본문까지 뒤져야 「이런 뜻의 말이 뭐였지」로도 찾힙니다 */
      searchCols:['term_ko','term_en','reading','summary','body','work_form'],
      entity:'terms',
      buildFilters:buildFilters, buildOrder:buildOrder, renderRow:renderRow
    });
  });
})();
</script>

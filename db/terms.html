<meta name="description" content="클래식 음악 용어와 현대음악 기법을 한국어로 정리했습니다. 교향곡·소나타·푸가부터 12음 기법·음색선율·스펙트럴 음악까지, 각 항목에서 작품DB로 이어집니다.">

<meta name="theme-color" content="#0a0d24">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>
  /* 칸 폭 — 사전은 「뜻」이 가장 넓어야 합니다 */
  .pdb-table th.c-no{width:4%}
  .pdb-table th.c-name{width:20%}
  .pdb-table th.c-field{width:8%}
  .pdb-table th.c-sum{width:44%}
  .pdb-table th.c-genre{width:9%}
  .pdb-table th.c-era{width:9%}
  .pdb-table th.c-link{width:6%}

  /* 표제어 — 한국어를 앞세우고 원어는 아래에 작게 */
  .tm-en{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px;
    font-family:var(--display);letter-spacing:.01em}
  /* 한 줄 뜻 — 사전의 알맹이라 표에서 가장 넓게 둡니다 */
  .c-sum{color:var(--text-2);line-height:1.6;word-break:keep-all}
  /* 갈래 표시 — 현대음악은 눈에 띄게 */
  .tm-cat{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
    border:1px solid var(--line-2);color:var(--text-3);white-space:nowrap}
  .tm-cat.is-modern{color:var(--violet-2);border-color:var(--violet-2)}
  /* 작품DB 로 가는 고리 */
  .tm-work{font-size:11.5px;color:var(--violet-2);text-decoration:none;white-space:nowrap}
  .tm-work:hover{text-decoration:underline}

  @media(max-width:1080px){
    .pdb-table th.c-genre,.pdb-table td.c-genre{display:none}
  }
  @media(max-width:820px){
    .pdb-table th.c-era,.pdb-table td.c-era{display:none}
    .pdb-table th.c-no,.pdb-table td.c-no{display:none}
  }
</style>
</head>

          <g fill="url(#dg)"></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="pdb-inner">

    <nav class="pdb-crumb" aria-label="위치">
      <a href="/home.html">홈</a><span>/</span><a href="/db/index.html">DATABASE</a><span>/</span><span class="on">음악 용어사전</span>
    </nav>

    <!-- DATABASE 하위 메뉴 — partials/subnav-db.html 한 곳에서 관리합니다 -->
    <div id="oc-subnav" data-src="/partials/subnav-db.html"></div>

    <header class="pdb-head">
      <div class="pdb-titlebar">
        <div>
          <div class="pdb-eyebrow">OPUSCLAM DATABASE</div>
          <h1 class="pdb-title">음악 용어사전</h1>
        </div>
      </div>
      <p class="pdb-lead">클래식 음악의 형식과 현대음악의 기법을 한국어로 정리했습니다. 각 항목에서 그 형식의 작품으로 이어집니다.</p>
    </header>

    <div class="pdb-toolbar">
      <div class="pdb-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="용어·원어·뜻 검색" aria-label="검색">
        <button type="button" class="pdb-searchbtn" aria-label="검색">검색</button>
      </div>
      <div class="pdb-selects">
        <select aria-label="갈래">
          <option value="">갈래 전체</option>

        </select>
        <select aria-label="편성">
          <option value="">편성 전체</option>

          <option value="실내악">실내악</option>
          <option value="건반">건반</option>
          <option value="성악">성악</option>

        <select aria-label="정렬">

    <div class="pdb-meta">

          <span class="fs-label">글자크기</span>
          <button type="button" class="fs-btn" data-fs="down" aria-label="글자 작게">가–</button>
          <button type="button" class="fs-btn" data-fs="reset" aria-label="기본 크기">가</button>
          <button type="button" class="fs-btn" data-fs="up" aria-label="글자 크게">가+</button>
        </div>
      </div>
    </div>

    <div class="pdb-tablewrap">
      <table class="pdb-table">
        <thead>
          <tr>
            <th class="c-no">No</th>
            <th class="c-name">용어</th>
            <th class="c-field">갈래</th>
            <th class="c-sum">뜻</th>
            <th class="c-genre">편성</th>
            <th class="c-era">시대</th>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/db-list.js"></script>
<script>
/* ============================================================
   음악 용어사전 — 목록

   ★ 공용 엔진(assets/db-list.js)을 그대로 씁니다.
     이 화면이 하는 일은 셋뿐입니다 —
       buildFilters  고르는 상자를 조회 조건으로
       buildOrder    정렬 상자를 차례로
       renderRow     한 줄을 어떻게 그릴지

   ★ 왜 표(table)인가
     사전은 카드보다 표가 낫습니다. 「용어 — 뜻」이 나란히 놓여야
     훑어보기 쉽고, 뜻을 넓게 둘 수 있습니다.
     공용 엔진이 tbody 에 넣어 주므로 엔진을 손댈 일도 없습니다.

   ★ 작품DB 로 가는 고리
     work_form 이 person_works.form_ko 와 글자가 같습니다.
     「교향곡」 줄의 작품 단추를 누르면 그 형식의 작품 목록으로 갑니다.
     work_form 이 없는 항목(현대음악 기법 등)에는 단추를 그리지 않습니다.
   ============================================================ */
(function(){
  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function nd(v){
    var t=(v==null?'':String(v)).trim();
    return t ? esc(t) : '<span class="nd">\u2014</span>';
  }

  /* 고르는 상자 → 조회 조건 */
  function buildFilters(sels){
    var f='';
    var cat=(sels[0]&&sels[0].value)||'';
    var gen=(sels[1]&&sels[1].value)||'';
    if(cat) f+='&category=eq.'+encodeURIComponent(cat);
    if(gen) f+='&genre=eq.'+encodeURIComponent(gen);
    /* 감춘 항목은 목록에 넣지 않습니다 */
    f+='&hidden=is.false';
    return f;
  }

  /* 정렬 상자 → 차례
     기본순은 sort_order 를 따릅니다. 비어 있으면 표제어 가나다순으로
     떨어지도록 뒤에 term_ko 를 붙여 둡니다. */
  function buildOrder(sels){
    var v=(sels[2]&&sels[2].value)||'ord';
    if(v==='ko')   return 'term_ko.asc';
    if(v==='en')   return 'term_en.asc.nullslast';
    if(v==='view') return 'view_count.desc,term_ko.asc';
    return 'sort_order.asc.nullslast,term_ko.asc';
  }

  /* 한 줄 그리기 */
  function renderRow(o,no,ctx){
    var en = (o.term_en && String(o.term_en).trim())
      ? '<span class="tm-en">'+esc(o.term_en)+(o.reading?' · '+esc(o.reading):'')+'</span>' : '';

    var cat = o.category
      ? '<span class="tm-cat'+(o.category==='현대음악'?' is-modern':'')+'">'+esc(o.category)+'</span>'
      : '<span class="nd">\u2014</span>';

    /* 작품DB 로 가는 고리 — work_form 이 있을 때만 그립니다 */
    var work = (o.work_form && String(o.work_form).trim())
      ? '<a class="tm-work" href="/db/work.html?q='+encodeURIComponent(o.work_form)+'">작품 보기 \u2192</a>'
      : '<span class="nd">\u2014</span>';

    return '<tr data-id="'+esc(o.id)+'">'
      + '<td class="c-no">'+esc(no)+'</td>'
      + '<td class="c-name"><a href="terms-view.html?id='+encodeURIComponent(o.id)+'&p='+ctx.cur+'">'
      +   esc(o.term_ko||'')+en+'</a></td>'
      + '<td class="c-field">'+cat+'</td>'
      + '<td class="c-sum">'+nd(o.summary)+'</td>'
      + '<td class="c-genre">'+nd(o.genre)+'</td>'
      + '<td class="c-era">'+nd(o.era)+'</td>'
      + '<td class="c-link">'+work+'</td>'
      + '</tr>';
  }

  document.addEventListener('DOMContentLoaded', function(){
    OCList.init({
      table:'oc_terms', pageSize:30,
      orderDefault:'sort_order.asc.nullslast,term_ko.asc',
      /* 뜻과 본문까지 뒤져야 「이런 뜻의 말이 뭐였지」로도 찾힙니다 */
      searchCols:['term_ko','term_en','reading','summary','body','work_form'],
      entity:'terms',
      buildFilters:buildFilters, buildOrder:buildOrder, renderRow:renderRow
    });
  });
})();
</script>
<script src="/assets/app.js" defer></script>
</body>
</html>

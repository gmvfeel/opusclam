<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>(function(){try{if(localStorage.getItem('oc-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음악 용어사전 · OPUSCLAM</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="theme-color" content="#0a0d24">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPUSCLAM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/assets/base.css">
<style>  /* 컬럼 폭(기본) */
  .pdb-table th.c-no{width:3.5%}
  .pdb-table th.c-ava{width:4.5%}
  .pdb-table th.c-name{width:11%}
  .pdb-table th.c-field{width:13%}
  .pdb-table th.c-nation{width:9%}
  .pdb-table th.c-life{width:7.5%}
  .pdb-table th.c-era{width:7%}
  .pdb-table th.c-work{width:15%}
  .pdb-table th.c-org{width:12%}
  .pdb-table th.c-school{width:8.5%}
  .pdb-table th.c-link{width:9%}
  /* ===== 태블릿: No·사진·사조·출신학교 숨김 ===== */
  @media(max-width:840px){
    .pdb-table .c-no,.pdb-table .c-ava,.pdb-table .c-era,.pdb-table .c-school{display:none}
    .pdb-table th.c-no,.pdb-table th.c-ava,.pdb-table th.c-era,.pdb-table th.c-school{width:0}
    .pdb-table th.c-name{width:14%}
    .pdb-table th.c-field{width:16%}
    .pdb-table th.c-nation{width:11%}
    .pdb-table th.c-life{width:9%}
    .pdb-table th.c-work{width:24%}
    .pdb-table th.c-org{width:15%}
    .pdb-table th.c-link{width:11%}
  }
  /* ===== 휴대폰: 핵심(이름·분야·국적·대표작·링크)만 ===== */
  @media(max-width:520px){
    .pdb-table .c-life,.pdb-table .c-org{display:none}
    .pdb-table th.c-life,.pdb-table th.c-org{width:0}
    .pdb-table th.c-name{width:19%}
    .pdb-table th.c-field{width:20%}
    .pdb-table th.c-nation{width:17%}
    .pdb-table th.c-work{width:22%}
    .pdb-table th.c-link{width:22%}
    .pdb-table th,.pdb-table td{padding-left:6px;padding-right:6px}
    .pdb-table .c-field{white-space:normal}
    .pdb-table .nat-code{display:none}
    .pdb-table .c-link .lk{width:22px;height:22px;margin-right:2px}
    .pdb-table .c-link .lk svg{width:12px;height:12px}
  }
  .pdb-table th{text-align:left;font-size:1.15em;letter-spacing:0;text-transform:none;color:var(--text-2);font-weight:700;padding:20px 9px;border-top:3px solid var(--text);border-bottom:2px solid var(--text)}
  .pdb-table td{padding:14px 9px;border-top:1px solid var(--line);color:var(--text-2);font-size:1em;white-space:nowrap;vertical-align:middle;overflow:hidden}
  .pdb-table tbody tr{transition:background .15s ease}

  .pdb-table .c-no{width:64px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .pdb-table .c-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
  .pdb-table .c-name a{color:var(--text);font-weight:600;font-size:1em;text-decoration:none;letter-spacing:-.01em;transition:color .15s ease}

  .pdb-table .c-field{width:112px}
  .pdb-table .tag{display:inline-block;font-size:.92em;color:var(--text-2);border:1px solid var(--line-2);border-radius:20px;padding:3px 11px;white-space:nowrap}
  .pdb-table .c-birth{width:130px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .pdb-table .c-school{color:var(--text-3)}

  /* 표 하단 구분선 */
  .pdb-divider{border-top:1px solid var(--line-2);margin-top:48px}
  .pdb-pager{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:60px}
  .pdb-pager .pg-nums{display:flex;gap:4px}
  .pdb-pager .pg-nums a{min-width:38px;height:38px;display:grid;place-items:center;border-radius:9px;font-size:13px;color:var(--text-2);text-decoration:none;transition:background .15s ease,color .15s ease}
  .pdb-pager .pg-nums a:hover{background:var(--paper-2);color:var(--text)}
  .pdb-pager .pg-nums a.on{background:var(--text);color:var(--paper);font-weight:700}
  .pdb-pager .pg-nav{font-size:13px;color:var(--text-2);text-decoration:none;padding:8px 10px;transition:color .15s ease}
  .pdb-pager .pg-nav:hover{color:var(--text)}

  /* ================= 인물 상세(뷰) ================= */
  .pv{max-width:940px;margin:0 auto;font-size:var(--pv-fs,14px)}
  .pv-utility{margin:32px 0 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .pv-topline{border-top:3px solid var(--text);margin-top:30px}
  .pv-tools{display:flex;gap:8px;flex-wrap:wrap}
  .pv-tool{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s,background .15s}
  .pv-tool:hover{border-color:var(--text-3);color:var(--text)}
  .pv-tool svg{width:15px;height:15px}
  .pv-tool[aria-pressed="true"]{color:var(--violet-2);border-color:var(--violet-2);background:rgba(124,99,176,.09)}
  .pv-tool[aria-pressed="true"] svg{fill:var(--violet-2);stroke:var(--violet-2)}
  .pv-track .pv-card{flex:0 0 auto;width:280px}
  .pv-hero{display:flex;gap:34px;align-items:flex-start;padding-bottom:34px;border-bottom:1px solid var(--line)}
  .pv-portrait{flex:0 0 auto;width:132px;height:132px;border-radius:18px;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:52px;color:var(--text-3);overflow:hidden}
  .pv-headinfo{flex:1;min-width:0}
  .pv-eyebrow{font-family:var(--serif);letter-spacing:.32em;font-size:11px;color:var(--text-3);text-transform:uppercase}
  .pv-name{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.015em;line-height:1.05;color:var(--text);margin-top:8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .pv-name-sub{font-family:var(--serif);font-size:16px;font-weight:400;color:var(--text-3);letter-spacing:0}
  .pv-tags{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
  .pv-tags .tag{display:inline-block;font-size:12px;color:var(--text-2);border:1px solid var(--line-2);border-radius:20px;padding:3px 12px}
  .pv-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 28px;margin-top:20px}
  .pv-facts>div{display:flex;gap:12px;font-size:13.5px}
  .pv-facts dt{flex:0 0 auto;white-space:nowrap;color:var(--text-3)}
  .pv-facts dd{color:var(--text);margin:0}
  .pv-facts .nat-code{font-size:11px;opacity:.6}
  .pv-actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
  .pv-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 15px;text-decoration:none;transition:border-color .15s,color .15s}
  .pv-link:hover{border-color:var(--violet-2);color:var(--violet-2)}
  .pv-link svg{width:15px;height:15px}
  .pv-lead{margin-top:30px;font-size:1.05em;line-height:1.75;color:var(--text-2)}
  /* 국/영문 병기 */
  .pv-en{color:var(--text-3);font-weight:400}
  .pv-tags .tag-en{color:var(--text-3);font-size:.82em;font-weight:400;margin-left:3px}
  .pv-h-en{font-family:var(--serif);font-size:13px;font-weight:400;color:var(--text-3);letter-spacing:.01em;margin-left:9px}
  .pv-lead-en{display:block;margin-top:11px;font-size:.9em;line-height:1.7;color:var(--text-3)}
  .pv-prose .pv-prose-en{color:var(--text-3);font-size:.95em}
  .pv-worklist em{font-style:normal;color:var(--text-3);font-weight:400;font-size:.82em;margin-left:5px}
  .pv-deflist dd .pv-en{display:block;font-size:.85em;margin-top:2px}
  .pv-schoollink{color:var(--text);text-decoration:none;transition:color .15s}
  .pv-schoolgo{display:inline-flex;align-items:center;gap:3px;margin:0 0 0 8px;font-size:11px;color:var(--violet-2);background:rgba(124,99,176,.1);border:1px solid rgba(124,99,176,.32);border-radius:20px;padding:2px 9px;white-space:nowrap;vertical-align:middle;font-weight:600;transition:background .15s,color .15s,border-color .15s}
  .pv-schoolgo svg{width:11px;height:11px}
  .pv-schoollink:hover{color:var(--violet-2)}
  .pv-schoollink:hover .pv-schoolgo{background:var(--violet-2);color:#fff;border-color:var(--violet-2)}
  .pv-schoollink:hover{color:var(--violet-2);border-color:var(--violet-2)}
  .pv-sec{margin-top:46px}
  .pv-sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .pv-h{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--text);padding-left:12px;border-left:3px solid var(--violet-2);line-height:1.15;margin:0 0 18px}
  .pv-sechead .pv-h{margin:0}
  .pv-auto{font-size:11px;letter-spacing:.05em;color:var(--text-3);border:1px dashed var(--line-2);border-radius:20px;padding:4px 11px;white-space:nowrap}
  .pv-prose p{font-size:1em;line-height:1.85;color:var(--text-2);margin:0 0 14px}
  .pv-prose p:last-child{margin-bottom:0}
  .pv-worklist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
  .pv-worklist li{font-size:1em;color:var(--text);padding:11px 0 11px 20px;border-bottom:1px solid var(--line);position:relative}
  .pv-worklist li::before{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--violet-2)}
  .pv-worklist li span{color:var(--text-3);font-size:.82em;margin-left:6px}
  .pv-metagrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
  .pv-metagrid>div{display:flex;flex-direction:column;gap:5px;padding:16px 18px;background:var(--paper-2);border:1px solid var(--line);border-radius:12px}
  .pv-metagrid dt{font-size:12px;color:var(--text-3)}
  .pv-metagrid dd{margin:0;font-size:1em;color:var(--text)}
  .pv-gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .pv-tile{aspect-ratio:1/1;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--text-3);background:repeating-linear-gradient(45deg,#f5f3fa 0 14px,#efedf7 14px 28px)}
  .pv-tile svg{width:26px;height:26px}
  .pv-media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .pv-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .2s;display:flex;flex-direction:column}
  .pv-card:hover{border-color:var(--violet-2);transform:translateY(-2px);box-shadow:0 14px 30px -16px rgba(30,20,60,.28)}
  .pv-thumb{aspect-ratio:16/10;display:grid;place-items:center;color:var(--violet-2);background:repeating-linear-gradient(45deg,#f5f3fa 0 14px,#efedf7 14px 28px);border-bottom:1px solid var(--line)}
  .pv-thumb svg{width:34px;height:34px}
  .pv-cardbody{padding:13px 15px}
  .pv-ct{display:block;font-size:13.5px;color:var(--text);font-weight:600;line-height:1.4}
  .pv-cs{display:block;font-size:12px;color:var(--text-3);margin-top:3px}
  .pv-linkcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .pv-lc{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--text);transition:border-color .15s}
  .pv-lc:hover{border-color:var(--violet-2)}
  .pv-lcicon{width:34px;height:34px;border-radius:9px;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--violet-2);flex:0 0 auto}
  .pv-lcicon svg{width:16px;height:16px}
  .pv-lc b{font-size:13.5px;font-weight:600}
  .pv-lc span span{display:block;font-size:12px;color:var(--text-3);margin-top:2px;font-weight:400}
  .pv-people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .pv-person{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:border-color .15s,transform .15s}
  .pv-person:hover{border-color:var(--violet-2);transform:translateY(-2px)}
  .pv-person .ava{width:44px;height:44px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--text-3);flex:0 0 auto}
  .pv-person .pn{display:block;font-size:13.5px;color:var(--text);font-weight:600}
  .pv-person .pf{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
  .pv-nav{display:flex;align-items:stretch;gap:12px;margin-top:54px;padding-top:34px;border-top:1px solid var(--line)}
  .pv-prevnext{flex:1;display:flex;flex-direction:column;gap:3px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;text-decoration:none;transition:border-color .15s}
  .pv-prevnext:hover{border-color:var(--violet-2)}
  .pv-prevnext.next{text-align:right}
  .pv-prevnext .dir{font-size:12px;color:var(--text-3)}
  .pv-prevnext .nm{font-size:14px;color:var(--text);font-weight:600}
  .pv-tolist{flex:0 0 auto;display:grid;place-items:center;padding:0 26px;border-radius:12px;background:var(--violet-2);color:#fff;font-weight:700;font-size:13px;text-decoration:none;transition:background .15s}
  .pv-tolist:hover{background:var(--violet)}
  /* 왼쪽 고정 리스트 탭 */
  /* 뷰 하단: DB보강 + 출처 안내 */
  .pv-contrib{margin-top:48px;padding-top:32px;border-top:1px solid var(--line)}
  .pv-enhance{display:flex;width:fit-content;max-width:100%;margin:0 auto;align-items:center;gap:13px;background:var(--orange);color:#fff;text-decoration:none;padding:16px 32px;border-radius:14px;box-shadow:0 10px 26px -8px rgba(236,122,28,.55);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
  .pv-enhance:hover{background:#d86d12;transform:translateY(-2px);box-shadow:0 16px 34px -8px rgba(236,122,28,.65)}
  .pv-enhance svg{width:22px;height:22px;flex:0 0 auto}
  .pv-enhance b{font-size:16px;font-weight:700;display:block;line-height:1.2}
  .pv-enhance small{font-size:12px;opacity:.92;display:block;margin-top:2px;font-weight:400}
  .pv-source{margin-top:20px;background:rgba(124,99,176,.05);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .pv-source-t{margin:0;font-size:12.5px;line-height:1.7;color:var(--text-3);flex:1;min-width:260px}
  .pv-source-t b{color:var(--text-2);font-weight:600}
  .pv-mailbtn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line-2);background:var(--paper);color:var(--text-2);border-radius:9px;padding:10px 17px;font-size:13px;font-weight:600;text-decoration:none;transition:border-color .15s,color .15s}
  .pv-mailbtn:hover{border-color:var(--violet-2);color:var(--violet-2)}
  .pv-mailbtn svg{width:15px;height:15px}
  /* 모바일: 가로형 목록으로 버튼 (세로 탭 숨김 시 노출) */
  .pv-tolist-m{display:none}
  @media(max-width:1040px){
    .pv-tolist-m{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:34px 0 0;padding:15px;border:1px solid var(--line-2);border-radius:12px;color:var(--text-2);text-decoration:none;font-weight:600;font-size:14px;background:var(--paper);transition:border-color .15s,color .15s}
    .pv-tolist-m:active,.pv-tolist-m:hover{border-color:var(--violet-2);color:var(--violet-2)}
  }
  .pv-listtab{position:fixed;left:max(8px, calc(50% - 676px));top:560px;transform:translateY(-50%);z-index:45;display:flex;flex-direction:column;align-items:center;gap:10px;background:#372a5c;color:#fff;text-decoration:none;padding:24px 13px 24px 10px;border-radius:0 13px 13px 0;box-shadow:0 14px 32px -8px rgba(45,33,73,.6);transition:background .15s ease,padding-left .15s ease,opacity .25s ease,visibility .25s ease}
  .pv-listtab:hover{background:#281d45;padding-left:16px}
  .pv-listtab-arrow{font-size:20px;line-height:1;font-weight:400}
  .pv-listtab-text{writing-mode:vertical-rl;text-orientation:mixed;font-size:13px;font-weight:700;letter-spacing:.18em}
  @media(max-width:600px){.pv-listtab{padding:13px 7px 13px 5px}.pv-listtab-text{font-size:11px}}
  /* 좁은 화면: 본문과 겹치면 탭 숨김 (상단 위치표시·서브메뉴로 이동) */
  @media(max-width:1040px){.pv-listtab{display:none}}
  /* 갤러리 라이트박스 */
  .pv-tile{cursor:zoom-in}
  .pv-lightbox{position:fixed;inset:0;z-index:200;background:rgba(14,18,48,.84);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:44px}
  .pv-lightbox.open{display:flex}
  .pv-lb-close{position:absolute;top:20px;right:24px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .15s}
  .pv-lb-close:hover{background:rgba(255,255,255,.2)}
  .pv-lb-content{max-width:min(92vw,1100px);max-height:86vh;display:flex;align-items:center;justify-content:center}
  .pv-lb-content img{max-width:100%;max-height:86vh;border-radius:8px;display:block}
  .pv-lb-ph{width:min(84vw,560px);aspect-ratio:4/3;border-radius:14px;display:grid;place-items:center;gap:14px;color:#cfc9e6;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 16px,rgba(255,255,255,.03) 16px 32px);border:1px solid rgba(255,255,255,.15)}
  .pv-lb-ph svg{width:56px;height:56px}
  .pv-lb-ph span{font-size:13px;letter-spacing:.02em}
  /* 2단 정보 배치 */
  .pv-split{display:grid;grid-template-columns:1.45fr 1fr;gap:40px;margin-top:46px;align-items:start}
  .pv-worklist--single{grid-template-columns:1fr;gap:0}
  .pv-deflist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .pv-deflist>div{display:flex;gap:20px;align-items:baseline;padding:13px 2px;border-bottom:1px solid var(--line);font-size:.95em}
  .pv-deflist dt{color:var(--text-3);flex:0 0 96px}
  .pv-deflist dd{margin:0;color:var(--text);text-align:left;flex:1}
  /* 갤러리 캐러셀 */
  .pv-carousel{position:relative}
  .pv-track{display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none;padding:2px 1px}
  .pv-track::-webkit-scrollbar{display:none}
  .pv-track .pv-tile{flex:0 0 auto;width:190px;height:190px;aspect-ratio:auto}
  .pv-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);color:var(--text-2);display:grid;place-items:center;cursor:pointer;font-size:20px;line-height:1;box-shadow:0 6px 18px -8px rgba(30,20,60,.32);transition:background .15s,color .15s,border-color .15s,opacity .15s}

<script>
/* ============================================================
   음악 용어사전 — 상세

   ★ 2026-08-09 다시 씀
     처음에는 이 화면만 다른 뼈대로 만들었습니다. 배경·서브메뉴·
     페이지 제목이 없어 다른 상세 화면과 딴판이었습니다.
     이제 작품DB·인물DB 상세와 <같은 뼈대>(.pdb / .pv-*)를 씁니다.

   ★ 무엇을 보여 주는가
     표제어 · 원어 · 갈래 표시 · 사실 목록 · 한 줄 뜻 · 본문 ·
     작품DB 로 가는 고리 · 함께 보면 좋은 말

   ★ 함께 보면 좋은 말(related)
     slug 를 쉼표로 적어 두었습니다. 그 slug 들을 한 번에 받아
     표제어를 붙입니다. 아직 없는 slug 는 조용히 건너뜁니다 —
     앞으로 넣을 말을 미리 적어 두어도 화면이 깨지지 않습니다.
   ============================================================ */
(function(){
  var SB  = 'https://ptdxzxkgddvkusamkiol.supabase.co';
  var KEY = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';
  var HDR = { apikey: KEY, Authorization: 'Bearer ' + KEY };

  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function $(id){ return document.getElementById(id); }
  function done(){
    var l = $('pv-loading');
    if(l){ l.classList.add('hide'); setTimeout(function(){ l.remove(); }, 400); }
  }

  var id = new URLSearchParams(location.search).get('id') || '';
  if(!id){ $('tvLead').textContent = '주소에 항목이 없습니다.'; done(); return; }

  fetch(SB + '/rest/v1/oc_terms?select=*&id=eq.' + encodeURIComponent(id) + '&limit=1',
        { headers: HDR })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      var o = Array.isArray(rows) && rows[0];
      if(!o){ $('tvLead').textContent = '찾는 항목이 없습니다.'; done(); return; }
      draw(o);
      return related(o);
    })
    .catch(function(){ $('tvLead').textContent = '불러오지 못했습니다.'; })
    .then(done, done);

  function draw(o){
    var ko = o.term_ko || '';
    document.title = ko + ' · 음악 용어사전 · OPUSCLAM';
    $('tvCrumb').textContent = ko;
    $('tvIni').textContent = ko.charAt(0) || '?';

    /* 표제어와 원어 */
    $('tvName').childNodes[0].nodeValue = ko + ' ';
    var sub = [];
    if(o.term_en) sub.push(o.term_en);
    if(o.reading) sub.push(o.reading);
    $('tvNameSub').textContent = sub.join(' · ');

    /* 갈래 표시 */
    if(o.category){
      $('tvTags').innerHTML = '<span class="tm-cat'
        + (o.category === '현대음악' ? ' is-modern' : '') + '">' + esc(o.category) + '</span>';
    }

    /* 사실 목록 — 값이 있는 것만 놓습니다 */
    var facts = '';
    function fact(k, v){
      if(!v || !String(v).trim()) return;
      facts += '<div><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>';
    }
    fact('갈래', o.category);
    fact('편성', o.genre);
    fact('주로 쓰인 때', o.era);
    fact('작품DB 형식', o.work_form);
    $('tvFacts').innerHTML = facts;

    /* 이어지는 곳 */
    var acts = '';
    if(o.work_form){
      acts += '<a class="pv-link" href="work.html?q=' + encodeURIComponent(o.work_form) + '">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'
            + '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>'
            + '이 형식의 작품 <span class="pv-en">Works</span></a>';
    }
    if(o.category === '현대음악'){
      acts += '<a class="pv-link" href="modern.html">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'
            + '<circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>'
            + '현대음악DB <span class="pv-en">Contemporary</span></a>';
    }
    acts += '<a class="pv-link" href="terms.html">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">'
          + '<path d="M4 6h16M4 12h16M4 18h10"/></svg>'
          + '용어사전 목록 <span class="pv-en">Index</span></a>';
    $('tvActions').innerHTML = acts;

    /* 한 줄 뜻 */
    if(o.summary) $('tvLead').textContent = o.summary;

    /* 본문 */
    if(o.body){
      $('tvProse').innerHTML = o.body;
      $('tvBodySec').hidden = false;
    }
  }

  function related(o){
    var raw = (o.related || '').split(',')
      .map(function(s){ return s.trim(); }).filter(Boolean);
    if(!raw.length) return;

    var q = raw.map(function(s){ return '"' + s.replace(/"/g,'') + '"'; }).join(',');
    return fetch(SB + '/rest/v1/oc_terms?select=id,slug,term_ko,term_en'
                 + '&hidden=is.false&slug=in.(' + encodeURIComponent(q) + ')&limit=20',
                 { headers: HDR })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(list){
        if(!Array.isArray(list) || !list.length) return;
        var by = {};
        list.forEach(function(x){ by[x.slug] = x; });
        var html = '';
        raw.forEach(function(s){
          var x = by[s];
          if(!x) return;              /* 아직 없는 말은 조용히 건너뜁니다 */
          html += '<a class="tm-relitem" href="terms-view.html?id=' + encodeURIComponent(x.id) + '">'
                + esc(x.term_ko)
                + (x.term_en ? '<em>' + esc(x.term_en) + '</em>' : '')
                + '</a>';
        });
        if(!html) return;
        $('tvRelWrap').innerHTML = html;
        $('tvRelSec').hidden = false;
      })
      .catch(function(){});
  }
})();
</script>

name: 커먼즈 이미지 수집 (화 05:00 · 수동)

# ── 무엇인가 ──
#  위키미디어 커먼즈 카테고리에서 항목당 여러 장을 모아 entity_photos 에 넣습니다.
#  위키데이터 P18 수집(photo-collect)은 항목당 한 장이라, 공연장 · 학교처럼
#  여러 장이 필요한 곳을 이 스크립트가 채웁니다.
#
# ── 왜 예약이 없나 ──
#  시험 단계입니다. 수동 실행으로 결과를 확인한 뒤 예약을 붙입니다.
#  예약 자리는 화요일 05:00(KST)로 비워 두었습니다.
#  다른 수집기와 겹치지 않는 시간대입니다.
#
# ── 왜 photo-collect 와 같은 concurrency 그룹인가 ──
#  두 스크립트가 같은 표(entity_photos)에 씁니다.
#  요일이 달라 예약끼리는 안 겹치지만 수동 실행은 겹칠 수 있습니다.
#  같은 그룹으로 묶어 두면 한쪽이 도는 동안 다른 쪽이 기다립니다.

on:
  # 화요일 05:00 (한국 시간) · 월요일 20:00 UTC
  #   새로 들어온 항목을 채우는 용도입니다. 처음 채우기는 수동으로 끝냈습니다.
  #   주간 수집기가 만드는 새 항목은 세 종류를 합쳐 주당 수십 건 수준이므로
  #   종류마다 100건이면 넉넉합니다.
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:
    inputs:
      type:
        description: '수집 대상'
        type: choice
        options:
          - venue
          - school
          - org
        default: venue
      limit:
        description: '처리할 항목 수 (전체를 원하면 9999)'
        required: true
        default: '200'
      max:
        description: '항목당 사진 최대 장수'
        required: true
        default: '6'

concurrency:
  group: photo-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 스크립트의 실행 예산(scripts/lib/http.mjs · 25분)보다 크게 둡니다.
    # 예산이 먼저 걸려야 모은 것을 저장하고 정상 종료할 수 있습니다.
    # 이 값이 더 작으면 강제 취소되어 저장 전에 끊깁니다.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 커먼즈 이미지 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # 두 이름을 모두 넘깁니다 — 스크립트가 어느 쪽을 읽어도 작동합니다.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 입력값은 env 로 받아 씁니다.
          #   run: 안에 ${{ inputs.x }} 를 직접 적으면 입력에 셸 명령이 섞여 들어올 수 있습니다.
          #   공개 저장소이므로 습관으로 지킵니다.
          IN_TYPE: ${{ inputs.type }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_MAX: ${{ inputs.max }}
        run: |
          # 수동 실행이면 IN_TYPE 에 값이 들어옵니다. 예약 실행이면 빈 값입니다.
          #   (workflow_dispatch 의 default 는 수동 실행에만 적용됩니다)
          if [ -n "$IN_TYPE" ]; then
            echo "── 수동 · 대상 $IN_TYPE · 항목 $IN_LIMIT 건 · 장당 최대 $IN_MAX 장 ──"
            node seed/photo-commons.mjs \
              --type="$IN_TYPE" \
              --limit="$IN_LIMIT" \
              --max="$IN_MAX"
          else
            # 예약 실행 · 세 종류를 이어서 돌립니다.
            #   주마다 번갈아 돌리면 새 항목이 최대 3주를 기다립니다.
            #   그동안 화면에 빈 자리로 남으므로 매주 세 종류를 다 훑습니다.
            #   node 를 따로 부르므로 실행 예산(25분)도 종류마다 새로 시작합니다.
            #   100건이면 5분 남짓이라 셋을 합쳐도 20분 안입니다.
            for t in venue school org; do
              echo "── 예약 · 대상 $t · 항목 100건 · 장당 최대 6장 ──"
              node seed/photo-commons.mjs --type="$t" --limit=100 --max=6 \
                || echo "!! $t 처리 중 멈춤 · 다음 종류로 넘어갑니다"
            done
          fi

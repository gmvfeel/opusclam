<style>
  /* ── 시대 띠 ──────────────────────────────────────────────
     일곱 시대를 가로로 늘어놓습니다.
     ★ 너비를 연수에 비례시키지 않았습니다 —
       중세가 400년, 근·현대가 45년이라 그대로 하면
       근·현대가 손톱만해져 누를 수도 없습니다.
       대신 <담긴 인물 수>에 따라 너비를 조금씩 다르게 둡니다. */
  .tl-band{display:flex;gap:3px;margin:0 0 6px;min-height:96px}
  .tl-seg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;
    gap:5px;padding:12px 10px 11px;border:1px solid var(--line);border-radius:10px;
    background:var(--paper);cursor:pointer;text-align:left;font-family:inherit;
    transition:border-color .16s ease,background .16s ease;position:relative;overflow:hidden}
  .tl-seg:hover{border-color:var(--text-3)}
  .tl-seg.on{border-color:var(--violet-2);background:rgba(124,99,176,.07)}
  .tl-seg .yr{font-family:var(--display);font-size:11px;color:var(--text-3);letter-spacing:.01em}
  .tl-seg .nm{font-size:15px;font-weight:700;color:var(--text);line-height:1.25;word-break:keep-all}
  .tl-seg.on .nm{color:var(--violet-2)}
  .tl-seg .cnt{font-size:11.5px;color:var(--text-3)}
  .tl-seg .bar{position:absolute;left:0;right:0;bottom:0;background:var(--violet-2);opacity:.16}

  .tl-axis{display:flex;gap:3px;margin:0 0 34px}
  .tl-axis span{flex:1 1 0;text-align:center;font-size:10.5px;color:var(--text-3);
    font-family:var(--display)}

  /* ── 고른 시대의 내용 ────────────────────────────────── */
  .tl-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:12px;margin:0 0 22px}
  .tl-head h2{font-family:var(--display);font-size:26px;font-weight:800;color:var(--text);margin:0}
  .tl-head .yr{font-size:13px;color:var(--text-3);font-family:var(--display)}
  .tl-head .sum{font-size:13px;color:var(--text-2);flex:1 1 100%;line-height:1.6;
    word-break:keep-all;margin-top:2px}

  .tl-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px}
  .tl-col h3{font-family:var(--display);font-size:14px;color:var(--text);margin:0 0 12px;
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .tl-col h3 a{font-size:11.5px;color:var(--violet-2);text-decoration:none;font-weight:400}
  .tl-col h3 a:hover{text-decoration:underline}

  .tl-item{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;
    border-bottom:1px solid var(--line);text-decoration:none}
  .tl-item:last-child{border-bottom:0}
  .tl-item:hover .t{color:var(--violet-2)}
  .tl-item .av{flex:0 0 34px;width:34px;height:34px;border-radius:50%;overflow:hidden;
    background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;
    font-family:var(--display);font-size:12px;font-weight:700;color:var(--text-3)}
  .tl-item .av img{width:100%;height:100%;object-fit:cover;display:block}
  .tl-item .bd{min-width:0;flex:1}
  .tl-item .t{display:block;font-size:13.5px;font-weight:600;color:var(--text);
    line-height:1.35;word-break:keep-all;transition:color .15s ease}
  .tl-item .s{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px}

  .tl-empty{padding:26px 4px;color:var(--text-3);font-size:13px}
  .tl-sk{height:52px;border-radius:8px;background:var(--paper-2);margin-bottom:8px;
    animation:tlsk 1.2s ease-in-out infinite}
  @keyframes tlsk{0%,100%{opacity:.55}50%{opacity:.9}}

  @media(max-width:900px){
    .tl-cols{grid-template-columns:1fr;gap:30px}
    .tl-band{flex-wrap:wrap;min-height:0}
    .tl-seg{flex:1 1 30%;min-width:110px}
    .tl-axis{display:none}
  }
  @media(max-width:520px){
    .tl-seg{flex:1 1 45%}
    .tl-head h2{font-size:22px}
  }
</style>
</head>

<script>
/* ============================================================
   음악사 연표

   ── 왜 <연도>로 찾고 시대 이름으로 찾지 않는가 ──────────────
     세 표가 시대를 저마다 다르게 적고 있습니다 —
       인물DB   현대 · 근·현대 · 낭만주의 · 고전주의 · 바로크 …
       작품DB   (무엇을 쓰는지 확인되지 않음)
       용어사전 바로크 · 바로크 이후 · 약 1600~1750 · 20세기 후반 …

     이름으로 맞추면 하나만 어긋나도 아무것도 안 나옵니다.
     그래서 <숫자 연도>로 찾습니다 —
       인물   birth_year (65번 SQL 로 life 에서 저절로 뽑힙니다)
       작품   year_from
     이 둘은 숫자라 어긋날 일이 없습니다.

     ★ 용어사전만 숫자 연도가 없어서, 시대마다 <찾을 낱말>을
       여럿 두고 그중 하나라도 걸리면 가져옵니다.

   ── 이상한 값 거르기 ────────────────────────────────────────
     태어난 해가 1000년 이전인 사람이 6명, 죽은 해가 태어난 해보다
     앞선 사람이 9명 있습니다(15,217명 가운데). 자료 오류로 보입니다.
     연표에서는 1000~2030 사이만 씁니다.
   ============================================================ */
(function(){
  var SB  = 'https://ptdxzxkgddvkusamkiol.supabase.co';
  var KEY = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';
  var HDR = { apikey: KEY, Authorization: 'Bearer ' + KEY };

  var YR_MIN = 1000, YR_MAX = 2030;

  /* 시대 — 인물DB 의 era_yr 에 실제로 들어 있는 범위를 그대로 씁니다.
     terms 는 용어사전에서 찾을 낱말입니다(era 가 자유로운 글이라). */
  var ERAS = [
    { key:'medieval',    name:'중세',     y0:YR_MIN, y1:1400,
      terms:['중세','9세기','11세기','12세기','13세기','14세기'],
      sum:'단선율 성가에서 여러 성부가 갈라져 나온 시대입니다. 기보법이 이때 생겼습니다.' },
    { key:'renaissance', name:'르네상스', y0:1400, y1:1600,
      terms:['르네상스','15세기','16세기'],
      sum:'여러 성부가 대등하게 얽히는 다성음악이 무르익었습니다. 인쇄술로 악보가 널리 퍼졌습니다.' },
    { key:'baroque',     name:'바로크',   y0:1600, y1:1750,
      terms:['바로크','17세기'],
      sum:'통주저음과 조성이 자리 잡고 오페라가 태어났습니다. 협주곡과 푸가도 이때 틀을 갖췄습니다.' },
    { key:'classical',   name:'고전주의', y0:1750, y1:1820,
      terms:['고전','18세기'],
      sum:'균형과 또렷한 짜임을 앞세웠습니다. 소나타 형식 · 교향곡 · 현악사중주가 이 시대에 완성됩니다.' },
    { key:'romantic',    name:'낭만주의', y0:1820, y1:1900,
      terms:['낭만','19세기'],
      sum:'감정과 개성을 앞세우고 형식을 넓혔습니다. 가곡과 교향시 같은 새 갈래가 자랐습니다.' },
    { key:'modern',      name:'근·현대',  y0:1900, y1:1945,
      terms:['20세기 초','20세기 전반','1920','1930','1940'],
      sum:'조성이 흔들리고 여러 길이 동시에 갈라졌습니다. 무조 · 12음 기법 · 신고전주의가 함께 갑니다.' },
    { key:'contemporary',name:'현대',     y0:1945, y1:YR_MAX,
      terms:['20세기 중반','20세기 후반','1945','1950','1960','1970','1980','1990','21세기'],
      sum:'총렬주의 · 우연성 · 전자음악 · 음향 덩어리가 잇달아 나왔습니다. 지금도 이어지고 있습니다.' }
  ];

  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function $(id){ return document.getElementById(id); }
  function ini(s){ s=String(s||'').trim(); return s ? esc(s.charAt(0)) : '?'; }
  function skel(n){ var h=''; for(var i=0;i<n;i++) h += '<div class="tl-sk"></div>'; return h; }

  /* 몇 건인지만 받아 옵니다 — 자료는 안 받고 머리글만 읽습니다 */
  function countOf(query){
    return fetch(SB + '/rest/v1/' + query + '&limit=1',
      { headers: Object.assign({ Prefer:'count=exact' }, HDR) })
      .then(function(r){
        if(!r.ok) return 0;
        var cr = r.headers.get('content-range') || '';
        var t = cr.split('/')[1];
        return (t && t !== '*') ? (parseInt(t,10) || 0) : 0;
      }).catch(function(){ return 0; });
  }
  function rowsOf(query){
    return fetch(SB + '/rest/v1/' + query, { headers: HDR })
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; });
  }

  /* ── 시대별 조회 주소 ── */
  function qPersons(e, n){
    return 'persons?select=id,name_ko,name_en,life,birth_year,field,image_url'
         + '&hidden=is.false&birth_year=gte.' + e.y0 + '&birth_year=lt.' + e.y1
         + (n ? '&order=quality.desc.nullslast,score_count.desc.nullslast,birth_year.asc&limit=' + n : '');
  }
  function qWorks(e, n){
    return 'person_works?select=id,title,title_ko,composer_ko,composer_en,year_from'
         + '&year_from=gte.' + e.y0 + '&year_from=lt.' + e.y1
         + (n ? '&order=year_from.asc&limit=' + n : '');
  }
  function qTerms(e, n){
    var or = e.terms.map(function(t){ return 'era.ilike.*' + encodeURIComponent(t) + '*'; }).join(',');
    return 'oc_terms?select=id,term_ko,term_en,category,era,summary'
         + '&hidden=is.false&or=(' + or + ')'
         + (n ? '&order=sort_order.asc.nullslast&limit=' + n : '');
  }

  /* ── 시대 띠 그리기 ── */
  var cur = null;

  function drawBand(counts){
    var max = 1;
    ERAS.forEach(function(e){ if((counts[e.key]||0) > max) max = counts[e.key]; });

    $('tlBand').innerHTML = ERAS.map(function(e){
      var n = counts[e.key] || 0;
      /* 아래 옅은 막대의 높이로 인물 수를 나타냅니다.
         제곱근을 쓰는 것은, 현대(5천 명)와 중세(40명) 차이가 너무 커
         그대로 두면 중세가 보이지 않기 때문입니다. */
      var h = Math.round(6 + 58 * Math.sqrt(n / max));
      return '<button type="button" class="tl-seg" data-k="' + e.key + '" role="tab">'
           +   '<span class="bar" style="height:' + h + 'px"></span>'
           +   '<span class="yr">' + (e.y0 === YR_MIN ? '~' + e.y1 : e.y0 + (e.y1 === YR_MAX ? '~' : '–' + e.y1)) + '</span>'
           +   '<span class="nm">' + esc(e.name) + '</span>'
           +   '<span class="cnt">' + n.toLocaleString() + '명</span>'
           + '</button>';
    }).join('');

    $('tlAxis').innerHTML = ERAS.map(function(e){
      return '<span>' + (e.y0 === YR_MIN ? '' : e.y0) + '</span>';
    }).join('');

    Array.prototype.forEach.call($('tlBand').querySelectorAll('.tl-seg'), function(b){
      b.addEventListener('click', function(){ pick(b.getAttribute('data-k')); });
    });
  }

  /* ── 고른 시대 그리기 ── */
  function pick(key){
    var e = null;
    for(var i=0;i<ERAS.length;i++) if(ERAS[i].key === key) e = ERAS[i];
    if(!e) return;
    cur = key;

    Array.prototype.forEach.call($('tlBand').querySelectorAll('.tl-seg'), function(b){
      b.classList.toggle('on', b.getAttribute('data-k') === key);
      b.setAttribute('aria-selected', b.getAttribute('data-k') === key ? 'true' : 'false');
    });

    $('tlName').textContent = e.name;
    $('tlYr').textContent = (e.y0 === YR_MIN ? '~' + e.y1 : e.y0 + (e.y1 === YR_MAX ? '년 이후' : '–' + e.y1)) + '년';
    $('tlSum').textContent = e.sum;

    /* 더 보기 링크 — 각 DB 의 검색으로 넘깁니다 */
    $('tlMoreP').href = '/db/person.html?q=' + encodeURIComponent(e.name);
    $('tlMoreW').href = '/db/work.html?q='   + encodeURIComponent(e.name);
    $('tlMoreT').href = '/db/terms.html?q='  + encodeURIComponent(e.name);

    $('tlPersons').innerHTML = skel(5);
    $('tlWorks').innerHTML   = skel(5);
    $('tlTerms').innerHTML   = skel(5);

    /* 인물 */
    rowsOf(qPersons(e, 8)).then(function(rows){
      if(cur !== key) return;
      if(!rows.length){ $('tlPersons').innerHTML = '<div class="tl-empty">아직 등록된 인물이 없습니다.</div>'; return; }
      $('tlPersons').innerHTML = rows.map(function(p){
        var nm = p.name_ko || p.name_en || '';
        var av = p.image_url
          ? '<span class="av"><img src="' + esc(p.image_url) + '" alt="" loading="lazy"></span>'
          : '<span class="av">' + ini(nm) + '</span>';
        return '<a class="tl-item" href="/db/person-view.html?id=' + encodeURIComponent(p.id) + '">'
             + av
             + '<span class="bd"><span class="t">' + esc(nm) + '</span>'
             + '<span class="s">' + esc([p.field, p.life].filter(Boolean).join(' · ')) + '</span></span></a>';
      }).join('');
    });

    /* 작품 */
    rowsOf(qWorks(e, 8)).then(function(rows){
      if(cur !== key) return;
      if(!rows.length){ $('tlWorks').innerHTML = '<div class="tl-empty">작곡 연도가 적힌 작품이 아직 없습니다.</div>'; return; }
      $('tlWorks').innerHTML = rows.map(function(w){
        var t = w.title_ko || w.title || '';
        var c = w.composer_ko || w.composer_en || '';
        return '<a class="tl-item" href="/db/work-view.html?id=' + encodeURIComponent(w.id) + '">'
             + '<span class="bd"><span class="t">' + esc(t) + '</span>'
             + '<span class="s">' + esc([c, w.year_from].filter(Boolean).join(' · ')) + '</span></span></a>';
      }).join('');
    });

    /* 용어 */
    rowsOf(qTerms(e, 8)).then(function(rows){
      if(cur !== key) return;
      if(!rows.length){ $('tlTerms').innerHTML = '<div class="tl-empty">이 시대로 표시된 용어가 아직 없습니다.</div>'; return; }
      $('tlTerms').innerHTML = rows.map(function(t){
        return '<a class="tl-item" href="/db/terms-view.html?id=' + encodeURIComponent(t.id) + '">'
             + '<span class="bd"><span class="t">' + esc(t.term_ko || '') + '</span>'
             + '<span class="s">' + esc([t.category, t.era].filter(Boolean).join(' · ')) + '</span></span></a>';
      }).join('');
    });
  }

  /* ── 시작 ── */
  document.addEventListener('DOMContentLoaded', function(){
    /* 띠를 먼저 뼈대만 그려 둡니다 — 숫자를 기다리는 동안 화면이 비지 않게 */
    drawBand({});

    Promise.all(ERAS.map(function(e){ return countOf(qPersons(e, 0)); }))
      .then(function(list){
        var c = {};
        ERAS.forEach(function(e, i){ c[e.key] = list[i]; });
        drawBand(c);
        /* 주소에 시대가 적혀 있으면 그것을, 아니면 바로크로 시작합니다 */
        var want = new URLSearchParams(location.search).get('era') || '';
        var ok = ERAS.some(function(e){ return e.key === want; });
        pick(ok ? want : 'baroque');
      })
      .catch(function(){ pick('baroque'); });
  });
})();
</script>
<script src="/assets/app.js" defer></script>
</body>

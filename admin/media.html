<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OPUSCLAM · 음원·동영상 검토</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f6f6f9;color:#20223a;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
  .backlink{display:inline-block;margin-bottom:14px;font-size:12.5px;font-weight:600;color:#5c5e70;text-decoration:none;border:1px solid #d8d8e2;border-radius:7px;padding:7px 13px;background:#fff}
  .backlink:hover{border-color:#7C63B0;color:#7C63B0}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 18px 90px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#6b6d80;font-size:13px;margin-bottom:22px}
  .card{background:#fff;border:1px solid #e3e3ec;border-radius:10px;padding:16px 18px;margin-bottom:14px}
  button{appearance:none;border:0;border-radius:7px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;background:#20223a;color:#fff}
  button.ghost{background:#fff;color:#20223a;border:1px solid #cfd0dd}
  button.ok{background:#0f9b8e}
  button.no{background:#fff;color:#a01c1c;border:1px solid #f0c8c8}
  button:disabled{opacity:.45;cursor:not-allowed}
  select,input[type=text]{appearance:none;border:1px solid #d8d8e2;border-radius:7px;padding:8px 11px;font-size:13px;background:#fff;color:#20223a}

  .warn{background:#fff6f6;border:1px solid #f3caca;color:#a01c1c;border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:16px;display:none}
  .warn.on{display:block}
  .note{background:#f4f7ff;border:1px solid #d6e0f7;color:#2c4a86;border-radius:8px;padding:11px 14px;font-size:12.5px;margin-bottom:16px}

  .stat{display:flex;flex-wrap:wrap;gap:9px}
  .stat div{background:#f2f2f7;border-radius:7px;padding:9px 13px;font-size:12px;color:#5c5e70}
  .stat b{font-size:17px;display:block;color:#20223a;font-variant-numeric:tabular-nums}

  .tabs{display:flex;gap:0;border-bottom:1.5px solid #e3e3ec;margin:0 0 14px}
  .tabs button{background:transparent;color:#8a8c9e;border:0;border-bottom:2px solid transparent;border-radius:0;padding:11px 17px;margin-bottom:-1.5px}
  .tabs button.on{color:#20223a;border-bottom-color:#7C63B0}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:14px}
  .bar .spacer{flex:1}
  .selinfo{font-size:12.5px;color:#6b6d80}

  .row{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid #e3e3ec;border-radius:10px;padding:13px;margin-bottom:10px}
  .row.sel{border-color:#7C63B0;box-shadow:0 0 0 2px rgba(124,99,176,.13)}
  .row .chk{flex:0 0 auto;padding-top:3px}
  .th{flex:0 0 auto;width:168px;aspect-ratio:16/9;border-radius:7px;overflow:hidden;background:#e9e9f0;cursor:pointer;position:relative}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:26px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .info{flex:1;min-width:0}
  .ti{font-size:14.5px;font-weight:700;line-height:1.4;margin:0 0 5px;word-break:break-word}
  .meta{font-size:12px;color:#6b6d80;display:flex;flex-wrap:wrap;gap:5px 12px;margin-bottom:6px}
  .meta b{color:#20223a;font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#f2f2f7;color:#5c5e70}
  .tag.p{background:#efe9fb;color:#5b4a92}
  .tag.s{background:#e6f5f1;color:#0d6b60}
  .desc{font-size:12.5px;color:#6b6d80;line-height:1.6;max-height:3.2em;overflow:hidden;margin-bottom:9px}
  .acts{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .acts a{font-size:12px;color:#7C63B0;text-decoration:none;font-weight:600}
  .score{flex:0 0 auto;text-align:center;min-width:56px}
  .score b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .score span{font-size:11px;color:#8a8c9e}

  .player{margin:10px 0 0;display:none}
  .player.on{display:block}
  .player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;display:block}

  .empty{padding:44px 0;text-align:center;color:#8a8c9e;font-size:13.5px}
  .skel{height:96px;background:linear-gradient(90deg,#f0f0f5 25%,#e6e6ee 37%,#f0f0f5 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:10px;margin-bottom:10px}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#20223a;color:#fff;font-size:13px;padding:11px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}

  @media (max-width:720px){
    .row{flex-wrap:wrap}
    .th{width:132px}
    .score{order:-1}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="admin.html">← 관리자로</a>
  <h1>음원·동영상 검토</h1>
  <div class="sub">자동으로 담긴 영상을 확인해 <b>내보내기</b> 하면 정보SPOT 화면에 나타납니다. 관리자 로그인 상태에서만 동작합니다.</div>

  <div class="warn" id="warn"></div>

  <div class="note">
    담긴 영상은 <b>숨김 상태</b>입니다. 내보내기를 누른 것만 화면에 나옵니다.
    버린 영상은 <b>다시 담기지 않습니다</b> — 수집기가 기억해 두었다가 건너뜁니다.
  </div>

  <div class="card">
    <div class="stat" id="stat"><div>불러오는 중…</div></div>
  </div>

  <div class="tabs" id="tabs">
    <button data-t="pending" class="on">확인 대기</button>
    <button data-t="approved">내보냄</button>
    <button data-t="rejected">버림</button>
  </div>

  <div class="bar">
    <select id="fCh"><option value="">채널 전체</option></select>
    <select id="fSort">
      <option value="score">점수 높은 순</option>
      <option value="new">최근에 담긴 순</option>
      <option value="pub">영상이 올라온 순</option>
    </select>
    <div class="spacer"></div>
    <span class="selinfo" id="selinfo"></span>
    <button class="ghost" id="btnAll">모두 고르기</button>
    <button class="ok" id="btnApprove" disabled>선택 내보내기</button>
    <button class="no" id="btnReject" disabled>선택 버리기</button>
  </div>

  <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';

  var SB_URL = 'https://ptdxzxkgddvkusamkiol.supabase.co';
  var SB_KEY = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  var TAB = 'pending';
  var rows = [];
  var picked = new Set();

  function $(id){ return document.getElementById(id); }
  function esc(v){ return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function warn(t){ var w = $('warn'); w.classList.add('on'); w.textContent = t; }
  function toast(t){
    var el = $('toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 2200);
  }
  function mmss(sec){
    var s = Number(sec) || 0;
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    return h ? (h + '시간 ' + m + '분') : (m + '분');
  }
  function ymd(v){
    if (!v) return '';
    var d = new Date(v); if (isNaN(d)) return '';
    return d.getFullYear() + '.' + ('0'+(d.getMonth()+1)).slice(-2) + '.' + ('0'+d.getDate()).slice(-2);
  }

  /* ── 관리자인지 확인 ── */
  async function checkAdmin(){
    var u = await sb.auth.getUser();
    var user = u && u.data && u.data.user;
    if (!user) {
      warn('로그인되어 있지 않습니다. 사이트에서 관리자 계정으로 로그인한 뒤 이 화면을 다시 열어 주세요.');
      return false;
    }
    var m = await sb.from('members').select('is_admin,name').eq('id', user.id).maybeSingle();
    if (!m.data || !m.data.is_admin) {
      warn('관리자 권한이 없는 계정입니다. (' + (user.email || '') + ')');
      return false;
    }
    return true;
  }

  /* ── 숫자 ── */
  async function loadStat(){
    var box = $('stat');
    async function cnt(filter){
      var q = sb.from('spot').select('id', { count:'exact', head:true })
                .eq('section', '음원영상').not('video_id', 'is', null);
      if (filter === 'pending')  q = q.or('review_status.eq.pending,review_status.is.null');
      if (filter === 'approved') q = q.eq('review_status', 'approved');
      if (filter === 'rejected') q = q.eq('review_status', 'rejected');
      var r = await q;
      return r.count || 0;
    }
    try {
      var p = await cnt('pending'), a = await cnt('approved'), j = await cnt('rejected');
      box.innerHTML =
          '<div>확인 대기<b>' + p.toLocaleString() + '</b></div>'
        + '<div>내보냄<b>'   + a.toLocaleString() + '</b></div>'
        + '<div>버림<b>'     + j.toLocaleString() + '</b></div>'
        + '<div>전체<b>'     + (p+a+j).toLocaleString() + '</b></div>';
    } catch (e) {
      box.innerHTML = '<div>숫자를 불러오지 못했습니다</div>';
    }
  }

  /* ── 채널 고르기 칸 채우기 ── */
  async function loadChannels(){
    try {
      var r = await sb.from('spot').select('channel_name')
                 .eq('section','음원영상').not('channel_name','is',null).limit(1000);
      var set = {};
      (r.data || []).forEach(function(x){ if (x.channel_name) set[x.channel_name] = 1; });
      var names = Object.keys(set).sort();
      var sel = $('fCh');
      names.forEach(function(n){
        var o = document.createElement('option');
        o.value = n; o.textContent = n; sel.appendChild(o);
      });
    } catch (e) {}
  }

  /* ── 목록 ── */
  async function load(){
    var box = $('list');
    box.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    picked.clear(); syncSel();

    var q = sb.from('spot')
      .select('id,title,body,thumb_url,video_id,channel_name,duration_sec,published_at,'
            + 'yt_views,media_score,matched_names,category,review_status,fetched_at,link_url')
      .eq('section','음원영상').not('video_id','is',null).limit(200);

    if (TAB === 'pending')  q = q.or('review_status.eq.pending,review_status.is.null');
    if (TAB === 'approved') q = q.eq('review_status','approved');
    if (TAB === 'rejected') q = q.eq('review_status','rejected');

    var ch = $('fCh').value;
    if (ch) q = q.eq('channel_name', ch);

    var sort = $('fSort').value;
    if (sort === 'score') q = q.order('media_score', { ascending:false, nullsFirst:false });
    else if (sort === 'pub') q = q.order('published_at', { ascending:false, nullsFirst:false });
    else q = q.order('fetched_at', { ascending:false, nullsFirst:false });

    var r = await q;
    if (r.error) { box.innerHTML = '<div class="empty">불러오지 못했습니다 — ' + esc(r.error.message) + '</div>'; return; }
    rows = r.data || [];
    render();
  }

  function render(){
    var box = $('list');
    if (!rows.length) {
      box.innerHTML = '<div class="empty">'
        + (TAB === 'pending' ? '확인할 영상이 없습니다. 수집기를 돌리면 이곳에 쌓입니다.'
          : TAB === 'approved' ? '내보낸 영상이 없습니다.' : '버린 영상이 없습니다.')
        + '</div>';
      return;
    }
    box.innerHTML = rows.map(function(r){
      var tags = [];
      if (r.category) tags.push('<span class="tag">' + esc(r.category) + '</span>');
      if (r.matched_names) {
        r.matched_names.split(',').forEach(function(n){
          n = n.trim(); if (n) tags.push('<span class="tag p">' + esc(n) + '</span>');
        });
      }
      if (r.review_status === 'approved') tags.push('<span class="tag s">내보냄</span>');

      var body = String(r.body || '').replace(/\s+/g,' ').trim();

      return '<div class="row" data-id="' + r.id + '">'
        + '<label class="chk"><input type="checkbox" data-pick="' + r.id + '"></label>'
        + '<div class="th" data-play="' + esc(r.video_id) + '">'
        +   (r.thumb_url ? '<img src="' + esc(r.thumb_url) + '" alt="" loading="lazy">' : '')
        +   '<span class="play">&#9654;</span>'
        + '</div>'
        + '<div class="info">'
        +   '<p class="ti">' + esc(r.title) + '</p>'
        +   '<div class="meta">'
        +     (r.channel_name ? '<span><b>' + esc(r.channel_name) + '</b></span>' : '')
        +     (r.duration_sec ? '<span>' + mmss(r.duration_sec) + '</span>' : '')
        +     (r.published_at ? '<span>' + ymd(r.published_at) + ' 공개</span>' : '')
        +     (r.yt_views ? '<span>조회 ' + Number(r.yt_views).toLocaleString() + '</span>' : '')
        +   '</div>'
        +   (tags.length ? '<div class="tags">' + tags.join('') + '</div>' : '')
        +   (body ? '<div class="desc">' + esc(body) + '</div>' : '')
        +   '<div class="acts">'
        +     (TAB !== 'approved' ? '<button class="ok" data-one="approve" data-id="' + r.id + '">내보내기</button>' : '')
        +     (TAB !== 'rejected' ? '<button class="no" data-one="reject" data-id="' + r.id + '">버리기</button>' : '')
        +     (TAB !== 'pending'  ? '<button class="ghost" data-one="pending" data-id="' + r.id + '">대기로 되돌리기</button>' : '')
        +     '<a href="https://www.youtube.com/watch?v=' + esc(r.video_id) + '" target="_blank" rel="noopener">유튜브에서 보기 ↗</a>'
        +   '</div>'
        +   '<div class="player" data-slot="' + esc(r.video_id) + '"></div>'
        + '</div>'
        + '<div class="score"><b>' + (r.media_score == null ? '—' : r.media_score) + '</b><span>점</span></div>'
        + '</div>';
    }).join('');
  }

  function syncSel(){
    $('selinfo').textContent = picked.size ? (picked.size + '개 골랐습니다') : '';
    $('btnApprove').disabled = !picked.size;
    $('btnReject').disabled  = !picked.size;
  }

  /* ── 상태 바꾸기 ── */
  async function setStatus(ids, status){
    if (!ids.length) return;
    var patch = { review_status: status, hidden: status !== 'approved' };
    var r = await sb.from('spot').update(patch).in('id', ids);
    if (r.error) { toast('바꾸지 못했습니다 — ' + r.error.message); return; }
    toast(ids.length + '개를 ' + (status === 'approved' ? '내보냈습니다' : status === 'rejected' ? '버렸습니다' : '대기로 되돌렸습니다'));
    await loadStat();
    await load();
  }

  /* ── 화면 동작 ── */
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button[data-t]'); if (!b) return;
    TAB = b.getAttribute('data-t');
    $('tabs').querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
    load();
  });
  $('fCh').addEventListener('change', load);
  $('fSort').addEventListener('change', load);

  $('list').addEventListener('click', function(e){
    /* 영상 미리보기 — 누르면 그 자리에서 펼쳐 재생합니다 */
    var th = e.target.closest('.th[data-play]');
    if (th) {
      var vid = th.getAttribute('data-play');
      var slot = $('list').querySelector('.player[data-slot="' + vid + '"]');
      if (slot) {
        if (slot.classList.contains('on')) { slot.classList.remove('on'); slot.innerHTML = ''; }
        else {
          slot.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vid
            + '" title="미리보기" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"'
            + ' allowfullscreen loading="lazy"></iframe>';
          slot.classList.add('on');
        }
      }
      return;
    }
    /* 하나씩 처리 */
    var one = e.target.closest('button[data-one]');
    if (one) {
      var id = Number(one.getAttribute('data-id'));
      var act = one.getAttribute('data-one');
      setStatus([id], act === 'approve' ? 'approved' : act === 'reject' ? 'rejected' : 'pending');
      return;
    }
  });

  $('list').addEventListener('change', function(e){
    var cb = e.target.closest('input[data-pick]'); if (!cb) return;
    var id = Number(cb.getAttribute('data-pick'));
    if (cb.checked) picked.add(id); else picked.delete(id);
    var row = cb.closest('.row'); if (row) row.classList.toggle('sel', cb.checked);
    syncSel();
  });

  $('btnAll').addEventListener('click', function(){
    var boxes = $('list').querySelectorAll('input[data-pick]');
    var allOn = picked.size === boxes.length && boxes.length > 0;
    picked.clear();
    boxes.forEach(function(cb){
      cb.checked = !allOn;
      if (!allOn) picked.add(Number(cb.getAttribute('data-pick')));
      var row = cb.closest('.row'); if (row) row.classList.toggle('sel', !allOn);
    });
    syncSel();
  });

  $('btnApprove').addEventListener('click', function(){
    setStatus([...picked], 'approved');
  });
  $('btnReject').addEventListener('click', function(){
    if (!confirm(picked.size + '개를 버립니다. 버린 영상은 다시 담기지 않습니다. 계속할까요?')) return;
    setStatus([...picked], 'rejected');
  });

  /* ── 시작 ── */
  (async function(){
    var ok = await checkAdmin();
    if (!ok) { $('list').innerHTML = ''; $('stat').innerHTML = '<div>—</div>'; return; }
    await loadStat();
    await loadChannels();
    await load();
  })();

})();
</script>
</body>
</html>

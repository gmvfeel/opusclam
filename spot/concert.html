<body data-header="overlay">
<div id="oc-header"></div>
<script src="/assets/include.js"></script>

<section class="pdb pdb-board">
  <div class="pdb-bg" aria-hidden="true">
    <div class="wave">
      <div class="scene scene-spot on">
        <svg viewBox="0 0 1280 460" preserveAspectRatio="xMidYMid slice">
          <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7FD6"/><stop offset="1" stop-color="#C9A94E"/></linearGradient></defs>
          <g fill="url(#dg)"></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="pdb-inner">

    <nav class="pdb-crumb" aria-label="위치">
      <a href="/home.html">홈</a><span>/</span><a href="/spot/index.html">정보SPOT</a><span>/</span><span class="on">공연정보</span>
    </nav>

    <!-- 정보SPOT 하위 메뉴 — partials/subnav-spot.html 한 곳에서 관리합니다 -->
    <div id="oc-subnav" data-src="/partials/subnav-spot.html"></div>

    <header class="pdb-head">
      <div class="pdb-titlebar">
        <div>
          <div class="pdb-eyebrow">OPUSCLAM INFORMATION SERVICE</div>
          <h1 class="pdb-title">공연정보</h1>
        </div>
      </div>
      <p class="pdb-lead">국내외 클래식 공연의 일정과 공연장 정보를 모았습니다.</p>
    </header>
  </div>
</section>

<main class="board">
  <div class="board-bar pdb-toolbar">
    <div class="board-search pdb-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="제목·내용 검색" aria-label="검색">
      <button type="button" class="board-searchbtn pdb-searchbtn" aria-label="검색">검색</button>
    </div>
    <div class="pdb-selects">
      <!-- 국내/해외 · 구분 상자를 뺐습니다.
           수집된 870건이 전부 region='국내' · category='클래식' 이라
           어느 것을 골라도 빈 화면이 됐습니다.
           해외 공연이 들어오기 시작하면 그때 다시 답니다. -->
      <select class="board-sort" aria-label="정렬">
        <option value="date_from">공연일순</option>
        <option value="created_at">등록순</option>
        <option value="view_count">인기순</option>
      </select>
    </div>
    <div class="pdb-fontsize" role="group" aria-label="글자 크기 조절">
      <span class="fs-label">글자크기</span>
      <button type="button" class="fs-btn" data-fs="down" aria-label="글자 작게">가–</button>
      <button type="button" class="fs-btn" data-fs="reset" aria-label="기본 크기">가</button>
      <button type="button" class="fs-btn" data-fs="up" aria-label="글자 크게">가+</button>
    </div>
  </div>

  <!-- ★ 2026-08-14 · 거르개 <b>한 줄</b> — 지역과 기간을 세로선으로 가릅니다
         ─────────────────────────────────────────────────────────────
         처음에는 두 줄로 두었는데 파트너가 「정리해 달라」 하셨습니다.
         두 줄이면 「어느 쪽이 먼저인가」를 생각하게 됩니다 — 실제로는
         두 조건이 <b>함께</b> 걸리는데 서로 배타적인 것처럼 읽힙니다.
         모바일에서는 목록 첫 줄이 화면 밖으로 밀리기도 했습니다.
       ▶ 한 줄에 담고 사이에 가는 세로선을 둡니다. 줄을 나누는 대신
         선 하나로 갈래를 표시하는 것입니다.
       ★ 안쪽 두 칸은 board.js 가 cfg.regionTabs · cfg.dateTabs 를 보고
         채웁니다. 순서를 바꾸려면 이 두 줄의 자리를 바꾸면 됩니다. -->
  <div class="board-filterbar">
    <div class="board-regiontabs"></div>
    <div class="board-datetabs"></div>
  </div>

  <div class="board-count pdb-count">전체 <b>0</b>건</div>
  <div class="board-list"></div>

  <div class="board-foot">
    <div class="board-pager"></div>
    <div class="board-actions"></div>
  </div>
</main>

<section class="bigban">
  <div class="wrap">
    <!-- ★ 2026-08-14 · C 자리(670×190) — 광고 + 광고문의 자리표를 7초마다
           번갈아 보여 줍니다(assets/ad-rotate.js).
           그림은 두 배 크기(1340×380) · WebP 17KB.
           ★ 이 묶음은 화면 42곳에 <b>똑같이</b> 들어 있습니다. 광고를 갈 때는
             한 곳만 고치지 말고 <b>모두</b> 함께 고쳐야 합니다. -->
    <div class="ad-rot bigban-ad" data-every="7000">
      <a class="ad-slot bigban-ad has-img has-frame" href="https://www.ond2u.com/" target="_blank" rel="noopener"
         aria-label="오늘의 편지 — 매일 한 편의 위로를 보냅니다 (새 창)">
        <picture>
          <source srcset="/assets/ads/ond2u-c-1340x380.webp" type="image/webp">
          <img src="/assets/ads/ond2u-c-1340x380.jpg" width="1340" height="380"
               loading="lazy" decoding="async"
               alt="오늘 하루가 버거운 당신에게 한 편의 위로를 보냅니다">
        </picture>
      </a>
      <a class="ad-slot bigban-ad ad-cta" aria-label="광고문의 — 광고안내 준비 중">
        <span class="ad-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg></span>
        <span class="ad-badge">Advertisement</span>
        <strong class="ad-ctat">광고문의</strong>
        <span class="ad-desc">광고안내 바로가기 &rarr;</span>
      </a>
    </div>
    <!-- ★ 2026-08-14 · D 자리(446×190) — 광고 + 광고문의 자리표를 번갈아.
           그림은 두 배 크기(892×380) · WebP 10KB.
           ★ 이 묶음도 화면 41곳에 <b>똑같이</b> 있습니다. 광고를 갈 때는
             한 곳만 고치지 말고 모두 함께 고쳐야 합니다. -->
    <div class="ad-rot bigban-ad" data-every="7000">
      <a class="ad-slot bigban-ad has-img" href="https://booklps.vercel.app/" target="_blank" rel="noopener"
         aria-label="booklps — 절판 도서·음반 통합 검색 (새 창)">
        <picture>
          <source srcset="/assets/ads/booklps-d-892x380.webp" type="image/webp">
          <img src="/assets/ads/booklps-d-892x380.jpg" width="892" height="380"
               loading="lazy" decoding="async"
               alt="booklps — 어딘가엔, 분명히 있습니다 · 절판 도서·음반 통합 검색">
        </picture>
      </a>
      <a class="ad-slot bigban-ad ad-cta" aria-label="광고문의 — 광고안내 준비 중">
        <span class="ad-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg></span>
        <span class="ad-badge">Advertisement</span>
        <strong class="ad-ctat">광고문의</strong>
        <span class="ad-desc">광고안내 바로가기 &rarr;</span>
      </a>
    </div>
  </div>
</section>

<div id="oc-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/board.js"></script>
<script>
  /* 정보SPOT 은 표 하나(spot)에 여섯 갈래를 담고 section 으로 나눕니다.
     이 화면은 「공연정보」 갈래만 봅니다 — where 한 줄로 정합니다.
     목록의 모양·검색·페이지 넘김은 모두 공용 엔진(assets/board.js)이 합니다. */
  document.addEventListener('DOMContentLoaded', function(){
    OCBoard.list({
      table:'spot', pageSize:20,
      viewPage:'spot-view.html', writePage:'spot-write-concert.html',
      where:'&section=eq.' + encodeURIComponent('공연정보') + '&hidden=is.false',
      searchCols:['title','title_en','body','keywords','country','city','organizer','venue_name'],
      /* 구분·지역 상자는 뺐습니다 — 위 마크업의 주석을 보십시오.

         대신 날짜로 나눕니다. 공연 목록에서 정작 중요한 것은
         「지금 갈 수 있는가」이지 갈래가 아닙니다.

         기준 칸을 date_to(끝나는 날)로 잡은 까닭 —
         여러 날 하는 공연은 시작일이 지났어도 오늘 하고 있습니다.
         date_from 으로 자르면 그런 공연이 「지난 공연」으로 밀립니다. */
      /* ★ 2026-08-14 · 지역 탭 — 기본은 <b>국내</b>입니다.
           처음 들어온 분이 보아야 하는 것은 <b>갈 수 있는 공연</b>이고,
           해외는 눌러서 보는 자리가 자연스럽습니다.
         ★ 값은 region 칸에 담긴 그대로 씁니다. 빈 값은 「거르지 않음」. */
      regionTabs:{
        def:'국내',
        /* ★ 「전체」가 두 묶음에 다 있으면 어느 전체인지 헷갈립니다.
             지역은 <b>무엇을 합친 것인지</b> 그 자리에서 보이게 적습니다. */
        tabs:[{value:'국내', label:'국내'},
              {value:'해외', label:'해외'},
              {value:'',     label:'국내+해외'}]
      },
      dateTabs:{
        col:'date_to', def:'upcoming',
        tabs:[{value:'upcoming', label:'진행중·예정', dir:'asc'},
              {value:'past',     label:'지난 공연',   dir:'desc'},
              {value:'all',      label:'전체 기간',   dir:'desc'}]
      },
      /* 공연은 「무엇을·언제·어디서」 가 한눈에 보여야 하므로
         포스터와 일시·장소를 함께 보여 주는 모양을 씁니다 (시안 04_공연정보) */
      concertStyle:true, writeRole:'member', pinnedFirst:true, defaultSort:'date_from',
      commentsTable:'spot_comments'
    });
  });
</script>
<script src="/assets/app.js" defer></script>
<!-- 앱 설치 안내 · 서비스워커 등록 (공용) -->
<script src="/assets/pwa-install.js" defer></script>
</body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  /* 정보SPOT 은 표 하나(spot)에 여섯 갈래를 담고 section 으로 나눕니다.
     이 화면은 「음원영상」 갈래만 봅니다 — where 한 줄로 정합니다.
     목록의 모양·검색·페이지 넘김은 모두 공용 엔진(assets/board.js)이 합니다. */
  document.addEventListener('DOMContentLoaded', function(){
    OCBoard.list({
      table:'spot', pageSize:20,
      viewPage:'spot-view.html', writePage:'spot-write-media.html',
      where:'&section=eq.' + encodeURIComponent('음원영상') + '&hidden=is.false',
      searchCols:['title','title_en','body','keywords','channel_name','matched_names'],
      categories:[{"value":"","label":"편성선택"}],   /* 아래에서 자료가 있는 편성만 채웁니다 */
      eras:[{"value":"","label":"시대 전체"},
            {"value":"현대음악이전","label":"현대음악이전"},
            {"value":"현대음악","label":"현대음악"}],
      cardStyle:true, koField:'title_ko',   /* 한국어 표기가 있으면 앞세웁니다 */
      writeRole:'member', pinnedFirst:true, defaultSort:'created_at',
      commentsTable:'spot_comments'
    });
  });

  /* 「편성」 고르는 칸을 채웁니다.

     열여섯 갈래를 모두 늘어놓고, 자료가 있는 것에만 건수를 붙입니다.
     처음에는 자료 있는 것만 보이게 했는데, 그러면 타악(Percussion)처럼
     아직 자료가 없는 갈래가 목록에서 사라져 무엇을 담을 수 있는지 알기 어렵습니다.
     순서는 큰 편성 → 작은 편성 → 악기별 → 성악 → 특수 로 두었고,
     「기타」 는 언제나 맨 뒤입니다. */
  (function(){
    var ORDER = ['Symphony','Orchestral','Concerto','Chamber','Ensemble',
                 'Piano','Strings','Wind','Brass','Percussion','Organ',
                 'Vocal','Choral','Oratorio/Mass','Opera','Electronic','기타'];
    var U = 'https://ptdxzxkgddvkusamkiol.supabase.co/rest/v1/spot';
    var K = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';
    /* 편성 목록을 세기 위해 category 만 받습니다.
       한 번에 몰아 받지 않고 나눠 받습니다 — 「한 번에 받을 수 있는 양」 을
       낮추어도 편성이 빠지지 않게 하려는 것입니다. */
    var q = '?select=category&section=eq.' + encodeURIComponent('음원영상')
          + '&hidden=is.false&category=not.is.null&order=category.asc';
    var H2 = { apikey:K, Authorization:'Bearer ' + K };
    var SIZE = 150;
    function part(off, acc) {
      return fetch(U + q + '&offset=' + off + '&limit=' + SIZE, { headers:H2 })
        .then(function(r){ return r.ok ? r.json() : []; })
        .then(function(rows){
          rows = rows || [];
          acc = acc.concat(rows);
          if (rows.length >= SIZE && off + SIZE < 3000) return part(off + SIZE, acc);
          return acc;
        });
    }
    part(0, [])
      .then(function(rows){
        var seen = {};
        (rows || []).forEach(function(x){ if (x.category) seen[x.category] = (seen[x.category] || 0) + 1; });
        var sel = document.querySelector('.board-catsel');
        if (!sel) return;
        /* 목록에 없는 갈래가 자료에 있으면 뒤에 붙입니다 (규칙을 늘렸을 때를 위해) */
        var extra = Object.keys(seen).filter(function(k){ return ORDER.indexOf(k) < 0; }).sort();
        ORDER.slice(0, -1).concat(extra, ['기타']).forEach(function(n){
          var o = document.createElement('option');
          o.value = n;
          o.textContent = seen[n] ? (n + ' (' + seen[n] + ')') : n;
          sel.appendChild(o);
        });
      }).catch(function(){});
  })();
</script>

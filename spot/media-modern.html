          <g fill="url(#dg)"></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="pdb-inner">

    <nav class="pdb-crumb" aria-label="위치">
      <a href="/home.html">홈</a><span>/</span><a href="/spot/index.html">정보SPOT</a><span>/</span><span class="on">현대음악</span>

<main class="board">

    <div class="pdb-fontsize" role="group" aria-label="글자 크기 조절">
      <span class="fs-label">글자크기</span>
      <button type="button" class="fs-btn" data-fs="down" aria-label="글자 작게">가–</button>
      <button type="button" class="fs-btn" data-fs="reset" aria-label="기본 크기">가</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/board.js"></script>
<script>
  /* 정보SPOT 은 표 하나(spot)에 여섯 갈래를 담고 section 으로 나눕니다.
     이 화면은 「음원영상」 갈래만 봅니다 — where 한 줄로 정합니다.
     목록의 모양·검색·페이지 넘김은 모두 공용 엔진(assets/board.js)이 합니다. */
  document.addEventListener('DOMContentLoaded', function(){
    OCBoard.list({
      table:'spot', pageSize:20,
      viewPage:'spot-view.html', writePage:'spot-write-media.html',
      where:'&section=eq.' + encodeURIComponent('음원영상') + '&hidden=is.false'
        + '&era=eq.' + encodeURIComponent('현대음악'),
      searchCols:['title','title_en','body','keywords','channel_name','matched_names'],
      categories:[{"value":"","label":"구분선택"}],   /* 아래에서 자료가 있는 편성만 채웁니다 */
      cardStyle:true, writeRole:'member', pinnedFirst:true, defaultSort:'created_at',
      commentsTable:'spot_comments'
    });
  });

  /* 「구분」 고르는 칸을 자료가 있는 편성으로만 채웁니다.
     편성을 열여섯 가지로 담고 있는데, 자료가 없는 것까지 늘어놓으면
     고르기만 번거로워집니다. */
  (function(){
    var U = 'https://ptdxzxkgddvkusamkiol.supabase.co/rest/v1/spot';
    var K = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';
    var ERA = '현대음악';
    var q = '?select=category&section=eq.' + encodeURIComponent('음원영상')
          + '&hidden=is.false&category=not.is.null&limit=1000'
          + (ERA ? '&era=eq.' + encodeURIComponent(ERA) : '');
    fetch(U + q, { headers:{ apikey:K, Authorization:'Bearer ' + K } })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var seen = {};
        (rows || []).forEach(function(x){ if (x.category) seen[x.category] = (seen[x.category] || 0) + 1; });
        var names = Object.keys(seen).sort(function(a,b){ return seen[b] - seen[a] || a.localeCompare(b); });
        var sel = document.querySelector('.board-catsel');
        if (!sel || !names.length) return;
        names.forEach(function(n){
          var o = document.createElement('option');
          o.value = n; o.textContent = n + ' (' + seen[n] + ')';
          sel.appendChild(o);
        });
      }).catch(function(){});
  })();
</script>
<script src="/assets/app.js" defer></script>
</body>
</html>

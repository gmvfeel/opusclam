<script>
  /* 정보SPOT 은 표 하나(spot)에 여섯 갈래를 담고 section 으로 나눕니다.
     이 화면은 「국내콩쿨」 갈래만 봅니다 — where 한 줄로 정합니다.
     목록의 모양·검색·페이지 넘김은 모두 공용 엔진(assets/board.js)이 합니다. */
  document.addEventListener('DOMContentLoaded', function(){
    OCBoard.list({
      table:'spot', pageSize:20,
      viewPage:'spot-view.html', writePage:'spot-write-concours.html',
      where:'&section=eq.' + encodeURIComponent('콩쿨') + '&hidden=is.false',
      searchCols:['title','title_en','body','keywords','country','city','organizer'],
      regions:[{"value":"","label":"국내/해외"},{"value":"국내","label":"국내"},{"value":"해외","label":"해외"}],
      categories:[{"value": "", "label": "부문선택"}, {"value": "종합", "label": "종합"}, {"value": "피아노", "label": "피아노"}, {"value": "현악", "label": "현악"}, {"value": "관악", "label": "관악"}, {"value": "성악", "label": "성악"}, {"value": "작곡", "label": "작곡"}, {"value": "지휘", "label": "지휘"}, {"value": "국악", "label": "국악"}],
      docStyle:true, writeRole:'member', pinnedFirst:true, defaultSort:'created_at',
      /* 유료 등재 배지 — 요금표(oc_paid_plans)에서 글자를 읽어 답니다.
         켜지 않은 게시판은 요금표 조회조차 하지 않습니다. */
      paidBadge:true,
      commentsTable:'spot_comments'
    });
  });
</script>

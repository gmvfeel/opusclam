<script>
/* ============================================================
   정보SPOT 상세 — 여섯 갈래가 이 한 화면을 함께 씁니다.

   왜 갈래마다 상세 화면을 따로 두지 않았나
     담는 항목과 보여 주는 모양이 모두 같습니다.
     다른 것은 「목록으로」가 어느 목록을 가리키는지 하나뿐입니다.
     그래서 글의 갈래(section)를 먼저 한 번 물어보고,
     그 답에 맞는 목록 주소를 넣은 다음 공용 엔진을 띄웁니다.
   ============================================================ */
(function(){
  var SB  = 'https://ptdxzxkgddvkusamkiol.supabase.co';
  var KEY = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';

  /* 갈래 → 목록 화면 · 화면 이름 */
  var MAP = {
    '페스티벌콩쿨': { list:'festival.html',    name:'해외페스티벌 / 콩쿨정보' },
    '국내콩쿨':     { list:'concours-kr.html', name:'국내콩쿨정보' },
    '지원금':       { list:'funding.html',     name:'지원금 / 정책자금정보' },
    '공연정보':     { list:'concert.html',     name:'공연정보' },
    '관련사이트':   { list:'sites.html',       name:'관련사이트' },
    '음원영상':     { list:'media.html',       name:'음원 / 동영상' }
  };
  var FALLBACK = { list:'index.html', name:'정보SPOT' };

  function start(info){
    /* 화면 위쪽 표시와 「목록으로」 단추들을 갈래에 맞춥니다 */
    var h = document.getElementById('pvTitle');
    if (h) h.textContent = info.name;
    var c = document.getElementById('pvCrumb');
    if (c) { c.textContent = info.name; c.className = ''; c.setAttribute('href', '/spot/' + info.list); }
    ['.pv-tolist-m', '.pv-listtab'].forEach(function(sel){
      var el = document.querySelector(sel);
      if (el) el.setAttribute('href', '/spot/' + info.list);
    });
    document.title = info.name + ' · OPUSCLAM';

    OCBoard.view({
      table:'spot',
      listPage:'/spot/' + info.list,
      viewPage:'spot-view.html',
      writePage:'/spot/spot-write-' + info.list,
      writeRole:'member', docView:true,
      incrementFn:'spot_view_inc',
      commentsTable:'spot_comments',
      /* 영상이 있으면 사진 대신 플레이어를 놓습니다 */
      videoField:'video_id',
      extraLinks:[
        { col:'video_url', label:'음원 · 동영상 보기' },
        { col:'source_url', label:'원문 출처' }
      ],
      enhance:{ label:'정보보강하기', db:'spot', email:'contact@opusclam.com' }
    });
  }

  var id = new URLSearchParams(location.search).get('id');
  if (!id) { start(FALLBACK); return; }

  fetch(SB + '/rest/v1/spot?select=section&id=eq.' + encodeURIComponent(id),
        { headers:{ apikey:KEY, Authorization:'Bearer ' + KEY } })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      var s = (rows && rows[0] && rows[0].section) || '';
      start(MAP[s] || FALLBACK);
    })
    .catch(function(){ start(FALLBACK); });
})();
</script>
<script src="/assets/app.js" defer></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<script>
/* ============================================================
   정보SPOT 상세 — 여섯 갈래가 이 한 화면을 함께 씁니다.

   왜 갈래마다 상세 화면을 따로 두지 않았나
     담는 항목과 보여 주는 모양이 모두 같습니다.
     다른 것은 「목록으로」가 어느 목록을 가리키는지 하나뿐입니다.
     그래서 글의 갈래(section)를 먼저 한 번 물어보고,
     그 답에 맞는 목록 주소를 넣은 다음 공용 엔진을 띄웁니다.
   ============================================================ */
(function(){
  var SB  = 'https://ptdxzxkgddvkusamkiol.supabase.co';
  var KEY = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';

  /* 갈래 → 목록 화면 · 화면 이름 */
  var MAP = {
    '페스티벌':     { list:'festival.html',  name:'페스티벌정보' },
    '콩쿨':         { list:'concours.html',  name:'국내/외콩쿨정보' },
    '지원금':       { list:'funding.html',     name:'지원금 / 정책자금정보' },
    '공연정보':     { list:'concert.html',     name:'공연정보' },
    '관련사이트':   { list:'sites.html',       name:'관련사이트' },
    '음원영상':     { list:'media.html',       name:'음원 / 동영상' }
  };
  var FALLBACK = { list:'index.html', name:'정보SPOT' };

  /* 갈래마다 설명 한 줄 — 커뮤니티 상세 화면처럼 어느 게시판인지 알려 줍니다 */
  var LEAD = {
    '페스티벌':   '국내외 음악 페스티벌의 개최지·기간·참가 안내를 모았습니다.',
    '콩쿨':       '국내외 음악 콩쿨의 부문·일정·접수 안내를 한곳에 모았습니다.',
    '지원금':     '창작·단체·국제교류 지원사업과 정책자금 공모 안내입니다.',
    '공연정보':   '국내에서 열리는 클래식 공연 일정을 모았습니다.',
    '관련사이트': '클래식 음악과 관련된 기관·단체·자료 사이트를 모았습니다.',
    '음원영상':   '감상할 수 있는 음원과 연주 영상을 모았습니다.'
  };

  function start(info){
    /* 화면 위쪽 표시와 「목록으로」 단추들을 갈래에 맞춥니다 */
    var h = document.getElementById('pvTitle');
    if (h) h.textContent = info.name;
    var c = document.getElementById('pvCrumb');
    if (c) { c.textContent = info.name; c.className = ''; c.setAttribute('href', '/spot/' + info.list); }
    var ld = document.getElementById('pvLead');
    if (ld && info.lead) ld.textContent = info.lead;
    ['.pv-tolist-m', '.pv-listtab'].forEach(function(sel){
      var el = document.querySelector(sel);
      if (el) el.setAttribute('href', '/spot/' + info.list);
    });
    document.title = info.name + ' · OPUSCLAM';

    OCBoard.view({
      table:'spot',
      listPage:'/spot/' + info.list,
      viewPage:'spot-view.html',
      writePage:'/spot/spot-write-' + info.list,
      writeRole:'member', docView:true,
      incrementFn:'spot_view_inc',
      commentsTable:'spot_comments',
      /* 영상이 있으면 사진 대신 플레이어를 놓습니다 */
      videoField:'video_id',
      koField:'title_ko',
      extraLinks:[
        { col:'video_url', label:'음원 · 동영상 보기' },
        { col:'source_url', label:'원문 출처' }
      ],
      enhance:{ label:'정보보강하기', db:'spot', email:'contact@opusclam.com' }
    });
  }

  var id = new URLSearchParams(location.search).get('id');
  if (!id) { start(FALLBACK); return; }

  fetch(SB + '/rest/v1/spot?select=section&id=eq.' + encodeURIComponent(id),
        { headers:{ apikey:KEY, Authorization:'Bearer ' + KEY } })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      var sec = (rows && rows[0] && rows[0].section) || '';
      var info = MAP[sec] || FALLBACK;
      /* 갈래별 설명을 함께 넘깁니다 */
      if (LEAD[sec]) info = { list: info.list, name: info.name, lead: LEAD[sec] };
      start(info);
      linkPersons(id);
      if (sec === '공연정보') concertHead(id);
    })
    .catch(function(){ start(FALLBACK); });

  /* ============================================================
     공연정보 머리 — 시안(04_공연정보_view)의 모양

     왼쪽에 포스터, 오른쪽에 일시·장소 표와 「예매하기」 를 놓습니다.

     예매 주소를 왜 KOPIS 로 잇는가
       KOPIS 목록 API 는 예매처 주소를 주지 않습니다. 상세 API 에는 있지만,
       공연마다 상세를 부르면 예전처럼 시간이 터집니다(그래서 걷어냈던 일이 있습니다).
       공연 번호로 KOPIS 공연 페이지를 만들 수 있으니 그곳으로 잇습니다.
       누르면 그 공연의 자세한 안내와 예매처를 볼 수 있습니다.

     상세 API 에만 있는 것(출연진·공연시간·관람연령)은 표에 넣지 않습니다.
     빈 칸을 두는 것보다 없는 채로 두는 편이 깔끔합니다.
     ============================================================ */
  function concertHead(vid) {
    if (!vid) return;
    fetch(SB + '/rest/v1/spot?select=title,title_ko,thumb_url,date_from,date_to,date_text,'
          + 'venue_name,city,region,category,organizer,kopis_id,kopis_state,link_url'
          + '&id=eq.' + encodeURIComponent(vid),
          { headers:{ apikey:KEY, Authorization:'Bearer ' + KEY } })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var o = rows && rows[0];
        if (!o) return;
        drawConcert(o);
      })
      .catch(function(){});
  }

  function drawConcert(o) {
    var tries = 0;
    var tick = setInterval(function(){
      var body = document.querySelector('.board-view .bv-body')
              || document.querySelector('.board-view');
      tries++;
      if (!body) { if (tries > 40) clearInterval(tick); return; }
      clearInterval(tick);
      if (document.getElementById('spConcert')) return;

      /* 일시 — 하루면 한 날짜, 여러 날이면 기간 */
      var d = function (v) { return String(v || '').slice(0, 10).replace(/-/g, '.'); };
      var df = d(o.date_from), dt = d(o.date_to);
      var when = df;
      if (dt && dt !== df) {
        when += ' ~ ' + (dt.slice(0, 4) === df.slice(0, 4) ? dt.slice(5) : dt);
      }
      if (!when) when = o.date_text || '';

      var rows = '';
      if (when) rows += '<tr><th>일시</th><td>' + esc(when) + '</td></tr>';
      if (o.venue_name) rows += '<tr><th>장소</th><td>' + esc(o.venue_name) + '</td></tr>';
      else if (o.city) rows += '<tr><th>장소</th><td>' + esc(o.city) + '</td></tr>';
      if (o.category) rows += '<tr><th>갈래</th><td>' + esc(o.category) + '</td></tr>';
      if (o.kopis_state) rows += '<tr><th>상태</th><td>' + esc(o.kopis_state) + '</td></tr>';
      if (o.organizer) rows += '<tr><th>주최</th><td>' + esc(o.organizer) + '</td></tr>';

      /* 예매 — 공연 번호가 있으면 KOPIS 공연 페이지로 */
      var buy = '';
      if (o.link_url) {
        buy = '<a class="sc-buy" href="' + esc(o.link_url) + '" target="_blank" rel="noopener">예매하기</a>';
      } else if (o.kopis_id) {
        buy = '<a class="sc-buy" target="_blank" rel="noopener"'
            + ' href="https://www.kopis.or.kr/por/db/pblprfr/pblprfrView.do?menuId=MNU_00020&mt20Id='
            + encodeURIComponent(o.kopis_id) + '">KOPIS 에서 보기 · 예매</a>';
      }

      var wrap = document.createElement('div');
      wrap.id = 'spConcert';
      wrap.className = 'sc-head';
      wrap.innerHTML =
          (o.thumb_url
            ? '<div class="sc-poster"><img src="' + esc(o.thumb_url) + '" alt=""'
              + ' onerror="this.onerror=null;var b=this.closest(\'.sc-poster\');if(b)b.remove()"></div>'
            : '')
        + '<div class="sc-info">'
        +   (rows ? '<table class="sc-table">' + rows + '</table>' : '')
        +   (buy ? '<div class="sc-buywrap">' + buy + '</div>' : '')
        + '</div>';

      body.parentNode.insertBefore(wrap, body);
    }, 120);
  }

  /* ============================================================
     이어진 작곡가 보여 주기 — 오퍼스클램의 자료는 서로 이어져야 합니다

     영상을 모을 때 제목에서 찾아낸 작곡가를 person_ids 에 담아 두었습니다.
     그것을 인물DB 와 맞춰 「이 작곡가 정보 보기」 로 이어 줍니다.
     인물 쪽에서도 「이 사람의 연주 영상」 을 볼 수 있으니 양쪽으로 오갑니다.

     자료가 없으면 아무것도 그리지 않습니다.
     ============================================================ */
  function linkPersons(vid){
    if(!vid) return;
    fetch(SB + '/rest/v1/spot?select=person_ids,matched_names&id=eq.' + encodeURIComponent(vid),
          { headers:{ apikey:KEY, Authorization:'Bearer ' + KEY } })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(rows){
        var ids = (rows && rows[0] && rows[0].person_ids) || [];
        if(!Array.isArray(ids) || !ids.length) return;
        return fetch(SB + '/rest/v1/persons?select=id,name_ko,name_en,era_name,field'
              + '&id=in.(' + ids.join(',') + ')&limit=6',
              { headers:{ apikey:KEY, Authorization:'Bearer ' + KEY } })
          .then(function(r){ return r.ok ? r.json() : []; });
      })
      .then(function(people){
        if(!Array.isArray(people) || !people.length) return;
        draw(people);
      })
      .catch(function(){});
  }

  function draw(people){
    /* 본문이 그려진 뒤에 넣어야 하므로 자리가 나타날 때까지 잠깐 기다립니다 */
    var tries = 0;
    var tick = setInterval(function(){
      var body = document.querySelector('.board-view .bv-body')
              || document.querySelector('.board-view');
      tries++;
      if(!body){ if(tries > 40) clearInterval(tick); return; }
      clearInterval(tick);
      if(document.getElementById('spPersons')) return;

      var wrap = document.createElement('div');
      wrap.id = 'spPersons';
      wrap.className = 'sp-persons';
      var h = '<div class="sp-ph">이 영상과 이어진 인물</div><div class="sp-plist">';
      people.forEach(function(p){
        var nm = p.name_ko || p.name_en || '';
        var sub = [p.era_name, p.field].filter(Boolean).join(' · ');
        var ini = nm.trim().charAt(0) || '?';
        h += '<a class="sp-pcard" href="/db/person-view.html?id=' + encodeURIComponent(p.id) + '">'
           + '<span class="sp-pava">' + esc(ini) + '</span>'
           + '<span class="sp-pbody"><b>' + esc(nm) + '</b>'
           + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span>'
           + '<span class="sp-pgo">인물 정보 →</span></a>';
      });
      h += '</div>';
      wrap.innerHTML = h;
      body.parentNode.insertBefore(wrap, body.nextSibling);
    }, 120);
  }

  function esc(v){
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>
<script src="/assets/app.js" defer></script>

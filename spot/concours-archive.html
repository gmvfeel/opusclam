<style>
/* ============================================================
   국제 콩쿠르 아카이브 — spot/concours-archive.html
   ------------------------------------------------------------
   2026-08-15 · 파트너와 함께 만든 새 갈래

   ★ 무엇을 보여 주나
     다섯 대회 입상자 1,165명을 <b>연도별</b>로 보여 줍니다.
       쇼팽 1927~2025 · 차이콥스키 1958~2023 · 퀸 엘리자베스 1937~2026
       리즈 1963~2024 · 부조니 1949~2025

   ★ 왜 값어치가 있나
     이 기록은 대회 홈페이지에 흩어져 있고, 옛날 것은 찾기 어렵습니다.
     한곳에 모아 <b>연도별로 훑을 수 있게</b> 한 곳이 세계에 거의 없습니다.

   ★ 인물DB 와 아직 이어지지 않았습니다
     이름만으로 자동으로 합치면 동명이인이 엉킵니다. 이어진 사람만
     이름을 누를 수 있게 하고, 나머지는 글자로만 보여 줍니다.
     이어 붙이는 일은 관리자 도구에서 사람이 판단합니다.

   ★ 짜임은 이 파일 안에만 둡니다 — 이 화면 하나만 쓰는 규칙입니다.
     색·글꼴은 style.css 변수를 그대로 씁니다.
   ============================================================ */

/* ★ 2026-08-15 · 히어로와 <b>사이를 벌립니다</b> (파트너 지적)
     본문이 곧바로 붙어 있어 답답했습니다. 다른 정보SPOT 화면은
     board 짜임이 여백을 주는데, 이 화면은 자체 짜임이라 없었습니다. */
/* ★ 2026-08-15 · 다른 화면과 <b>폭을 맞춥니다</b> (파트너 지적)
     이 화면만 1180px·좌우 20px 로 잡아, 왼쪽 대회 목록이 위 히어로
     제목보다 안쪽으로 들어가 어긋나 보였습니다.
   ▶ 이 사이트의 표준은 <b>1360px · 좌우 24px</b> 입니다
     (style.css 의 .pdb-inner · assets/board.css 의 .board).
     같은 값을 쓰면 히어로 제목과 왼쪽 목록이 한 줄에 섭니다. */
.ca{max-width:1360px;margin:0 auto;padding:44px 24px 80px}

/* ══ 두 칸 — 왼쪽 대회 목록 · 오른쪽 기록 ══════════════
   ★ 2026-08-15 · 알약 단추를 <b>왼쪽 목록</b>으로 바꿨습니다 (파트너 지적)
     바로 위 하위 메뉴가 이미 알약이라 <b>같은 것이 두 줄</b> 겹쳐 보였습니다.
     생김새가 같으면 어느 쪽이 화면 메뉴이고 어느 쪽이 이 화면 안의
     고르개인지 헷갈립니다.
   ★ 왼쪽 목록으로 두면 —
       · 대회 이름이 <b>길어도</b> 줄이 안 깨집니다
       · 지금 보는 대회가 또렷합니다
       · 다섯이 아니라 열 곳이 되어도 그대로 씁니다 */
.ca-wrap{display:grid;grid-template-columns:236px minmax(0,1fr);gap:32px;align-items:start}

.ca-side{position:sticky;top:96px}
.ca-side h3{font-family:var(--display);font-size:11px;letter-spacing:.16em;color:var(--text-3);
  font-weight:800;margin:0 0 14px;padding:0 4px}
.ca-nav{display:flex;flex-direction:column;gap:2px}
.ca-nav button{appearance:none;border:0;background:transparent;text-align:left;
  padding:12px 14px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text-2);
  cursor:pointer;font-family:inherit;line-height:1.45;transition:all .15s ease;
  border-left:3px solid transparent}
.ca-nav button:hover{background:var(--paper-2);color:var(--text)}
.ca-nav button.on{background:var(--paper-2);color:var(--violet-2);
  border-left-color:var(--violet-2)}
.ca-nav button i{display:block;font-style:normal;font-size:11.5px;color:var(--text-3);
  font-weight:500;margin-top:3px}
.ca-nav button.on i{color:var(--violet-2);opacity:.75}

/* ── 대회 머리 ───────────────────────────────────────── */
.ca-head{padding:0;margin:0 0 26px}
.ca-head h2{font-size:24px;font-weight:800;margin:0 0 6px;color:var(--text);letter-spacing:-.025em}
.ca-head .en{font-size:13px;color:var(--text-3);margin:0 0 18px}
.ca-head dl{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0;font-size:13px}
.ca-head dt{color:var(--text-3);display:inline;margin-right:7px}
.ca-head dd{color:var(--text-2);display:inline;margin:0;font-weight:600}
.ca-head .wiki{display:inline-block;margin-top:16px;font-size:12.5px;color:var(--violet-2);text-decoration:none}
.ca-head .wiki:hover{text-decoration:underline}

/* ── 찾기 줄 ──────────────────────────────────────────
   ★ 다른 정보SPOT 화면(board.css 의 .board-bar)과 같은 결로 —
     제목 아래 가로 전체 · 돋보기 그림 · 아래 실선으로 목록과 가릅니다. */
.ca-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:0 0 18px;margin:0 0 26px;border-bottom:1px solid var(--line)}
.ca-search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;
  padding:0 15px;height:44px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--paper);transition:border-color .15s ease}
.ca-search:focus-within{border-color:var(--violet-2)}
.ca-search svg{width:17px;height:17px;flex:0 0 auto;color:var(--text-3)}
.ca-search input{flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-size:13.5px;font-family:inherit;color:var(--text)}
.ca-bar > select{height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;
  font-size:13.5px;font-family:inherit;background:var(--paper);color:var(--text);cursor:pointer}
.ca-bar > select:focus{outline:none;border-color:var(--violet-2)}
.ca-count{font-size:13px;color:var(--text-3);margin-left:auto;white-space:nowrap}

/* ── 연도 묶음 ───────────────────────────────────────── */
.ca-year{border-top:1px solid var(--line);padding:22px 0}
.ca-year:first-of-type{border-top:0}
.ca-yhead{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.ca-yhead b{font-family:var(--display);font-size:24px;font-weight:900;color:var(--text);
  letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ca-yhead span{font-size:12.5px;color:var(--text-3)}

.ca-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
.ca-item{display:flex;align-items:center;gap:11px;padding:10px 13px;
  background:var(--paper);border:1px solid var(--line);border-radius:10px}
.ca-item .rk{flex:0 0 auto;min-width:30px;height:26px;padding:0 7px;border-radius:7px;
  display:grid;place-items:center;font-family:var(--display);font-size:12px;font-weight:800;
  background:var(--paper-3);color:var(--text-2)}
/* 1·2·3위는 눈에 띄게 — 금·은·동 */
.ca-item .rk.r1{background:#C9A94E;color:#2a2005}
.ca-item .rk.r2{background:#c3c6ce;color:#2a2a2e}
.ca-item .rk.r3{background:#c8956a;color:#2e1c0c}
.ca-item .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ca-item a.nm{color:var(--violet-2);text-decoration:none}
.ca-item a.nm:hover{text-decoration:underline}
.ca-item .ct{flex:0 0 auto;font-size:11.5px;color:var(--text-3);max-width:110px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ca-empty{text-align:center;padding:60px 20px;color:var(--text-3);font-size:14px}
.ca-note{margin:34px 0 0;padding:16px 18px;border-left:3px solid var(--line-2);
  font-size:12.5px;line-height:1.9;color:var(--text-3)}
.ca-more{display:block;width:100%;margin-top:22px;padding:14px;border:1px solid var(--line-2);
  background:var(--paper);border-radius:11px;font-size:13.5px;font-weight:600;color:var(--text-2);
  cursor:pointer;font-family:inherit}
.ca-more:hover{border-color:var(--violet-2);color:var(--violet-2)}

/* 좁은 화면용 풀다운 — 넓은 화면에서는 감춥니다
   ★ 2026-08-15 · 브라우저 기본 모양이라 밋밋했습니다 (파트너 지적)
     바로 위 하위 메뉴 풀다운(.pdb-subnav-sel)과 <b>같은 결</b>로 맞춥니다 —
     높이 48px · 둥근 모서리 12px · 화살표를 직접 그림.
   ★ 다만 <b>색은 채우지 않습니다.</b> 위 풀다운이 이미 보라로 채워져
     있는데 여기도 채우면 <b>둘이 다툽니다.</b> 이것은 화면 안의
     고르개이므로 테두리만 두고 한 걸음 물러섭니다.
   ★ 화살표는 그림 파일 없이 <b>두 개의 그러데이션</b>으로 그립니다.
     파일을 두면 어두운 모드에서 색을 바꿀 수 없습니다. */
.ca-pick{
  display:none; -webkit-appearance:none; appearance:none;
  width:100%; box-sizing:border-box;
  height:48px; padding:0 44px 0 16px; margin:0 0 22px;
  font-family:inherit; font-size:14.5px; font-weight:700; letter-spacing:-.01em;
  color:var(--text); background-color:var(--paper);
  border:1px solid var(--line-2); border-radius:12px; cursor:pointer;
  background-image:linear-gradient(45deg, transparent 50%, var(--text-2) 50%),
                   linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position:calc(100% - 22px) 21px, calc(100% - 16px) 21px;
  background-size:6px 6px, 6px 6px;
  background-repeat:no-repeat;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.ca-pick:hover{border-color:var(--violet-2)}
.ca-pick:focus{outline:none;border-color:var(--violet-2);
  box-shadow:0 0 0 3px rgba(124,99,176,.14)}

@media(max-width:900px){
  /* ★ 2026-08-15 · 좁은 화면에서는 <b>풀다운</b>으로 (파트너 지적)
       알약을 가로로 펴 보니 다섯이 세 줄로 늘어져 자리를 크게 먹었습니다.
       게다가 바로 위 하위 메뉴가 이미 풀다운이라 결도 어긋났습니다.
     ▶ 목록을 감추고 풀다운 하나만 둡니다. 고르는 값은 같으므로
       두 가지가 <b>서로 따라</b>갑니다(어느 쪽으로 골라도 맞습니다). */
  .ca-wrap{grid-template-columns:1fr;gap:0}
  .ca-side{display:none}
  .ca-pick{display:block}
}
@media(max-width:560px){
  /* 아주 좁으면 찾기와 등수를 <b>두 줄</b>로 — 한 줄에 넣으면
     찾기 칸이 글자 몇 개 넓이로 쪼그라듭니다 */
  .ca-search{flex:1 1 100%}
  .ca-bar > select{flex:1}
  .ca-count{margin-left:0}
}
@media(max-width:640px){
  /* 좁은 화면 좌우 여백도 board.css 와 같은 16px 로 */
  .ca{padding:30px 16px 70px}
  .ca-yhead b{font-size:21px}
}
</style>
</head>

<script>
(function () {
  'use strict';

  var SB_URL = 'https://ptdxzxkgddvkusamkiol.supabase.co';
  var SB_KEY = 'sb_publishable_FDTL3-sQ0c5NVCTA2lif7Q_v6Wee8Wu';

  /* window.__ocSb 싱글턴 — 다른 화면과 같은 방식입니다 */
  function sb() {
    if (window.__ocSb) return window.__ocSb;
    if (!window.supabase || !window.supabase.createClient) return null;
    window.__ocSb = window.supabase.createClient(SB_URL, SB_KEY);
    return window.__ocSb;
  }

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var COMPS = [], CUR = null, ROWS = [], SHOWN = 0;
  var PAGE = 12;                 /* 연도 묶음 단위로 늘려 보여 줍니다 */

  /* ── 대회 목록 ──────────────────────────────────────── */
  async function loadComps() {
    var c = sb();
    if (!c) return;
    var r = await c.from('oc_concours')
      .select('key,name_ko,name_en,country,city,field,founded,cycle_years,wiki_url')
      .neq('hidden', true).order('founded');
    if (r.error) { $('list').innerHTML = '<div class="ca-empty">대회를 불러오지 못했습니다.</div>'; return; }
    COMPS = r.data || [];
    if (!COMPS.length) { $('list').innerHTML = '<div class="ca-empty">아직 담긴 대회가 없습니다.</div>'; return; }

    /* 왼쪽 목록은 자리가 넉넉하므로 <b>여는 나라와 시작 해</b>도 함께
       보여 줍니다. 알약 단추일 때는 넣을 수 없던 것입니다. */
    $('tabs').innerHTML = COMPS.map(function (x, i) {
      var sub = [x.country, x.founded ? x.founded + '년~' : ''].filter(Boolean).join(' · ');
      return '<button data-k="' + esc(x.key) + '"' + (i === 0 ? ' class="on"' : '') + '>'
        + esc(x.name_ko)
        + (sub ? '<i>' + esc(sub) + '</i>' : '')
        + '</button>';
    }).join('');
    [].forEach.call($('tabs').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { pick(b.getAttribute('data-k')); });
    });

    /* 좁은 화면용 풀다운 — 같은 목록을 다른 꼴로 보여 줍니다 */
    $('pick').innerHTML = COMPS.map(function (x) {
      return '<option value="' + esc(x.key) + '">' + esc(x.name_ko)
        + (x.founded ? ' (' + x.founded + '년~)' : '') + '</option>';
    }).join('');
    $('pick').addEventListener('change', function () { pick(this.value); });

    pick(COMPS[0].key);
  }

  /* ── 대회 하나 ──────────────────────────────────────── */
  async function pick(key) {
    CUR = COMPS.filter(function (x) { return x.key === key; })[0];
    if (!CUR) return;

    /* ★ 두 고르개를 <b>함께</b> 맞춥니다. 화면 폭이 바뀌어도 고른 것이
         그대로 보이게 하려는 것입니다 — 하나만 맞추면 폭을 늘렸을 때
         엉뚱한 대회가 켜져 있습니다. */
    [].forEach.call($('tabs').querySelectorAll('button'), function (x) {
      x.classList.toggle('on', x.getAttribute('data-k') === key);
    });
    if ($('pick').value !== key) $('pick').value = key;

    $('head').innerHTML = '<div class="ca-head">'
      + '<h2>' + esc(CUR.name_ko) + '</h2>'
      + '<p class="en">' + esc(CUR.name_en) + '</p>'
      + '<dl>'
      +   (CUR.country ? '<dt>여는 곳</dt><dd>' + esc([CUR.country, CUR.city].filter(Boolean).join(' · ')) + '</dd>' : '')
      +   (CUR.field ? '<dt>부문</dt><dd>' + esc(CUR.field) + '</dd>' : '')
      +   (CUR.founded ? '<dt>시작</dt><dd>' + esc(CUR.founded) + '년</dd>' : '')
      +   (CUR.cycle_years ? '<dt>주기</dt><dd>' + esc(CUR.cycle_years) + '년마다</dd>' : '')
      + '</dl>'
      + (CUR.wiki_url ? '<a class="wiki" href="' + esc(CUR.wiki_url) + '" target="_blank" rel="noopener">위키백과에서 이 대회 보기 &nearr;</a>' : '')
      + '</div>';

    $('list').innerHTML = '<div class="ca-empty">불러오는 중…</div>';
    $('count').textContent = '';

    /* ★ 응답 상한이 있으므로 <b>나눠 받습니다</b>.
         0행이 올 때만 멈춥니다 — 받은 수가 적다고 멈추면 마지막 묶음을
         놓칩니다(다른 수집기에서 겪은 함정과 같습니다). */
    var c = sb(), all = [], from = 0;
    for (;;) {
      var r = await c.from('oc_concours_prize')
        .select('year,edition,rank,rank_no,name_en,name_ko,country,person_id')
        .eq('concours', key)
        .order('year', { ascending: false })
        .order('rank_no', { ascending: true, nullsFirst: false })
        .range(from, from + 499);
      if (r.error) { $('list').innerHTML = '<div class="ca-empty">기록을 불러오지 못했습니다.</div>'; return; }
      var got = r.data || [];
      if (!got.length) break;
      all = all.concat(got);
      from += got.length;
      if (from > 5000) break;         /* 안전장치 */
    }
    ROWS = all;
    SHOWN = PAGE;
    draw();
  }

  /* ── 그리기 ─────────────────────────────────────────── */
  function draw() {
    var q = ($('q').value || '').trim().toLowerCase();
    var rk = $('rank').value;

    var rows = ROWS.filter(function (p) {
      if (q) {
        var hay = ((p.name_en || '') + ' ' + (p.name_ko || '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      if (rk === '1' && p.rank_no !== 1) return false;
      if (rk === 'top3' && !(p.rank_no >= 1 && p.rank_no <= 3)) return false;
      return true;
    });

    $('count').textContent = rows.length
      ? (rows.length.toLocaleString() + '명' + (rows.length !== ROWS.length ? ' / 모두 ' + ROWS.length.toLocaleString() + '명' : ''))
      : '';

    if (!rows.length) {
      $('list').innerHTML = '<div class="ca-empty">'
        + (q || rk ? '찾으시는 조건에 맞는 기록이 없습니다.' : '아직 담긴 기록이 없습니다.') + '</div>';
      return;
    }

    /* 연도별로 묶습니다 */
    var byYear = {}, years = [];
    rows.forEach(function (p) {
      if (!byYear[p.year]) { byYear[p.year] = []; years.push(p.year); }
      byYear[p.year].push(p);
    });
    years.sort(function (a, b) { return b - a; });

    var show = years.slice(0, SHOWN);
    var html = show.map(function (y) {
      var list = byYear[y];
      var ed = list[0].edition;
      return '<div class="ca-year">'
        + '<div class="ca-yhead"><b>' + y + '</b>'
        + '<span>' + (ed ? '제' + ed + '회 · ' : '') + list.length + '명</span></div>'
        + '<div class="ca-list">' + list.map(itemHtml).join('') + '</div>'
        + '</div>';
    }).join('');

    if (years.length > SHOWN) {
      html += '<button type="button" class="ca-more" id="more">'
        + '나머지 ' + (years.length - SHOWN) + '개 회차 더 보기</button>';
    }
    $('list').innerHTML = html;

    var more = $('more');
    if (more) more.addEventListener('click', function () { SHOWN += PAGE; draw(); });
  }

  function itemHtml(p) {
    var r = String(p.rank || '-');
    var cls = 'rk' + (p.rank_no === 1 ? ' r1' : p.rank_no === 2 ? ' r2' : p.rank_no === 3 ? ' r3' : '');
    var label = p.rank_no ? p.rank_no : (r === 'HM' ? '입선' : r === 'F' ? '결선' : r);
    var nm = esc(p.name_ko || p.name_en);

    /* ★ 인물DB 에 <b>이어진 사람만</b> 누를 수 있게 합니다.
         이어지지 않은 이름을 링크로 만들면 누르고 빈 화면이 나옵니다. */
    var name = p.person_id
      ? '<a class="nm" href="/db/person-view.html?id=' + encodeURIComponent(p.person_id) + '">' + nm + '</a>'
      : '<span class="nm">' + nm + '</span>';

    return '<div class="ca-item">'
      + '<span class="' + cls + '">' + esc(label) + '</span>'
      + name
      + (p.country ? '<span class="ct">' + esc(p.country) + '</span>' : '')
      + '</div>';
  }

  /* ── 찾기 ───────────────────────────────────────────── */
  var t = null;
  $('q').addEventListener('input', function () {
    clearTimeout(t);
    t = setTimeout(function () { SHOWN = PAGE; draw(); }, 200);
  });
  $('rank').addEventListener('change', function () { SHOWN = PAGE; draw(); });

  /* Supabase 가 실릴 때까지 기다립니다 */
  (function wait(n) {
    n = n || 0;
    if (sb()) { loadComps(); return; }
    if (n > 40) { $('list').innerHTML = '<div class="ca-empty">준비되지 않았습니다. 새로 고쳐 주십시오.</div>'; return; }
    setTimeout(function () { wait(n + 1); }, 150);
  })();
})();
</script>
